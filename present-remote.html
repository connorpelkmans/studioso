<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Presentation Remote · Studyboard</title>
<link rel="icon" href="favicon.ico">
<style>
:root{--bg:#10172A;--card:#1A2340;--ink:#EEF2FA;--soft:#9AA7C2;--line:rgba(255,255,255,.14);--acc:#7A4FD6;--ok:#5FD49A;--warn:#F5B94A;--over:#FF6B6B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.long{box-shadow:inset 0 0 0 4px var(--warn)}body.vlong{box-shadow:inset 0 0 0 4px var(--over)}
.top{display:flex;align-items:center;gap:10px}
.top b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--soft);flex:none}.dot.on{background:var(--ok)}
.clock{display:flex;align-items:baseline;justify-content:center;gap:8px}
.clock b{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.clock span{color:var(--soft)}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:30px}
.chip{padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem;background:rgba(255,255,255,.08)}
.p-ok,.p-ahead{background:rgba(54,190,120,.2);color:#7BE0A8}.p-behind{background:rgba(245,166,35,.22);color:#FFC872}.p-over{background:rgba(229,72,77,.25);color:#FF9A9A}
.sp{display:inline-flex;align-items:center;gap:6px}.sp i{width:10px;height:10px;border-radius:50%;background:var(--spc,#fff)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.slide{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.slide b{font-size:1.05rem}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--ok)}
.bar i.warn{background:var(--warn)}.bar i.over{background:var(--over)}
.notes{flex:1;min-height:0;overflow:auto;font-size:1.15rem;line-height:1.5;white-space:pre-wrap}
.notes:empty::before{content:"No speaker notes on this slide.";color:var(--soft);font-size:.95rem}
.next{color:var(--soft);font-size:.9rem}.next b{color:var(--ink)}
.qa{font-size:1.2rem;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
button{font:inherit;color:inherit;border:0;border-radius:18px;background:rgba(255,255,255,.08);min-height:72px;font-weight:700;font-size:1rem;cursor:pointer;touch-action:manipulation}
button.go{background:var(--acc);color:#fff;font-size:1.25rem}
#prev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.8rem;color:var(--soft)}
#prev svg{color:var(--ink)}
button.pp{display:grid;place-items:center;background:transparent}
button.pp i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
button.pp.paused i{border-color:var(--ok);background:rgba(95,212,154,.14);color:var(--ok)}
button:active{transform:scale(.97)}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 10px}.vrow span{flex:1;font-weight:700}
button.sm{min-height:44px;padding:0 14px;font-size:.9rem;border-radius:12px}
.msg{flex:1;display:grid;place-items:center;text-align:center;color:var(--soft);padding:20px}
[hidden]{display:none!important}
</style></head>
<body>
<div class="top"><span class="dot" id="dot" aria-hidden="true"></span><b id="name">Studyboard Remote</b><span class="chip" id="cnt" hidden></span></div>
<div class="msg" id="msg" aria-live="polite">Connecting to your presentation…</div>
<div id="ui" hidden style="display:contents">
  <div class="clock"><b id="clock">0:00</b><span id="tgt"></span></div>
  <div class="chips"><span class="chip" id="pace" hidden></span><span class="chip sp" id="sp" hidden><i></i><span></span></span></div>
  <div class="card"><div class="slide"><b id="title"></b><span id="st"></span></div><div class="bar"><i id="bar"></i></div></div>
  <div class="card notes" id="notes" aria-label="Speaker notes"></div>
  <div class="vrow card" id="vrow" hidden><span id="vtxt"></span><button id="vplay" class="sm">Play</button><button id="vskip" class="sm go">Skip</button></div>
  <div class="next" id="next"></div>
  <div class="btns"><button id="prev" aria-label="Back a slide"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span>Back</span></button><button id="pp" class="pp" aria-label="Pause"></button><button class="go" id="nextb">Next ▶</button></div>
</div>
<script src="vendor/supabase-js-2.117.2.umd.js"></script>
<script src="website/config.js"></script>
<script src="present-remote.js"></script>
</body></html>
