# Keeps your free Supabase project from pausing by pinging it about every 3 days.
# Save this in your GitHub repository as: .github/workflows/keep-supabase-awake.yml
# It needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (your publishable key).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # 14:17 UTC every third day
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_KEY secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL%/}/rest/v1/items?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered with HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi

      - name: Check out the repository
        uses: actions/checkout@v4

      # GitHub switches off scheduled jobs in public repositories after 60 days without any commits.
      # This makes a tiny commit every 45 days so the ping never stops.
      - name: Keep this schedule switched on
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            mkdir -p .github
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
            git config user.name "studioso-keepalive"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/last-keepalive.txt
            git commit -m "Keep the Supabase ping schedule active"
            git push
          else
            echo "Recent commit found, nothing to do."
          fi
