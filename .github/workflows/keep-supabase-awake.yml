# Keeps your free Supabase project from pausing by pinging it about every 3 days.
# Save this in your GitHub repository as: .github/workflows/keep-supabase-awake.yml
# It needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (your publishable key).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # 14:17 UTC every third day
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# Read-only: it only pings Supabase. (The repository is private, where GitHub doesn't switch off idle schedules, so no keep-alive commit is needed.)
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_KEY secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL%/}/rest/v1/items?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered with HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi

