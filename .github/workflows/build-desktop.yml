# Active copy for the flat repository layout
name: Build Studyboard desktop app

# Releases: pushing a v* tag builds the signed + notarized Mac DMG and

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "unsigned (default builds), signed (Developer ID + notarized DMG, and signed Windows installer if its secrets exist), mas (Mac App Store package) or msstore (Microsoft Store MSIX packages)"
        type: choice
        options: [unsigned, signed, mas, msstore]
        default: unsigned
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'unsigned'
    needs: [checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: macos-15-intel
            script: dist:mac-intel
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Studyboard-unsigned-${{ matrix.os }}
          path: ${{ matrix.files }}

  publish-unsigned:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'unsigned'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Studyboard-unsigned-*
          merge-multiple: true
          path: release
      - name: Version
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Is the token set?
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: '[ -n "$RELEASES_TOKEN" ] || { echo "::error::Add the RELEASES_TOKEN repository secret (fine-grained token, Contents: read and write on connorpelkmans/installers)"; exit 1; }'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: connorpelkmans/installers
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.ver.outputs.v }}
          name: Studyboard ${{ steps.ver.outputs.v }}
          body: "Unsigned installers: Windows and macOS may warn before opening them."
          files: release/*

  mac-signed:
    if: (github.event_name == 'workflow_dispatch' && inputs.kind == 'signed') || startsWith(github.ref, 'refs/tags/v')
    needs: [checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Write the notarization key
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - run: npm run check:signed
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: npm run dist:mac-signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REQUIRE_NOTARIZATION: "1"
      - name: Check the DMG is notarized and stapled
        run: |
          for f in dist/*.dmg; do xcrun stapler validate "$f"; spctl -a -t open --context context:primary-signature -vv "$f"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Studyboard-mac-signed
          path: dist/*.dmg

  win-signed:
    if: (github.event_name == 'workflow_dispatch' && inputs.kind == 'signed') || startsWith(github.ref, 'refs/tags/v')
    needs: [checks]
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.creds.outputs.signed }}
    steps:
      - name: Are Windows signing secrets set?
        id: creds
        shell: bash
        run: |
          if [ -n "$AZURE_CLIENT_SECRET" ] || [ -n "$WIN_CSC_LINK" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; echo "::notice::No Windows signing secrets, so no Windows installer is built for the release (unsigned ones come from the build job, as workflow artifacts only)."; fi
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      - if: steps.creds.outputs.signed == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.signed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: steps.creds.outputs.signed == 'true'
        run: npm ci
      - if: steps.creds.outputs.signed == 'true'
        run: npm audit --audit-level=high
      - if: steps.creds.outputs.signed == 'true'
        run: npm run dist:win-signed
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - if: steps.creds.outputs.signed == 'true'
        name: Check the installer is signed
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; if ($s.Status -ne 'Valid') { throw "$($_.Name): signature $($s.Status)" } }
      - if: steps.creds.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Studyboard-win-signed
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac-signed, win-signed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Studyboard-mac-signed
          path: release
      - if: needs.win-signed.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Studyboard-win-signed
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*

  publish-downloads:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac-signed, win-signed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Studyboard-mac-signed
          path: release
      - if: needs.win-signed.outputs.signed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Studyboard-win-signed
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          repository: connorpelkmans/installers
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Studyboard ${{ github.ref_name }}
          files: release/*

  mac-store:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'mas'
    needs: [checks]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Provisioning profile
        run: echo "$MAS_PROFILE_BASE64" | base64 --decode > build-resources/Studyboard_MAS.provisionprofile
        env:
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
      - run: npm run check:store
      - run: npm run dist:mas
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Studyboard-mas
          path: dist/mas*/*.pkg

  ms-store:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'msstore'
    needs: [checks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:msstore
      - run: npm run dist:msstore
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Studyboard-msstore
          path: dist/*.appx
