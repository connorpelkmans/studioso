<!doctype html><html><head><meta charset="utf-8"><title>frame</title>
<style>
html,body{margin:0;width:440px;height:956px;overflow:hidden;background:#0B1F44}
.f{position:relative;width:440px;height:956px;background:radial-gradient(90% 60% at 50% 0%,#24508F 0%,#163A72 45%,#0D2550 100%);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
h1{position:absolute;left:30px;right:30px;top:52px;margin:0;color:#fff;font-size:36px;line-height:1.12;font-weight:800;letter-spacing:-.02em;text-align:center;text-wrap:balance}
/* the whole phone shows, 36 points clear of the bottom; the screen (334 x 726) has the screenshot's exact 440:956 shape, so
   nothing of the app is cut off. Sizes below are the iPhone's own (points) times 334/440 */
.phone{position:absolute;left:50%;top:176px;width:352px;height:744px;margin-left:-176px;border-radius:52px;background:#05101F;padding:9px;box-sizing:border-box;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 2px rgba(255,255,255,.12)}
.screen{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden}
/* the status bar sits over the screen's own top edge, extended up (see setShot), so there's no seam */
.bar{position:absolute;left:0;right:0;top:0;z-index:1;height:calc(100% * 59 / 956);display:grid;grid-template-columns:1fr 104px 1fr;align-items:center;justify-items:center;padding:0 10px;box-sizing:border-box;font-weight:600;font-size:13px;letter-spacing:-.01em}
.bar .ic{display:flex;gap:4px;align-items:center}
/* the time sits out toward the screen's corner, as on the iPhone (centred about 71 points in), the icons mirror it */
.bar > span:first-child{justify-self:start;padding-left:30px}
.bar > .ic{justify-self:end;padding-right:16px}
html.ipad .bar > span:first-child{padding-left:0}
html.ipad .bar > .ic{padding-right:0}
.bar svg{display:block}
/* the home indicator */
.home{position:absolute;left:50%;bottom:6px;z-index:1;width:104px;height:4px;margin-left:-52px;border-radius:2px;background:#000}
.screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
/* the Dynamic Island: 126 x 37 points, 11 points below the top of the screen */
.island{position:absolute;left:50%;top:17px;width:96px;height:28px;margin-left:-48px;border-radius:14px;background:#000}
/* iPad 13" (1032 x 1376 points): a wider headline and an iPad, status bar 24 points */
html.ipad,html.ipad body,html.ipad .f{width:1032px;height:1376px}
html.ipad h1{top:70px;left:80px;right:80px;font-size:58px}
/* the whole iPad shows, 48 points clear of the bottom; its screen (795 x 1060) has the screenshot's 1032:1376 shape */
html.ipad .phone{top:236px;width:827px;height:1092px;margin-left:-413.5px;border-radius:42px;padding:16px}
html.ipad .screen{border-radius:30px}
/* iPadOS: time and date at the top left, out of the way of the sidebar's edge, in the iPad's own small size (12 points) */
html.ipad .bar{height:calc(100% * 24 / 1376);display:flex;justify-content:space-between;padding:1px 22px 0 23px;font-size:9.5px;letter-spacing:.01em}
html.ipad .bar .ic{gap:5px}
html.ipad .bar svg{transform:scale(.85)}
.bar .date{display:none;margin-left:5px;font-weight:500}
/* no time or date on the iPad: only the icons at the top right */
html.ipad .bar > span:first-child{visibility:hidden}
html.ipad .bar .cell{display:none}
html.ipad .bar > span:nth-child(2){display:none}
html.ipad .home{width:240px;margin-left:-120px;bottom:8px;height:5px}
html.ipad .island{display:none}
</style><script>if (location.search.indexOf("ipad") >= 0) document.documentElement.className = "ipad";</script></head><body><div class="f"><h1 id="head"></h1>
<div class="phone"><div class="screen"><div class="bar" id="bar"><span>9:41<span class="date">Tue Oct 20</span></span><span></span><span class="ic">
<svg class="cell" width="15" height="10" viewBox="0 0 18 12"><rect x="0" y="8" width="3.4" height="4" rx="1" fill="currentColor"/><rect x="4.9" y="5.6" width="3.4" height="6.4" rx="1" fill="currentColor"/><rect x="9.8" y="3" width="3.4" height="9" rx="1" fill="currentColor"/><rect x="14.6" y="0" width="3.4" height="12" rx="1" fill="currentColor"/></svg>
<svg width="14" height="10.2" viewBox="-0.7 -0.4 18.4 13.4"><path d="M8.5 12.6L5.74 9.84A3.9 3.9 0 0 1 11.26 9.84Z M4.72 8.82L2.7 6.8A8.2 8.2 0 0 1 14.3 6.8L12.28 8.82A5.35 5.35 0 0 0 4.72 8.82Z M1.68 5.78L-0.27 3.83A12.4 12.4 0 0 1 17.27 3.83L15.32 5.78A9.65 9.65 0 0 0 1.68 5.78Z" fill="currentColor" stroke="currentColor" stroke-width=".7" stroke-linejoin="round"/></svg>
<svg width="22" height="10.5" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.4" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
</span></div><img id="shot" alt=""><div class="home" id="home"></div></div><div class="island"></div></div></div>
<script>
// the status bar takes the colour of the top of the app screen, with dark or light text to suit
window.setShot = (src, head) => new Promise(done => {
  document.getElementById("head").textContent = head;
  const raw = new Image(), img = document.getElementById("shot"), ipad = document.documentElement.className === "ipad";
  raw.onload = () => {
    // the whole screen: the app's top edge stretched up into the status bar's room, then the app below it (no join to see)
    const barPts = ipad ? 24 : 54, appPts = ipad ? 1376 - 24 : 956 - 54, k = raw.naturalHeight / appPts, barPx = Math.round(barPts * k);
    const c = document.createElement("canvas"); c.width = raw.naturalWidth; c.height = raw.naturalHeight + barPx;
    const x = c.getContext("2d");
    x.drawImage(raw, 0, 1, raw.naturalWidth, 1, 0, 0, raw.naturalWidth, barPx + 1);
    x.drawImage(raw, 0, barPx);
    // dark or light status bar text, to suit the app's top edge
    // each side on its own (an iPad's sidebar can be dark under the time while the page under the icons is light)
    const ink = (x0, w) => { const d = x.getImageData(x0, 0, w, 2).data; let l = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) { l += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; } return l / n > 150 ? "#000" : "#fff"; };
    const q = Math.round(c.width / 4), side = document.querySelectorAll("#bar > span");
    side[0].style.color = ink(0, q); side[2].style.color = ink(c.width - q, q);
    const e = x.getImageData(0, c.height - Math.round(10 * k), c.width, 2).data; let lb = 0, nb = 0;
    for (let i = 0; i < e.length; i += 16) { lb += 0.299 * e[i] + 0.587 * e[i + 1] + 0.114 * e[i + 2]; nb++; }
    document.getElementById("home").style.background = lb / nb > 150 ? "#000" : "#fff";
    img.onload = () => done(); img.src = c.toDataURL("image/png");
  };
  raw.src = src;
});
</script></body></html>
