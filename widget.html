<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' app://studioso; font-src app://studioso; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studyboard Today</title>
<link rel="stylesheet" href="app://studioso/vendor/fonts.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
<div class="w">
  <header class="w-head">
    <button class="w-brand" id="openApp" title="Open Studyboard"><span class="w-h1">Today</span><span class="w-date" id="date"></span></button>
    <span class="w-streak" id="streak" hidden></span>
    <button class="w-ic" id="pin" aria-pressed="false" title="Keep on Top" aria-label="Keep on Top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"/><path d="M12 14v6"/></svg></button>
    <button class="w-ic" id="close" title="Hide Widget" aria-label="Hide Widget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <main class="w-body" id="body"></main>
  <footer class="w-foot" id="foot"></footer>
</div>
<script src="widget.js"></script>
</body>
</html>
