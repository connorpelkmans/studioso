<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studioso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1C2433; --muted:#667085; --line:#DFE3EA;
  --accent:#2C55D6; --accent-ink:#FFFFFF; --mark:#FFE14D; --late:#C8352E; --soft:#EEF1F6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1F28; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2B3240;
    --accent:#7F9CFF; --accent-ink:#0F1320; --mark:#8A7414; --late:#FF7A70; --soft:#222834;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1F28; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2B3240;
  --accent:#7F9CFF; --accent-ink:#0F1320; --mark:#8A7414; --late:#FF7A70; --soft:#222834;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{font:700 1.5rem/1.1 var(--display);letter-spacing:-.02em;margin:0;flex:1}
.today{color:var(--muted);font-size:.9rem;margin-top:2px}
.sync{font-size:.8rem;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(20,40,120,.25)}
.fab svg{width:20px;height:20px}

/* Sections */
h2.sec{font:700 1.05rem/1.2 var(--display);margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec .n{font:500 .85rem var(--body);color:var(--muted)}
h2.sec.hl span.t{background:linear-gradient(transparent 45%, var(--mark) 45%, var(--mark) 88%, transparent 88%);padding:0 3px;margin:0 -3px}
h2.sec.late span.t{color:var(--late)}
.summary{font:500 1.9rem/1.15 var(--display);letter-spacing:-.02em;margin:14px 0 4px;max-width:18ch}
.summary-sub{color:var(--muted);margin:0 0 6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;display:flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tasks */
ul.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li.task{display:flex;align-items:flex-start;border-top:1px solid var(--line);position:relative}
li.task:first-child{border-top:0}
li.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.check{flex:none;margin:12px 0 0 14px;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
li.is-done .check{background:var(--c)}
li.is-done .check svg{opacity:1}
.task-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 14px 12px 12px;display:flex;flex-direction:column;gap:3px}
.task-title{font-weight:600;overflow-wrap:anywhere}
li.is-done .task-title{text-decoration:line-through;color:var(--muted);font-weight:500}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.84rem;color:var(--muted)}
.task-meta .tag{color:var(--ink);font-weight:500}
.task-meta .late{color:var(--late);font-weight:600}
.pill{font-size:.75rem;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--ink)}
.pill.hi{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 1.1rem var(--display);margin-bottom:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late)}
.btn.small{padding:6px 12px;font-size:.88rem}
.empty .btn{margin-top:12px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

/* Board */
body.wide .wrap{max-width:1180px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px;align-items:start}
@media (max-width:820px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:12px -18px 0;padding:0 18px 8px;scroll-padding:0 18px;scrollbar-width:none}
  .board::-webkit-scrollbar{display:none}
  .col{flex:0 0 84%;scroll-snap-align:start}
}
.board.dragging{scroll-snap-type:none}
.col{background:var(--soft);border-radius:16px;padding:10px;min-height:220px;transition:box-shadow .15s}
.col.over{box-shadow:inset 0 0 0 2px var(--accent)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font:700 1.02rem var(--display)}
.col-head .sd{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.col-head .n{color:var(--muted);font:500 .85rem var(--body)}
.col-list{display:flex;flex-direction:column;gap:8px;min-height:70px}
.card{position:relative;display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:12px;padding:10px 12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.card-course{font-size:.75rem;font-weight:700;color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.card-title{font-weight:600;margin:2px 0 8px;overflow-wrap:anywhere;line-height:1.35}
.card.is-done .card-title{text-decoration:line-through;color:var(--muted)}
.card-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.card-foot .late{color:var(--late);font-weight:600}
.placeholder{border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(2deg) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.28);cursor:grabbing}
.col-add{border:0;background:none;color:var(--muted);font-weight:600;padding:10px 4px 4px;width:100%;text-align:left}
.prio{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.prio.low{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.prio.med{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.prio.high{background:color-mix(in srgb,#E0673B 20%,transparent);color:color-mix(in srgb,#E0673B 75%,var(--ink))}
.prio.urgent{background:var(--late);color:#fff}
.hint-line{font-size:.85rem;color:var(--muted);margin:10px 0 0}

/* Timeline */
.tl-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.tl-controls h2{flex:1;margin:0;font:700 1.2rem var(--display)}
.segb{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.segb button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:500}
.segb button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px}
.tl{position:relative}
.tl-bg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.tl-bg .we{position:absolute;top:0;bottom:0;background:var(--soft)}
.tl-bg .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--late)}
.tl-row{display:flex;position:relative;z-index:1;height:46px;border-top:1px solid var(--line)}
.tl-headrow{height:24px;border-top:0}
.tl-headrow + .tl-headrow{height:26px}
.tl-label{position:sticky;left:0;z-index:3;flex:none;background:var(--surface);border:0;border-right:1px solid var(--line);text-align:left;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-size:.84rem;font-weight:600;white-space:nowrap;border-radius:0}
.tl-label .tt{overflow:hidden;text-overflow:ellipsis}
.tl-label small{font-weight:400;color:var(--muted);font-size:.72rem}
.tl-label.done .tt{text-decoration:line-through;color:var(--muted)}
.tl-group{height:34px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.tl-group .tl-label{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;font:700 .88rem var(--display);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.tl-group .sd{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.tl-track{position:relative;flex:none}
.tl-m{position:absolute;top:4px;font-size:.78rem;font-weight:700;padding-left:5px;white-space:nowrap;border-left:1px solid var(--line)}
.tl-d{position:absolute;top:4px;text-align:center;font-size:.72rem;color:var(--muted)}
.tl-d.is-today{color:var(--late);font-weight:700}
.tlbar{position:absolute;top:9px;height:28px;border-radius:7px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);font-size:.75rem;font-weight:600;text-align:left;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:10px}
.tlbar.st-doing{background:var(--c);color:#fff}
.tlbar.st-done{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)) 0 5px,var(--surface) 5px 10px);color:var(--muted);text-decoration:line-through;border-style:dashed}
.tlbar.late{box-shadow:inset -5px 0 0 var(--late)}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted);margin-top:10px;align-items:center}
.tl-legend .tlbar{position:static;display:inline-block;width:34px;height:14px;padding:0;vertical-align:middle;margin-right:6px;--c:var(--muted)}

/* Courses */
.course-list{display:grid;gap:12px;margin-top:14px}
.course-card{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.course-card .swatch{width:6px;border-radius:4px;background:var(--c);flex:none}
.course-card .body{flex:1;min-width:0}
.course-card h3{margin:0;font:700 1.1rem/1.25 var(--display)}
.course-card .code{color:var(--muted);font-size:.88rem}
.course-card .stats{display:flex;gap:14px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.course-card .stats b{color:var(--ink)}
.course-card .stats .late{color:var(--late)}

.detail-head{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin:14px 0 4px}
.detail-head h2{margin:0;font:700 1.7rem/1.15 var(--display);letter-spacing:-.02em}
.detail-head .code{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:6px 0;font-weight:500}
.back svg{width:18px;height:18px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.cal-head h2{flex:1;margin:0;font:700 1.3rem var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1/1.05;border:1px solid transparent;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:5px 2px;gap:4px;font-size:.9rem}
.day.out{background:transparent;color:var(--muted);opacity:.55}
.day.is-today .num{background:var(--mark);color:var(--ink);border-radius:6px;padding:0 5px;font-weight:700}
.day[aria-pressed="true"]{border-color:var(--ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:34px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,24,.5)}
@media (max-width:600px){
  dialog{margin:auto 0 0;max-width:100%;width:100%;border-radius:20px 20px 0 0;max-height:90vh}
}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.sheet-head h2{flex:1;margin:0;font:700 1.25rem var(--display)}
.sheet-body{overflow:auto;padding:6px 18px 12px;display:grid;gap:14px}
.sheet-foot{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .spacer{flex:1}
label.f{display:grid;gap:5px;font-size:.88rem;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
legend{font-size:.88rem;font-weight:600;padding:0;margin-bottom:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:7px 4px;border-radius:8px;font-size:.88rem;font-weight:500}
.seg input:checked+span{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.menu-list{display:grid;gap:4px}
.menu-list button,.menu-list label.mi{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:1rem;cursor:pointer}
.menu-list .sw{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* v2 additions */
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important;max-width:720px}
nav.tabs button{font-size:.75rem!important}
.head-actions{display:flex;align-items:center;gap:8px}
#toolbar{display:grid;gap:8px;margin-bottom:4px}
#toolbar [hidden]{display:none!important}
.search-row{display:flex;gap:8px;align-items:center}
.search-row input{flex:1}
.qp{border-radius:6px;padding:1px 8px;background:var(--soft);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.qp .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.search-note{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-top:10px}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.focus-head{display:flex;align-items:flex-start;gap:10px}
.focus-head h2{margin:0;font:700 1.15rem/1.2 var(--display)}
.focus-head h2 span{background:linear-gradient(transparent 50%,var(--mark) 50%,var(--mark) 90%,transparent 90%);padding:0 3px;margin:0 -3px}
.focus-sum{color:var(--muted);font-size:.9rem;margin-top:3px}
.focus-sum b{color:var(--ink)}
.focus-sum .late{color:var(--late)}
.focus ul.tasks{margin-top:12px}
.why{font-size:.78rem;color:var(--muted)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.soon{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--mark);color:#3A3000}
.soon.late{background:var(--late);color:#fff}
.prog{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:8px}
.prog .track{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--surface));overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--c)}
.mini{font-size:.75rem;color:var(--muted)}
.show-old{border:1px dashed var(--line);background:none;border-radius:12px;padding:8px;color:var(--muted);font-weight:600;font-size:.85rem}
.tlbar{touch-action:pan-y}
.tlbar .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c) 40%,transparent);pointer-events:none}
.tlbar .txt{position:relative}
.tlbar.st-doing .fill{background:rgba(255,255,255,.25)}
.tlbar::before,.tlbar::after{content:"";position:absolute;top:5px;bottom:5px;width:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 70%,var(--ink));opacity:0;transition:opacity .15s}
.tlbar::before{left:3px}.tlbar::after{right:3px}
.tlbar:hover::before,.tlbar:hover::after,.tlbar.dragging::before,.tlbar.dragging::after{opacity:.8}
.tlbar.dragging{z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:grabbing}

<script>
(function(){
"use strict";
/* ---------- Basics ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isNum = v => v !== null && v !== "" && v !== undefined && !isNaN(Number(v));
const COLORS = ["#3B6FE0","#1E9E74","#E0673B","#9A4FD1","#D6386F","#1D9BB8","#C79A12","#5E6B7E"];
const TYPES = ["Assignment","Exam","Quiz","Reading","Project","Lab","Other"];
const STATUSES = [["todo","To Do","#8A94A6"],["doing","In Work","#2C55D6"],["done","Complete","#1E9E74"]];
const STATUS_LABEL = {todo:"To Do", doing:"In Work", done:"Complete"};
const PRIO = {low:"Low", med:"Medium", high:"High", urgent:"Urgent"};
const PRIO_W = {urgent:40, high:25, med:10, low:0};
const SPAN = {Assignment:5, Exam:0, Quiz:0, Reading:3, Project:14, Lab:4, Other:3};
const MILESTONE = type => type === "Exam" || type === "Quiz";
// Which fields each task type uses, and what they're called.
const TYPE_CFG = {
  Assignment: {start:"Start Date", due:"Due Date", time:"Due Time", hours:"Hours Needed", prog:"Progress", checklist:"Checklist", step:"Add a step, e.g. Draft answers", link:"Submission Link", notes:"Notes", notesPh:"Instructions, page numbers…", title:"e.g. Homework 3"},
  Project:    {start:"Start Date", due:"Due Date", time:"Due Time", hours:"Hours Needed", prog:"Progress", checklist:"Milestones", step:"Add a milestone, e.g. Proposal approved", link:"Project Link", team:"Team Members", notes:"Notes", notesPh:"Scope, requirements, meeting times…", title:"e.g. Bridge design project"},
  Lab:        {start:"Lab Session", due:"Report Due", time:"Due Time", hours:"Hours Needed", prog:"Progress", checklist:"Pre-Lab Checklist", step:"Add a step, e.g. Read procedure", location:"Lab Room", link:"Instructions Link", notes:"Notes", notesPh:"Equipment, safety notes, data to collect…", title:"e.g. Lab 3: Tensile testing"},
  Reading:    {start:"Start Date", due:"Read By", hours:"Time Needed", prog:"Progress", checklist:"Sections", step:"Add a section, e.g. 4.2 Equilibrium", reading:"What to Read", notes:"Notes", notesPh:"Key ideas, questions for class…", title:"e.g. Read chapter 4"},
  Exam:       {single:true, due:"Exam Date", prep:true, prog:"Preparedness", checklist:"Study Checklist", step:"Add a topic to review, e.g. Trusses", location:"Location", notes:"What It Covers", notesPh:"Chapters, topics, allowed materials…", title:"e.g. Midterm 1"},
  Quiz:       {single:true, due:"Quiz Date", prep:true, prog:"Preparedness", checklist:"Study Checklist", step:"Add a topic to review", location:"Location", notes:"What It Covers", notesPh:"Topics, format, allowed materials…", title:"e.g. Quiz 2"},
  Other:      {start:"Start Date", due:"Due Date", time:"Due Time", hours:"Hours Needed", prog:"Progress", checklist:"Checklist", step:"Add a step", link:"Link", notes:"Notes", notesPh:"Details…", title:"e.g. Register for spring classes"}
};
const cfgOf = type => TYPE_CFG[type] || TYPE_CFG.Other;
const statusLabels = type => MILESTONE(type) ? {todo:"Not Started", doing:"Studying", done:"Taken"} : type === "Reading" ? {todo:"To Read", doing:"Reading", done:"Read"} : STATUS_LABEL;
const LS2 = "coursework:v2", LS1 = "coursework:v1", LSB = "coursework:backups";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CLOSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const CLIP = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px;margin-right:2px"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>';
const REPEAT = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Repeats"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>';

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const fmtShort = s => parse(s).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const fmtDate = s => parse(s).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const mondayOf = s => { const d = parse(s); const wd = (d.getDay() + 6) % 7; return addDays(s, -wd); };
function fmtTime(t){ const [h,m] = t.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0); return d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}); }

/* ---------- State ---------- */
let state = {courses:{}, tasks:{}, files:{}, notes:{}, settings:{capacity:15}, updated:0};
const ui = {tab:"board", courseId:null, filter:"all", q:"", focusOpen:true, showOldDone:false,
  tlMode:"bars", tlZoom:"month", tlScroll:null, tlJump:true, calMonth:null, calDay:null,
  groupBy: (() => { try { return localStorage.getItem("coursework:group") || "none"; } catch(e) { return "none"; } })(), fCourse:"all", fFolder:"", fSort:"date"};
const caps = {downloads:null, assets:null};

function normTask(t){
  t = Object.assign({title:"Untitled", courseId:"", type:"Assignment", start:"", due:"", time:"", priority:"med", status:"todo", notes:"", hours:null, checklist:[], pct:0, dependsOn:[], history:[], location:"", link:"", team:"", reading:"", weight:null, difficulty:"med", late:"unknown"}, t);
  if (!DIFF_M[t.difficulty]) t.difficulty = "med";
  if (!LATE_M[t.late]) t.late = "unknown";
  if (!Array.isArray(t.dependsOn)) t.dependsOn = [];
  if (!Array.isArray(t.history)) t.history = [];
  t.pct = Math.max(0, Math.min(100, Number(t.pct) || 0));
  if (!STATUS_LABEL[t.status]) t.status = "todo";
  if (!PRIO[t.priority]) t.priority = "med";
  if (!Array.isArray(t.checklist)) t.checklist = [];
  if (!isDate(t.due)) t.due = "";
  if (!isDate(t.start)) t.start = "";
  delete t.earned; delete t.possible;
  return t;
}
function normFile(f){
  f = Object.assign({name:"Untitled", courseId:"", folderId:"other", kind:"file", revs:[], taskIds:[], desc:"", url:""}, f);
  if (!Array.isArray(f.revs)) f.revs = [];
  if (!Array.isArray(f.taskIds)) f.taskIds = [];
  return f;
}
const norm = (kind, o) => kind === "task" ? normTask(o) : kind === "file" ? normFile(o) : kind === "note" ? normNote(o) : o;
function fromArrays(o){
  const s = {courses:{}, tasks:{}, files:{}, notes:{}, settings:Object.assign({capacity:15}, (o && o.settings) || {}), updated:(o && o.updated) || 0};
  ((o && Array.isArray(o.courses)) ? o.courses : []).forEach(c => { if (c && c.id) s.courses[c.id] = clone(c); });
  ((o && Array.isArray(o.tasks)) ? o.tasks : []).forEach(t => { if (t && t.id) s.tasks[t.id] = normTask(clone(t)); });
  ((o && Array.isArray(o.files)) ? o.files : []).forEach(f => { if (f && f.id) s.files[f.id] = normFile(clone(f)); });
  ((o && Array.isArray(o.notes)) ? o.notes : []).forEach(n => { if (n && n.id) s.notes[n.id] = normNote(clone(n)); });
  return s;
}
const toArrays = () => ({v:2, courses:Object.values(state.courses), tasks:Object.values(state.tasks), files:Object.values(state.files), notes:Object.values(state.notes), settings:state.settings, updated:state.updated});
function saveLocal(){ try { localStorage.setItem(LS2, JSON.stringify(toArrays())); } catch(e){} }
function loadLocal(){
  try {
    let r = localStorage.getItem(LS2);
    if (r) { state = fromArrays(JSON.parse(r)); return; }
    r = localStorage.getItem(LS1);
    if (r) state = fromArrays(JSON.parse(r));
  } catch(e){}
}

/* ---------- Cloud sync: one document per task and per course ---------- */
const cloud = {on:false, base:null, tasks:null, courses:null, files:null, notes:null, backups:null};
const KIND_MAP = {task:"tasks", course:"courses", file:"files", note:"notes"};
const queue = new Map(), intended = new Map();
let syncError = false;
function refFor(kind, id){
  if (kind === "meta") return cloud.base;
  return cloud[KIND_MAP[kind]].doc(id);
}
function syncLabel(){
  const el = $("#sync");
  if (!cloud.on && typeof sbConfig === "function" && !inClaude() && sbConfig()) {
    const n = Object.keys(outboxGet()).length;
    el.textContent = !sb ? (n ? "Offline, changes will sync" : "Offline") : !sbUser ? (n ? "Not signed in, changes kept here" : "Not signed in") : n ? "Offline, changes will sync" : "Connecting…";
  }
  else if (!cloud.on) el.textContent = "Saved on this device";
  else if (queue.size) el.textContent = "Saving…";
  else if (syncError) el.textContent = "Not saved, retrying";
  else el.textContent = "Saved";
}
function queueWrite(kind, id, data){
  // Every change is written to the outbox first, so nothing is lost if the page closes before it reaches Supabase.
  outboxAdd(kind, id, data);
  if (!cloud.on) return;
  const key = kind + ":" + id;
  intended.set(key, data === null ? null : clone(data));
  let e = queue.get(key);
  if (!e) { e = {running:false, next:null}; queue.set(key, e); }
  e.ref = refFor(kind, id);
  e.next = {data: data === null ? null : clone(data)};
  syncLabel();
  if (!e.running) runQueue(key, e);
}
async function runQueue(key, e){
  e.running = true;
  let tries = 0;
  while (e.next) {
    const job = e.next; e.next = null;
    try {
      if (job.data === null) await e.ref.delete(); else await e.ref.set(job.data);
      tries = 0; syncError = false;
      outboxDone(key, job.data);
    } catch(err) {
      const code = err && err.code;
      if ((code === "unavailable" || code === "resource_exhausted") && tries < 4) {
        tries++; syncError = true; syncLabel();
        await sleep(900 * tries + Math.random() * 700);
        if (!e.next) e.next = job;
      } else {
        syncError = true; console.warn("Save failed", code, err && err.message);

        if (code === "quota_exceeded") toast("Online storage is full. Delete old tasks or export a backup.");
      }
    }
  }
  e.running = false; queue.delete(key); intended.delete(key); syncLabel();
}
function applySnap(kind, snap){
  const m = {};
  snap.docs.forEach(d => {
    const v = clone(d.data());
    if (!v) return;
    v.id = d.id;
    m[d.id] = norm(kind, v);
  });
  intended.forEach((v, key) => {
    const i = key.indexOf(":"), k = key.slice(0, i), id = key.slice(i + 1);
    if (k !== kind) return;
    if (v === null) delete m[id]; else m[id] = norm(kind, clone(v));
  });
  state[KIND_MAP[kind]] = m;
  saveLocal();
  scheduleRender();
}
const useCap = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

async function initCloud(){
  if (!inClaude()) { initSupabase(); return; }
  useCap("downloads").then(d => { caps.downloads = d; });
  useCap("assets").then(a => { caps.assets = a; scheduleRender(); });
  try {
    const [db, user] = await Promise.all([useCap("db"), useCap("user")]);
    if (!db || !user) { syncLabel(); return; }
    const id = await user.id();
    if (!id) { syncLabel(); return; }
    const base = db.doc("data/users/" + id + "/planner");
    await connectBackend({base, tasks: base.collection("tasks"), courses: base.collection("courses"), files: base.collection("files"), notes: base.collection("notes"), backups: base.collection("backups")});
  } catch(e) {
    console.warn("Cloud unavailable", e);
    cloud.on = false; syncLabel();
  }
}
// Connects a storage backend (Claude's or your Supabase project) and keeps the app in sync with it.
async function connectBackend(b){
  const snap = await b.base.get();
  const md = snap.exists ? clone(snap.data()) : null;
  Object.assign(cloud, {base: b.base, tasks: b.tasks, courses: b.courses, files: b.files, notes: b.notes, backups: b.backups, refresh: b.refresh || null});
  if (md && md.schema === 2) {
    if (md.settings) state.settings = Object.assign({capacity:15}, md.settings);
  } else {
    // First connection: move what's on this device (or older single-document data) into the backend, one record per item.
    const v1 = md && (Array.isArray(md.courses) || Array.isArray(md.tasks)) ? fromArrays(md) : null;
    const localHas = Object.keys(state.tasks).length || Object.keys(state.courses).length || Object.keys(state.notes).length;
    const src = (v1 && (!localHas || (v1.updated || 0) >= (state.updated || 0))) ? v1 : state;
    const items = [...Object.values(src.courses).map(c => ["course", c]), ...Object.values(src.tasks).map(t => ["task", t]),
      ...Object.values(src.files || {}).map(f => ["file", f]), ...Object.values(src.notes || {}).map(n => ["note", n])];
    for (let i = 0; i < items.length; i += 5) {
      await Promise.all(items.slice(i, i + 5).map(([k, o]) => refFor(k, o.id).set(clone(o))));
    }
    await b.base.set({schema:2, settings: src.settings || state.settings, migratedAt: Date.now()});
    state = src; saveLocal();
    if (items.length && !inClaude()) toast(`Moved ${items.length} item${items.length === 1 ? "" : "s"} from this device into your account`);
  }
  cloud.on = true; syncLabel();
  await flushOutbox();
  const got = {task:false, course:false, file:false, note:false};
  const sub = (kind, col) => {
    let retried = false;
    const start = () => col.onSnapshot(s => {
      applySnap(kind, s); got[kind] = true;
      if (got.task && got.course && got.file) maybeAutoBackup();
    }, err => {
      if (err && err.code === "unavailable" && !retried) { retried = true; setTimeout(start, 3000); return; }
      if (err && err.code === "revoked") { cloud.on = false; syncLabel(); }
    });
    start();
  };
  sub("task", cloud.tasks); sub("course", cloud.courses); sub("file", cloud.files); sub("note", cloud.notes);
}

/* ---------- Offline outbox: changes made while disconnected are kept and sent later ---------- */
const OUTBOX = "studioso:outbox";
const outboxGet = () => { try { return JSON.parse(localStorage.getItem(OUTBOX) || "{}") || {}; } catch(e) { return {}; } };
function outboxAdd(kind, id, data){
  if (inClaude() || !sbConfig()) return;
  const o = outboxGet(); o[kind + ":" + id] = data === null ? null : clone(data);
  try { localStorage.setItem(OUTBOX, JSON.stringify(o)); } catch(e) {}
}
function outboxDone(key, data){
  if (inClaude()) return;
  const o = outboxGet();
  if (!(key in o)) return;
  if (JSON.stringify(o[key]) === JSON.stringify(data === null ? null : data)) { delete o[key]; try { localStorage.setItem(OUTBOX, JSON.stringify(o)); } catch(e) {} }
}
let flushing = false;
async function flushOutbox(){
  if (flushing || !cloud.on) return;
  const o = outboxGet(), keys = Object.keys(o);
  if (!keys.length) return;
  flushing = true;
  let sent = 0;
  for (const k of keys) {
    const i = k.indexOf(":"), kind = k.slice(0, i), id = k.slice(i + 1);
    try { const r = refFor(kind, id); if (o[k] === null) await r.delete(); else await r.set(o[k]); delete o[k]; sent++; }
    catch(e) { break; }
  }
  try { localStorage.setItem(OUTBOX, JSON.stringify(o)); } catch(e) {}
  flushing = false;
  if (sent) { toast(`Synced ${sent} change${sent === 1 ? "" : "s"} made while offline`); syncLabel(); }
}

/* ---------- Supabase (used when Studioso runs on its own site) ---------- */
// Optional: paste your Project URL and publishable key here so every device connects without the setup screen.
const SB_DEFAULT = {url: "", key: ""};
const SBJS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
const SB_BUCKET = "studioso-files";
const SB_CFG = "studioso:sb";
let sb = null, sbUser = null, sbStarting = false;
function sbConfig(){
  try { const c = JSON.parse(localStorage.getItem(SB_CFG) || "null"); if (c && c.url && c.key) return c; } catch(e) {}
  return SB_DEFAULT.url && SB_DEFAULT.key ? SB_DEFAULT : null;
}
const sbLocalOnly = () => { try { return localStorage.getItem(SB_CFG) === "\"local\""; } catch(e) { return false; } };
const sbActive = () => !inClaude() && !!sb && !!sbUser;
function sbErr(e){
  const msg = String((e && (e.message || e.error_description || e.error)) || e || "");
  const status = Number(e && (e.status || e.statusCode)) || 0;
  const x = new Error(msg);
  x.code = /fetch|network|timed? ?out|Load failed/i.test(msg) || status === 0 && /fetch/i.test(msg) || status >= 500 ? "unavailable"
    : status === 413 || /too large|exceeded the maximum/i.test(msg) ? "too_large"
    : /quota|storage limit/i.test(msg) ? "quota_or_state"
    : status === 429 ? "rate_limited" : (e && e.code) || "error";
  return x;
}
async function initSupabase(){
  const cfg = sbConfig();
  if (!cfg) { syncLabel(); if (!sbLocalOnly()) setTimeout(() => { if (!dlg.open) sbSetupSheet(); }, 400); return; }
  if (!window.supabase) {
    try { await loadScript(SBJS); }
    catch(e) { syncLabel(); return; } // offline: keep working on this device, the retry timer reconnects later
  }
  if (!sb) {
    sb = window.supabase.createClient(cfg.url, cfg.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: "studioso-auth"}});
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") setTimeout(() => sbNewPasswordSheet(), 300);
      const u = session && session.user;
      if (u && (!sbUser || sbUser.id !== u.id)) { sbUser = u; setTimeout(startSupabaseSync, 0); }
      else if (!u && sbUser && event === "SIGNED_OUT") { sbUser = null; cloud.on = false; caps.assets = null; syncLabel(); scheduleRender(); }
    });
  }
  let session = null;
  try { const r = await sb.auth.getSession(); session = r.data && r.data.session; } catch(e) {}
  if (session) { if (!sbUser) { sbUser = session.user; startSupabaseSync(); } }
  else { syncLabel(); setTimeout(() => { if (!dlg.open && !sbUser) sbSignInSheet(); }, 400); }
}
async function startSupabaseSync(){
  if (sbStarting || !sbUser) return;
  sbStarting = true;
  try {
    const backend = await sbBackend(sb, sbUser.id);
    caps.assets = sbAssets;
    await connectBackend(backend);
    scheduleRender();
  } catch(e) {
    console.warn("Supabase sync failed", e);
    cloud.on = false; syncLabel();
    const m = String(e && e.message || "");
    if (/relation .*items.* does not exist|Could not find the table/i.test(m)) toast("Your Supabase project isn't set up yet. Run the setup SQL, then reload.");
    else if (!/fetch|network/i.test(m)) toast("Couldn't load your data from Supabase: " + m.slice(0, 120));
  }
  sbStarting = false;
}
async function sbBackend(client, userId){
  const T = "items";
  const cache = {task: new Map(), course: new Map(), file: new Map(), note: new Map(), meta: new Map()};
  const listeners = {task: [], course: [], file: [], note: []};
  const snapOf = kind => ({docs: [...cache[kind].entries()].map(([id, d]) => ({id, data: () => d}))});
  const emit = kind => (listeners[kind] || []).forEach(f => { try { f(snapOf(kind)); } catch(e) { console.warn(e); } });
  const loadAll = async () => {
    const fresh = {task: new Map(), course: new Map(), file: new Map(), note: new Map(), meta: new Map()};
    for (let from = 0; ; from += 1000) {
      const {data, error} = await client.from(T).select("kind,id,data").neq("kind", "backup").order("kind").order("id").range(from, from + 999);
      if (error) throw sbErr(error);
      (data || []).forEach(r => { if (fresh[r.kind]) fresh[r.kind].set(r.id, r.data); });
      if (!data || data.length < 1000) break;
    }
    Object.keys(fresh).forEach(k => { cache[k] = fresh[k]; });
  };
  await loadAll();
  const upsert = async (kind, id, d) => {
    const {error} = await client.from(T).upsert({user_id: userId, kind, id, data: d, updated_at: new Date().toISOString()}, {onConflict: "user_id,kind,id"});

}

/* ---------- Changes and undo ---------- */
const mapOf = kind => state[KIND_MAP[kind]];
const getItem = (kind, id) => mapOf(kind)[id] || null;
function historyDiff(a, b){
  const out = [];
  const nameOf = id => { const c = courseOf(id); return c ? courseLabel(c) : "No Course"; };
  const f = (k, label, fmt) => { const x = a[k] || "", y = b[k] || ""; if (String(x) !== String(y)) out.push(`${label}: ${fmt ? fmt(x) : (x || "none")} → ${fmt ? fmt(y) : (y || "none")}`); };
  f("title", "Renamed");
  f("status", "Status", v => STATUS_LABEL[v] || v);
  f("start", "Start", v => v ? fmtShort(v) : "none");
  f("due", "Due", v => v ? fmtShort(v) : "none");
  f("priority", "Priority", v => PRIO[v] || v);
  f("courseId", "Course", nameOf);
  if ((a.pct || 0) !== (b.pct || 0) && (MILESTONE(b.type) || !(b.checklist || []).length)) out.push(`${MILESTONE(b.type) ? "Preparedness" : "Progress"}: ${a.pct || 0}% → ${b.pct || 0}%`);
  f("type", "Type");
  const pa = progress(a), pb = progress(b);
  if (pb.total && (pa.done !== pb.done || pa.total !== pb.total)) out.push(`Checklist: ${pa.done}/${pa.total} → ${pb.done}/${pb.total}`);
  const da = (a.dependsOn || []).join(), db = (b.dependsOn || []).join();
  if (da !== db) out.push("Dependencies changed");
  return out;
}
function setItem(kind, id, obj, record){
  const m = mapOf(kind);
  if (obj === null) delete m[id];
  else {
    const n = norm(kind, clone(obj));
    if (kind === "task" && record) {
      const before = m[id];
      const entries = before ? historyDiff(before, n) : (n.history.length ? [] : ["Created"]);
      if (entries.length) n.history = n.history.concat(entries.map(text => ({at: Date.now(), text}))).slice(-30);
    }
    m[id] = n;
  }
  queueWrite(kind, id, obj === null ? null : m[id]);
}
function applyChanges(changes, label, extra){
  if (!changes.length) return;
  const inverse = changes.map(c => ({kind:c.kind, id:c.id, after: clone(getItem(c.kind, c.id))}));
  changes.forEach(c => setItem(c.kind, c.id, c.after === null ? null : c.after, label !== null));
  state.updated = Date.now();
  saveLocal();
  scheduleRender();
  if (label) toast(label, () => { applyChanges(inverse, null); toast("Undone"); }, extra);
  if (typeof scheduleFolderBackup === "function") scheduleFolderBackup(60000);
  return inverse;
}
function saveSettings(){
  state.updated = Date.now(); saveLocal();
  queueWrite("meta", "meta", {schema:2, settings: state.settings});
}

/* ---------- Backups ---------- */
let autoBackupDone = false;
async function listBackups(){
  if (cloud.on) {
    const s = await cloud.backups.orderBy("at", "desc").limit(10).get();
    return s.docs.map(d => Object.assign({id: d.id}, clone(d.data())));
  }
  try { return (JSON.parse(localStorage.getItem(LSB) || "[]")).sort((a, b) => b.at - a.at); } catch(e) { return []; }
}
async function makeBackup(){
  const snap = {at: Date.now(), courses: Object.values(state.courses), tasks: Object.values(state.tasks), files: Object.values(state.files), notes: Object.values(state.notes)};
  const id = "wk-" + mondayOf(todayISO());
  if (cloud.on) {
    await cloud.backups.doc(id).set(snap);
    const all = await listBackups();
    for (const b of all.slice(6)) { try { await cloud.backups.doc(b.id).delete(); } catch(e){} }
  } else {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(LSB) || "[]"); } catch(e){}
    arr = arr.filter(b => b.id !== id); arr.push(Object.assign({id}, snap));
    arr.sort((a, b) => b.at - a.at);
    try { localStorage.setItem(LSB, JSON.stringify(arr.slice(0, 4))); } catch(e){}
  }
}
async function maybeAutoBackup(){
  if (autoBackupDone) return;
  autoBackupDone = true;
  if (!Object.keys(state.tasks).length && !Object.keys(state.courses).length) return;
  try {
    const all = await listBackups();
    if (!all.length || Date.now() - all[0].at > 7 * 864e5) await makeBackup();
  } catch(e) { console.warn("Backup skipped", e); }
}
function replaceAllChanges(courses, tasks, files, notes){
  const ch = [];
  if (Array.isArray(notes)) {
    const nn = {}; notes.forEach(n => { if (n && n.id) nn[n.id] = n; });
    Object.keys(state.notes).forEach(id => { if (!nn[id]) ch.push({kind:"note", id, after:null}); });
    Object.values(nn).forEach(n => { if (JSON.stringify(normNote(clone(n))) !== JSON.stringify(state.notes[n.id])) ch.push({kind:"note", id:n.id, after:n}); });
  }
  if (Array.isArray(files)) {
    const nf = {}; files.forEach(f => { if (f && f.id) nf[f.id] = f; });
    Object.keys(state.files).forEach(id => { if (!nf[id]) ch.push({kind:"file", id, after:null}); });
    Object.values(nf).forEach(f => { if (JSON.stringify(normFile(clone(f))) !== JSON.stringify(state.files[f.id])) ch.push({kind:"file", id:f.id, after:f}); });
  }
  const nc = {}, nt = {};
  courses.forEach(c => { if (c && c.id) nc[c.id] = c; });
  tasks.forEach(t => { if (t && t.id) nt[t.id] = t; });
  Object.keys(state.tasks).forEach(id => { if (!nt[id]) ch.push({kind:"task", id, after:null}); });
  Object.keys(state.courses).forEach(id => { if (!nc[id]) ch.push({kind:"course", id, after:null}); });
  Object.values(nc).forEach(c => { if (JSON.stringify(c) !== JSON.stringify(state.courses[c.id])) ch.push({kind:"course", id:c.id, after:c}); });
  Object.values(nt).forEach(t => { if (JSON.stringify(normTask(clone(t))) !== JSON.stringify(state.tasks[t.id])) ch.push({kind:"task", id:t.id, after:t}); });
  return ch;
}
/* ---------- Helpers ---------- */
const tasksArr = () => Object.values(state.tasks);
const coursesArr = () => Object.values(state.courses).sort((a, b) => ((a.created || 0) - (b.created || 0)) || String(a.name).localeCompare(String(b.name)));
const courseOf = id => id ? state.courses[id] : null;

const courseLabel = c => c.code || c.name;
function startOf(t){
  if (MILESTONE(t.type) && t.due) return t.due;

  return s;
}
function progress(t){

  if (MILESTONE(t.type)) return {total, done, frac: t.status === "done" ? 1 : (Number(t.pct) || 0) / 100, prep: true};
  return {total, done, frac: total ? done / total : (t.status === "done" ? 1 : (Number(t.pct) || 0) / 100)};
}
function hoursLeft(t){
  if (!isNum(t.hours) || t.status === "done" || MILESTONE(t.type)) return 0;

}
const inFilter = t => ui.filter === "all" || t.courseId === ui.filter;
const inFilterCourse = id => ui.filter === "all" || id === ui.filter;
function matchesQ(t){
  const q = ui.q.trim().toLowerCase();
  if (!q) return true;
  const c = courseOf(t.courseId);
  const hay = [t.title, t.notes, t.type, c && c.name, c && c.code, ...(t.checklist || []).map(i => i.text)].join(" ").toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}
const visibleTasks = () => tasksArr().filter(t => inFilter(t) && matchesQ(t));
function sortTasks(a, b){
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (a.due && !b.due) return -1;
  if (!a.due && b.due) return 1;
  if ((a.time || "") !== (b.time || "")) return (a.time || "99") < (b.time || "99") ? -1 : 1;
  const p = {urgent:0, high:1, med:2, low:3};
  return (p[a.priority] ?? 2) - (p[b.priority] ?? 2);
}
function boardOrder(a, b){
  const ao = typeof a.order === "number" ? a.order : Infinity, bo = typeof b.order === "number" ? b.order : Infinity;
  if (ao !== bo) return ao < bo ? -1 : 1;

function relDue(t){

  let s;

  else if (n === 1) s = "Due tomorrow";
  else if (n < 0 && t.status !== "done") s = n === -1 ? "1 day late" : `${-n} days late`;
  else if (n > 1 && n < 7) s = "Due " + parse(t.due).toLocaleDateString(undefined, {weekday:"long"});
  else s = "Due " + fmtDate(t.due);
  if (t.time) s += ", " + fmtTime(t.time);
  return s;
}

  if (h < 0) return `<span class="soon late">Late</span>`;
  if (h <= 48) {

}

function shiftPlan(rootId){
  const plan = {};
  const get = id => Object.assign({}, state.tasks[id], plan[id] || {});
  const queue = [rootId]; let guard = 0;
  while (queue.length && guard++ < 300) {
    const pid = queue.shift(), pr = get(pid);

    tasksArr().filter(x => (x.dependsOn || []).includes(pid) && x.status !== "done").forEach(sx => {
      const cur = get(sx.id); if (!cur.due) return;
      const st = startOf(cur);

}
const prioBadge = p => `<span class="prio ${esc(p || "med")}">${esc(PRIO[p] || "Medium")}</span>`;
const fmtH = h => (Math.round(h * 10) / 10) + "h";

let toastT, toastUndoFn = null, toastExtraFn = null;

/* ---------- Workload ---------- */
function workloadByDay(ts){
  const per = {};

    const s = startOf(t), n = dayDiff(s, t.due) + 1, h = Number(t.hours) / n;

/* ---------- Focus engine: what to work on today ---------- */
// Typical grade weight (% of the course grade) and hours of work or study, used when a task doesn't say.
const TYPE_DEFAULTS = {Assignment:{w:5, h:3}, Project:{w:15, h:10}, Lab:{w:5, h:4}, Reading:{w:1, h:1.5}, Exam:{w:20, h:8}, Quiz:{w:3, h:2}, Other:{w:2, h:1.5}};
const DIFF_M = {easy:0.7, med:1, hard:1.5};
const DIFF_LABEL = {easy:"Easy", med:"Medium", hard:"Hard"};
const PRIO_M = {low:0.8, med:1, high:1.25, urgent:1.6};
const LATE_M = {none:1.2, penalty:1, free:0.85, unknown:1};
const LATE_LABEL = {unknown:"Not sure", none:"Not accepted", penalty:"Accepted with a penalty", free:"Accepted, no penalty"};
const dailyHours = () => Math.max(0, Number(state.settings.dailyHours ?? 3));
function todayHours(){
  try { const o = JSON.parse(localStorage.getItem("coursework:today") || "null"); if (o && o.d === todayISO() && isNum(o.h)) return Number(o.h); } catch(e) {}
  return dailyHours();
}
function setTodayHours(h){ try { localStorage.setItem("coursework:today", JSON.stringify({d: todayISO(), h})); } catch(e) {} }
const typeDef = t => TYPE_DEFAULTS[t.type] || TYPE_DEFAULTS.Other;
const hasWeight = t => isNum(t.weight) && Number(t.weight) > 0;
const weightOf = t => hasWeight(t) ? Number(t.weight) : typeDef(t).w;
// Total hours the task takes. Exams and Quizzes: study time grows with difficulty and with how much of the grade they're worth.
function effortOf(t){
  const d = typeDef(t), dm = DIFF_M[t.difficulty] || 1;
  if (MILESTONE(t.type)) return d.h * dm * Math.min(2, Math.sqrt(weightOf(t) / d.w));
  return isNum(t.hours) && Number(t.hours) > 0 ? Number(t.hours) : d.h * dm;
}
const remainingOf = t => t.status === "done" ? 0 : effortOf(t) * (1 - progress(t).frac);
// Share of the due day you can still use: evening deadlines leave most of the day, morning ones none. Exam day is mostly taken by the exam.
function dueDayFrac(t){
  if (MILESTONE(t.type)) return 0.25;
  if (!t.time) return 0.75;
  return t.time < "12:00" ? 0 : t.time < "18:00" ? 0.4 : 0.75;
}
// Study hours available from now until the task is due.
function capacityUntil(t, today, dh, th){
  const dl = dayDiff(today, t.due);
  if (dl < 0) return 0;
  if (dl === 0) return th * (MILESTONE(t.type) ? 0.25 : 1);
  return th + dh * (dl - 1) + dh * dueDayFrac(t);
}
const fmtHM = h => { const m = Math.round(h * 60 / 15) * 15; const hh = Math.floor(m / 60), mm = m % 60; return hh && mm ? `${hh}h ${mm}m` : hh ? `${hh}h` : `${mm}m`; };
let FOCUS = null;
function computeFocus(){
  const today = todayISO(), dh = dailyHours(), th = todayHours();
  const open = tasksArr().filter(t => t.status !== "done" && t.due);
  const info = {};
  // 1. Line up everything by deadline and compare the work piling up before each deadline with the time available until then.
  const byDue = open.slice().sort((a, b) => dueDate(a) - dueDate(b));
  let load = 0;
  byDue.forEach(t => {
    const R = remainingOf(t);
    const dead = dayDiff(today, t.due) < 0 && t.late === "none"; // can't be turned in any more, so it doesn't use up time
    if (!dead) load += R;
    const A = capacityUntil(t, today, dh, th);
    info[t.id] = {t, R, L: load, A, rho: load / Math.max(A, 0.25), behind: Math.max(0, load - A), dl: dayDiff(today, t.due)};
  });
  // 2. Score each task.
  Object.values(info).forEach(x => {
    const t = x.t, W = weightOf(t), p = progress(t).frac, ms = MILESTONE(t.type);
    const U = Math.min(1.5, x.rho);                          // time pressure: 1 means every available hour is already spoken for
    const P = x.dl < 0 ? 1.2 : 1 / (1 + x.dl / 2);            // plain closeness of the deadline
    const I = Math.min(1.5, Math.sqrt(W / 10));               // impact on the grade: 10% of the grade = 1
    let score = 0.45 * U + 0.30 * I + 0.25 * P;
    score *= PRIO_M[t.priority] || 1;
    score *= LATE_M[t.late] || 1;
    if (ms && x.dl >= 0 && x.dl <= 7) score *= 1.1;           // study for exams across the week before, not the night before
    if (t.status === "doing") score += 0.05;                  // finish what you've started
    if (!ms && p >= 0.7) score += 0.08;                       // quick win: nearly done
    if (x.dl < 0) { if (t.late === "none") score *= 0.5; else score += 0.6; }
    if (t.difficulty === "hard" && x.dl >= 0 && x.dl <= 5) score += 0.05;
    x.score = score * 100;
    x.W = W; x.p = p;
  });
  // 3. Tasks that others depend on inherit most of their urgency.
  for (let pass = 0; pass < 3; pass++) {
    Object.values(info).forEach(x => (x.t.dependsOn || []).forEach(id => {
      const d = info[id];
      if (d && d.score < x.score * 0.9) { d.score = x.score * 0.9; d.unblocks = x.t; }
    }));
  }
  // 4. Split into what you can work on now, what's waiting on something, and what hasn't started yet.
  const ranked = [], blocked = [], later = [];
  Object.values(info).forEach(x => {
    if (blockers(x.t).length) blocked.push(x);
    else if (x.t.start && x.t.start > today && x.t.status === "todo" && x.rho < 0.9 && !x.unblocks) later.push(x);
    else ranked.push(x);
  });
  ranked.sort((a, b) => b.score - a.score);
  // 5. How much to do today: the task's fair share of each remaining day, more if it can't fit in the days left,
  // hard tasks front-loaded, exam studying spread over the week before.
  ranked.forEach(x => {
    const t = x.t, R = x.R;
    let n = 0;
    if (R > 0) {
      if (x.dl <= 0) n = R;
      else if (MILESTONE(t.type)) n = x.dl > 7 ? 0 : R / Math.min(x.dl, 7);
      else {
        const days = x.dl + (dueDayFrac(t) >= 0.4 ? 1 : 0);
        n = R / Math.max(1, days);

      n = Math.min(R, n);
    }
    x.need = n > 0 ? Math.max(0.25, Math.ceil(n * 4) / 4) : 0;
  });
  let left = th;
  ranked.forEach(x => { const a = Math.min(x.need, Math.max(0, Math.floor(left * 4) / 4)); x.alloc = a; left -= a; });
  // Spare time goes to the top tasks, to get ahead.
  ranked.forEach(x => { if (left >= 0.25 && x.R > x.alloc) { const extra = Math.min(x.R - x.alloc, Math.floor(left * 4) / 4); x.alloc += extra; left -= extra; } });
  const needToday = ranked.reduce((s, x) => s + x.need, 0);
  // 6. The first deadline you're on track to miss at your current pace.
  const crunch = byDue.map(t => info[t.id]).find(x => x.behind >= 0.5 && x.dl >= 0);
  // 7. Plain-language reasons, most important first.
  Object.values(info).forEach(x => {
    const t = x.t, r = [];
    if (x.dl < 0) r.push([100, t.late === "none" ? `Past due, and late work isn't accepted. Check with your instructor.` : `Overdue by ${-x.dl} day${x.dl === -1 ? "" : "s"}`]);
    else r.push([x.dl <= 1 ? 90 : 60 - x.dl, x.dl === 0 ? "Due today" : x.dl === 1 ? "Due tomorrow" : `Due in ${x.dl} days`]);
    if (x.behind >= 0.5 && x.dl >= 0) r.push([95, `About ${fmtHM(x.behind)} short of time before this is due, counting everything due first`]);
    else if (x.rho >= 0.75 && x.dl >= 0) r.push([70, "Little spare time before it's due"]);
    if (hasWeight(t) || x.W >= 10) r.push([50 + x.W, `${hasWeight(t) ? "" : "About "}${Math.round(x.W * 10) / 10}% of your grade`]);
    if (MILESTONE(t.type)) r.push([55, `${Math.round(x.p * 100)}% prepared, about ${fmtHM(x.R)} of study left`]);
    else if (x.R > 0) r.push([40, `About ${fmtHM(x.R)} of work left`]);
    if (x.unblocks) r.push([80, `Needed before ${x.unblocks.title}`]);
    if (t.late === "none" && x.dl >= 0) r.push([45, "No late work accepted"]);
    if (!MILESTONE(t.type) && x.p >= 0.7) r.push([42, "Almost done"]);
    if (t.status === "doing") r.push([30, "Already in progress"]);
    if (t.difficulty === "hard") r.push([35, "Hard, so it helps to start early"]);
    if (t.priority === "urgent" || t.priority === "high") r.push([38, `You marked it ${PRIO[t.priority]}`]);
    const b = blockers(t); if (b.length) r.push([99, `Waiting on ${b.map(y => y.title).join(", ")}`]);
    if (t.start && t.start > today) r.push([20, `Starts ${fmtDate(t.start)}`]);
    x.reasons = r.sort((a, b) => b[0] - a[0]).map(y => y[1]);
  });
  FOCUS = {info, ranked, blocked, later, today, th, dh, planned: th - Math.max(0, left), needToday, crunch};
  return FOCUS;
}
function planRow(x, i, showScore, noRank){
  const t = x.t, c = courseOf(t.courseId);
  return `<li class="plan-row" style="--c:${esc(colorOf(t.courseId))}">
    <span class="rank" ${noRank ? 'aria-hidden="true"' : `aria-label="Rank ${i + 1}"`}>${noRank ? "·" : i + 1}</span>
    <button class="check" data-act="toggle" data-id="${esc(t.id)}" aria-label="Mark complete: ${esc(t.title)}">${CHECK}</button>
    <button class="plan-main" data-act="edit-task" data-id="${esc(t.id)}">

        <ol class="plan-list">${ranked.map((x, i) => planRow(x, i, true)).join("")}</ol>
        ${F.blocked.filter(inView).length ? `<h3 class="fsec">Waiting on Another Task</h3><ul class="plan-list">${F.blocked.filter(inView).map((x, i) => planRow(x, i, true, true)).join("")}</ul>` : ""}
        ${F.later.filter(inView).length ? `<h3 class="fsec">Not Started Yet</h3><ul class="plan-list">${F.later.filter(inView).map((x, i) => planRow(x, i, true, true)).join("")}</ul>` : ""}
      </details>` : ""}
      <details class="plan-how"><summary>How This Is Ranked</summary>
        <p>Each task gets a focus score from four things. <b>Time pressure</b> (45%): tasks are lined up by deadline, and the work piling up before each deadline is compared with the study hours you have until then, so a crowded week shows up before it hits. <b>Grade impact</b> (30%): the task's grade weight, or a typical weight for its type. <b>Closeness of the deadline</b> (25%). The score is then adjusted for your priority, the late-work policy, tasks already in progress, nearly finished work, hard tasks, and tasks that others depend on.</p>
        <p>Today's time is split in score order. Each task gets its fair share of the days left before it's due, more if it can't fit otherwise. Hard tasks are front-loaded, and exam studying is spread over the week before. Work left comes from your hours estimate and progress. For exams and quizzes it comes from difficulty, grade weight and how prepared you are. Set your usual study hours per day in Settings.</p>
      </details>` : ""}
  </section>`;
}

/* ---------- Timeline ---------- */
function viewTimeline(){
  const mode = `<div class="segb" role="group" aria-label="View"><button data-act="tl-mode" data-id="bars" aria-pressed="${ui.tlMode === "bars"}">Bars</button><button data-act="tl-mode" data-id="calendar" aria-pressed="${ui.tlMode === "calendar"}">Calendar</button></div>`;
  return ui.tlMode === "calendar" ? viewCalendar(mode) : viewBars(mode);
}
function viewBars(mode){
  const today = todayISO();
  const all = visibleTasks();
  const ts = all.filter(t => t.due);
  const noDue = all.length - ts.length;
  const dw = {week: 42, month: 22, term: 9}[ui.tlZoom] || 22;
  const LW = window.matchMedia("(min-width:700px)").matches ? 230 : 140;
  let min = addDays(today, -7), max = addDays(today, ui.tlZoom === "term" ? 100 : 40);
  ts.forEach(t => { const s = startOf(t); if (s < min) min = s; if (t.due > max) max = t.due; });
  min = mondayOf(addDays(min, -3)); max = addDays(max, 10);
  const days = dayDiff(min, max) + 1, W = days * dw;
  const x = d => dayDiff(min, d) * dw;

  let bg = "", months = "", dayh = "", work = "";
  for (let i = 0; i < days; i++) {
    const k = addDays(min, i), d = parse(k), wd = d.getDay();
    if (wd === 0 || wd === 6) bg += `<i class="we" style="left:${i*dw}px;width:${dw}px"></i>`;
    if (i === 0 || d.getDate() === 1) months += `<span class="tl-m" style="left:${i*dw}px">${esc(d.toLocaleDateString(undefined, {month: dw >= 20 ? "long" : "short", year: (i === 0 || d.getMonth() === 0) ? "numeric" : undefined}))}</span>`;
    if (dw >= 20) dayh += `<span class="tl-d ${k === today ? "is-today" : ""}" style="left:${i*dw}px;width:${dw}px">${d.getDate()}</span>`;
    else if (wd === 1) dayh += `<span class="tl-d" style="left:${i*dw}px;width:${dw*7}px;text-align:left;padding-left:3px">${d.getDate()}</span>`;
  }
  bg += `<i class="today-line" style="left:${x(today) + dw/2 - 1}px"></i>`;
  const per = workloadByDay(ts);
  const cap = Number(state.settings.capacity) || 0;
  for (let i = 0; i < days; i += 7) {
    const mon = addDays(min, i);
    let h = 0; for (let j = 0; j < 7; j++) h += per[addDays(mon, j)] || 0;
    if (h < 0.05) continue;
    const r = cap ? Math.min(1, h / cap) : 0.3;
    const over = cap && h > cap;
    work += `<span class="wk ${over ? "over" : ""}" style="left:${i*dw + 2}px;width:${7*dw - 4}px;background:color-mix(in srgb,var(--accent) ${Math.round(8 + r * 40)}%,var(--surface))" title="${esc(fmtH(h))} planned the week of ${esc(fmtShort(mon))}">${fmtH(h)}</span>`;
  }

  const groups = coursesArr().map(c => ({c, list: ts.filter(t => t.courseId === c.id)}));
  groups.push({c: null, list: ts.filter(t => !courseOf(t.courseId))});
  let rows = "";
  groups.filter(g => g.list.length).forEach(g => {
    const col = g.c ? g.c.color : "#8A94A6";
    rows += `<div class="tl-row tl-group" style="--c:${esc(col)}"><div class="tl-label" style="width:${LW}px"><span class="sd"></span><span class="tt">${esc(g.c ? g.c.name : "No Course")}</span></div><div class="tl-track" style="width:${W}px"></div></div>`;
    g.list.slice().sort((a, b) => (startOf(a) < startOf(b) ? -1 : startOf(a) > startOf(b) ? 1 : sortTasks(a, b))).forEach(t => {
      const s = startOf(t), left = x(s), w = (dayDiff(s, t.due) + 1) * dw;
      const late = t.status !== "done" && t.due < today;
      const range = s === t.due ? fmtShort(t.due) : `${fmtShort(s)} to ${fmtShort(t.due)}`;
      const p = progress(t);
      const ms = t.type === "Exam" || t.type === "Quiz";
      const bw = ms ? 0 : w;
      const diamond = ms ? `<button class="ms ${t.status === "done" ? "done" : ""} ${late ? "late" : ""}" style="left:${x(t.due) + dw / 2 - 9}px" data-act="edit-task" data-id="${esc(t.id)}" aria-label="${esc(t.title)} milestone, ${esc(fmtShort(t.due))}"></button>` : "";
      rows += `<div class="tl-row" style="--c:${esc(col)}">
        <button class="tl-label ${t.status === "done" ? "done" : ""}" style="width:${LW}px" data-act="edit-task" data-id="${esc(t.id)}"><span class="tt">${esc(t.title)}</span><small>${esc(range)}${isNum(t.hours) && !MILESTONE(t.type) ? ", " + fmtH(Number(t.hours)) : ""}</small></button>
        <div class="tl-track" style="width:${W}px">${bw > 0 ? `<button class="tlbar st-${esc(t.status)} ${late && !ms ? "late" : ""} ${ms ? "prep" : ""}" style="left:${left}px;width:${bw}px" data-act="edit-task" data-id="${esc(t.id)}" data-ms="${ms ? 1 : ""}" aria-label="${esc(t.title)}, ${esc(range)}, ${esc(STATUS_LABEL[t.status])}">${p.frac > 0 && t.status !== "done" ? `<span class="fill" style="width:${(p.frac * 100).toFixed(0)}%"></span>` : ""}<span class="txt">${bw >= 50 ? esc(t.title) : ""}</span></button>` : ""}${diamond}</div>
      </div>`;
    });
  });

  const zoom = [["week","Week"],["month","Month"],["term","Term"]].map(([k, l]) => `<button data-act="tl-zoom" data-id="${k}" aria-pressed="${ui.tlZoom === k}">${l}</button>`).join("");
  const head = `<div class="tl-controls"><h2>Timeline</h2>${mode}<div class="segb" role="group" aria-label="Zoom">${zoom}</div><button class="btn small" data-act="tl-today">Today</button></div>`;
  if (!ts.length) return head + chipsHtml() + searchNote() + `<div class="empty" style="margin-top:14px"><strong>Nothing to Show Yet</strong>Tasks appear here once they have a due date. Each bar runs from the task's start date to its due date.${noDue ? `<br>${noDue} task${noDue === 1 ? " has" : "s have"} no due date.` : ""}</div>`;
  return head + chipsHtml() + searchNote() + `<div class="tl-scroll" data-today="${x(today)}" data-dw="${dw}">
      <div class="tl" style="width:${LW + W}px" data-lw="${LW}">
        <div class="tl-bg" style="left:${LW}px;width:${W}px">${bg}</div>
        <div class="tl-row tl-headrow"><div class="tl-label" style="width:${LW}px"></div><div class="tl-track" style="width:${W}px">${months}</div></div>
        <div class="tl-row tl-headrow"><div class="tl-label" style="width:${LW}px"></div><div class="tl-track" style="width:${W}px">${dayh}</div></div>
        <div class="tl-row tl-work"><div class="tl-label" style="width:${LW}px">Hours per Week${cap ? `<small>Limit ${cap}h</small>` : ""}</div><div class="tl-track" style="width:${W}px">${work}</div></div>
        ${rows}
      </div></div>
    <div class="tl-legend"><span><i class="ms-key"></i>Exam or Quiz</span><span><i class="dep-key"></i>Depends On</span><span><i class="tlbar st-todo"></i>To Do</span><span><i class="tlbar st-doing"></i>In Work</span><span><i class="tlbar st-done"></i>Complete</span><span><i class="tlbar late"></i>Past Due</span></div>
    <p class="hint-line">Drag a bar to move it, or drag either end to change the start or due date. On a phone, press and hold a bar first. Diamonds mark exam and quiz dates, and you can drag them to a new day too. Arrows show dependencies and turn red when a task starts before the one it depends on is due. Weeks over your hours limit turn red.${noDue ? ` ${noDue} task${noDue === 1 ? " has" : "s have"} no due date and ${noDue === 1 ? "isn't" : "aren't"} shown.` : ""}</p>`;
}
function viewCalendar(mode){

  const byDay = {};
  visibleTasks().forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });

    <div class="cal-head">

      <h2>${esc(m.toLocaleDateString(undefined, {month:"long", year:"numeric"}))}</h2>
      <button class="btn small" data-act="cal-today">Today</button>
      <button class="icon-btn" data-act="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="cal">${dows.join("")}${cells}</div>

    ${dayTasks.length ? taskList(dayTasks) : `<div class="empty">Nothing due. <button class="link-btn" data-act="new-task" data-due="${ui.calDay}">Add a task due this day</button></div>`}`;

/* ---------- Render ---------- */
let renderQueued = false, renderBlocked = false;
function scheduleRender(){
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}
function render(){
  if (renderBlocked) { renderQueued = false; setTimeout(scheduleRender, 120); return; }
  computeFocus();
  $("#todayLabel").textContent = new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
  $$("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
  document.body.classList.toggle("wide", ui.tab !== "courses");
  const v = $("#view");
  const y = window.scrollY;
  const nt = $("#noteText"), ntVal = nt ? nt.value : null, ntFocus = nt && document.activeElement === nt, ntSel = nt ? [nt.selectionStart, nt.selectionEnd] : null;
  const nbs = $("#nbScroll"), nbPos = nbs ? [nbs.scrollLeft, nbs.scrollTop] : null;
  v.innerHTML = ui.tab === "timeline" ? viewTimeline() : ui.tab === "courses" ? viewCourses() : ui.tab === "files" ? viewFiles() : ui.tab === "notes" ? viewNotes() : viewBoard();
  $("#fab").style.display = ((ui.tab === "courses" && ui.courseId) || ui.tab === "files" || ui.tab === "notes") ? "none" : "";
  const nbs2 = $("#nbScroll"); if (nbs2 && nbPos) { nbs2.scrollLeft = nbPos[0]; nbs2.scrollTop = nbPos[1]; }
  const nt2 = $("#noteText");
  if (nt2 && ntVal !== null) { nt2.value = ntVal; if (ntFocus) { nt2.focus(); try { nt2.setSelectionRange(ntSel[0], ntSel[1]); } catch(e){} } }
  const sc = $(".tl-scroll");
  if (sc) {
    if (ui.tlJump || ui.tlScroll == null) { sc.scrollLeft = Math.max(0, Number(sc.dataset.today || 0) - (sc.clientWidth < 600 ? 30 : 120)); ui.tlJump = false; }
    else sc.scrollLeft = ui.tlScroll;
    ui.tlScroll = sc.scrollLeft;
    sc.addEventListener("scroll", () => { ui.tlScroll = sc.scrollLeft; }, {passive: true});
  }
  drawDeps();
  if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
}
function drawDeps(){
  const tl = $(".tl"); if (!tl) return;
  const base = tl.getBoundingClientRect();
  const pos = id => {
    const els = $$(`.tl-track [data-id="${CSS.escape(id)}"]`, tl); if (!els.length) return null;
    const rs = els.map(e => e.getBoundingClientRect());
    return {l: Math.min(...rs.map(r => r.left)) - base.left, r: Math.max(...rs.map(r => r.right)) - base.left, y: rs[0].top + rs[0].height / 2 - base.top};
  };
  let paths = "";
  tasksArr().forEach(t => (t.dependsOn || []).forEach(pid => {
    const a = pos(pid), b = pos(t.id), pt = state.tasks[pid];
    if (!a || !b || !pt) return;
    const bad = t.due && pt.due && startOf(t) <= pt.due;
    const x1 = a.r, y1 = a.y, x2 = b.l, y2 = b.y, mx = Math.max(x1 + 8, Math.min(x2 - 8, x1 + 14));
    const d = x2 - 8 > x1 ? `M${x1} ${y1} H${mx} V${y2} H${x2 - 2}` : `M${x1} ${y1} h8 V${(y1 + y2) / 2} H${x2 - 12} V${y2} H${x2 - 2}`;
    paths += `<path d="${d}" class="${bad ? "bad" : ""}" marker-end="url(#${bad ? "arrBad" : "arr"})"/>`;
  }));
  if (!paths) return;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "deps"); svg.setAttribute("width", tl.scrollWidth); svg.setAttribute("height", tl.scrollHeight);
  svg.innerHTML = `<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="head"/></marker><marker id="arrBad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="head bad"/></marker></defs>${paths}`;
  tl.appendChild(svg);
}
/* ---------- Dialogs ---------- */
const dlg = $("#dlg");

  if (form && onSubmit) {
    const run = () => {
      const bad = [...form.querySelectorAll("input[required]")].find(i => !String(i.value).trim());
      if (bad) { bad.focus(); toast("Fill in the " + (bad.closest("label").firstChild.textContent.trim().toLowerCase() || "required field") + " first"); return; }
      let ok;
      try { ok = onSubmit(new FormData(form), form); }

    const btn = form.querySelector("[data-submit]");

      if (e.key === "Enter" && e.target.tagName === "INPUT" && !e.target.hasAttribute("data-noenter") && !["checkbox","radio","button"].includes(e.target.type)) { e.preventDefault(); run(); }
    });
  }
  if (!dlg.open) dlg.showModal();

const seg = (name, opts, val) => `<div class="seg">${opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${v === val ? "checked" : ""}><span>${l}</span></label>`).join("")}</div>`;

function gcalLink(t){
  const c = courseOf(t.courseId);
  const text = (c ? courseLabel(c) + ": " : "") + t.title;
  let dates;
  const d = t.due.replace(/-/g, "");
  if (t.time) {
    const st = d + "T" + t.time.replace(":", "") + "00";
    const e = parse(t.due); const [h, m] = t.time.split(":").map(Number); e.setHours(h + 1, m);
    dates = st + "/" + iso(e).replace(/-/g, "") + "T" + pad(e.getHours()) + pad(e.getMinutes()) + "00";
  } else dates = d + "/" + addDays(t.due, 1).replace(/-/g, "");
  const details = [t.type, "Priority: " + PRIO[t.priority], t.notes].filter(Boolean).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(text) + "&dates=" + dates + "&details=" + encodeURIComponent(details);
}

    tfAttach.innerHTML = `<option value="">Attach a file…</option>` + grp("This course", cands.filter(f => (f.courseId || "") === cid)) + grp("Other files", cands.filter(f => (f.courseId || "") !== cid));
    $("#tfUpload").hidden = !caps.assets;

  tfAttach.addEventListener("change", () => { if (tfAttach.value) { attached.add(tfAttach.value); drawFiles(); } });
  tfFiles.addEventListener("click", e => { const b = e.target.closest("[data-f-rm]"); if (b) { attached.delete(b.dataset.fRm); drawFiles(); } });
  $("#tfUpload").addEventListener("click", () => $("#tfFile").click());

function deleteTask(id){
  const t = state.tasks[id]; if (!t) return;
  const later = t.seriesId ? tasksArr().filter(x => x.seriesId === t.seriesId && x.id !== id && x.due >= t.due) : [];
  if (!later.length) { dlg.close(); applyChanges([{kind:"task", id, after:null}], `Deleted ${t.title}`); return; }
  openSheet(`<form class="sheet">${head("Delete Repeating Task")}<div class="sheet-body"><p style="margin:0">${esc(t.title)} repeats. Delete just this one, or this one and the ${later.length} after it?</p></div>
    <div class="sheet-foot"><button type="button" class="btn" data-act="close">Cancel</button><span class="spacer"></span><button type="button" class="btn" id="delOne">Just this one</button><button type="button" class="btn primary" id="delAll" style="background:var(--late);border-color:var(--late);color:#fff">This and later</button></div></form>`);
  $("#delOne").addEventListener("click", () => { dlg.close(); applyChanges([{kind:"task", id, after:null}], `Deleted ${t.title}`); });
  $("#delAll").addEventListener("click", () => { dlg.close(); applyChanges([t, ...later].map(x => ({kind:"task", id:x.id, after:null})), `Deleted ${later.length + 1} tasks`); });
}

        <label class="f">Room<input type="text" name="room" maxlength="80" value="${esc(c.room)}"></label>
      </div>
      <label class="f">Office Hours<input type="text" name="office" maxlength="120" value="${esc(c.office || "")}"></label>
      <fieldset><legend>Color</legend><div class="swatches">${COLORS.map((x, i) => `<label><input type="radio" name="color" value="${x}" ${x === c.color ? "checked" : ""} aria-label="Color ${i + 1}"><span style="--c:${x}"></span></label>`).join("")}</div></fieldset>
      <label class="f">Links <span class="hint">one per line, optionally "Label | url"</span><textarea name="links" placeholder="Syllabus | https://…&#10;Canvas | https://…">${esc(linksText)}</textarea></label>
      <label class="f">Notes<textarea name="notes" maxlength="10000" placeholder="Grading breakdown, exam dates, TA contact…">${esc(c.notes)}</textarea></label>
    </div>
    <div class="sheet-foot">${isNew ? "" : `<button type="button" class="btn danger" data-act="delete-course" data-id="${esc(c.id)}">Delete</button>`}<span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-submit>${isNew ? "Add course" : "Save course"}</button></div>
  </form>`, fd => {
    const name = String(fd.get("name") || "").trim();
    if (!name) return false;
    const links = String(fd.get("links") || "").split("\n").map(s => s.trim()).filter(Boolean).map(line => {
      const i = line.indexOf("|");
      return i > -1 ? {label: line.slice(0, i).trim() || "Link", url: line.slice(i + 1).trim()} : {label: "Link", url: line};
    }).filter(l => safeUrl(l.url));
    const data = {name, code: String(fd.get("code") || "").trim(), instructor: String(fd.get("instructor") || "").trim(),
      schedule: String(fd.get("schedule") || "").trim(), room: String(fd.get("room") || "").trim(), office: String(fd.get("office") || "").trim(),
      color: fd.get("color") || COLORS[0], notes: String(fd.get("notes") || ""), links};
    if (isNew) { const nc = Object.assign({id: uid(), created: Date.now()}, data); applyChanges([{kind:"course", id: nc.id, after: nc}], `Added ${name}`); }
    else { applyChanges([{kind:"course", id: c.id, after: Object.assign(clone(state.courses[c.id] || c), data)}], "Course saved"); }
  });
}

  body.innerHTML = `<p class="status-msg" style="margin:0">Restoring replaces everything with the backup. You can undo right after.</p><div class="backup-list">${list.map((b, i) => `<button data-i="${i}"><span>${esc(new Date(b.at).toLocaleString(undefined, {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}</span><small>${(b.courses || []).length} courses, ${(b.tasks || []).length} tasks</small></button>`).join("")}</div>`;
  body.querySelectorAll("[data-i]").forEach(btn => btn.addEventListener("click", () => {
    const b = list[Number(btn.dataset.i)];
