<script>try{var t=localStorage.getItem("studioso:theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#1C2433; --muted:#667085; --line:#DFE3EA;
  --accent:#2C55D6; --accent-ink:#FFFFFF; --mark:#FFE14D; --late:#C8352E; --soft:#EEF1F6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1F28; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2B3240;
    --accent:#7F9CFF; --accent-ink:#0F1320; --mark:#8A7414; --late:#FF7A70; --soft:#222834;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1F28; --ink:#E9ECF2; --muted:#9AA3B4; --line:#2B3240;
  --accent:#7F9CFF; --accent-ink:#0F1320; --mark:#8A7414; --late:#FF7A70; --soft:#222834;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{font:700 1.5rem/1.1 var(--display);letter-spacing:-.02em;margin:0;flex:1}
.today{color:var(--muted);font-size:.9rem;margin-top:2px}
.sync{font-size:.8rem;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);padding:14px 18px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(20,40,120,.25)}
.fab svg{width:20px;height:20px}

/* Sections */
h2.sec{font:700 1.05rem/1.2 var(--display);margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h2.sec .n{font:500 .85rem var(--body);color:var(--muted)}
h2.sec.hl span.t{background:linear-gradient(transparent 45%, var(--mark) 45%, var(--mark) 88%, transparent 88%);padding:0 3px;margin:0 -3px}
h2.sec.late span.t{color:var(--late)}
.summary{font:500 1.9rem/1.15 var(--display);letter-spacing:-.02em;margin:14px 0 4px;max-width:18ch}
.summary-sub{color:var(--muted);margin:0 0 6px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;display:flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tasks */
ul.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li.task{display:flex;align-items:flex-start;border-top:1px solid var(--line);position:relative}
li.task:first-child{border-top:0}
li.task::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.check{flex:none;margin:12px 0 0 14px;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
li.is-done .check{background:var(--c)}
li.is-done .check svg{opacity:1}
.task-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 14px 12px 12px;display:flex;flex-direction:column;gap:3px}
.task-title{font-weight:600;overflow-wrap:anywhere}
li.is-done .task-title{text-decoration:line-through;color:var(--muted);font-weight:500}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.84rem;color:var(--muted)}
.task-meta .tag{color:var(--ink);font-weight:500}
.task-meta .late{color:var(--late);font-weight:600}
.pill{font-size:.75rem;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--ink)}
.pill.hi{background:color-mix(in srgb,var(--late) 16%,transparent);color:var(--late)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 1.1rem var(--display);margin-bottom:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--late)}
.btn.small{padding:6px 12px;font-size:.88rem}
.empty .btn{margin-top:12px}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}

/* Board */
body.wide .wrap{max-width:1180px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px;align-items:start}
@media (max-width:820px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:12px -18px 0;padding:0 18px 8px;scroll-padding:0 18px;scrollbar-width:none}
  .board::-webkit-scrollbar{display:none}
  .col{flex:0 0 84%;scroll-snap-align:start}
}
.board.dragging{scroll-snap-type:none}
.col{background:var(--soft);border-radius:16px;padding:10px;min-height:220px;transition:box-shadow .15s}
.col.over{box-shadow:inset 0 0 0 2px var(--accent)}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font:700 1.02rem var(--display)}
.col-head .sd{width:10px;height:10px;border-radius:3px;background:var(--sc)}
.col-head .n{color:var(--muted);font:500 .85rem var(--body)}
.col-list{display:flex;flex-direction:column;gap:8px;min-height:70px}
.card{position:relative;display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:12px;padding:10px 12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.card-course{font-size:.75rem;font-weight:700;color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.card-title{font-weight:600;margin:2px 0 8px;overflow-wrap:anywhere;line-height:1.35}
.card.is-done .card-title{text-decoration:line-through;color:var(--muted)}
.card-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.card-foot .late{color:var(--late);font-weight:600}
.placeholder{border:2px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(2deg) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.28);cursor:grabbing}
.col-add{border:0;background:none;color:var(--muted);font-weight:600;padding:10px 4px 4px;width:100%;text-align:left}
.prio{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.prio.low{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.prio.med{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.prio.high{background:color-mix(in srgb,#E0673B 20%,transparent);color:color-mix(in srgb,#E0673B 75%,var(--ink))}
.prio.urgent{background:var(--late);color:#fff}
.hint-line{font-size:.85rem;color:var(--muted);margin:10px 0 0}

/* Timeline */
.tl-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.tl-controls h2{flex:1;margin:0;font:700 1.2rem var(--display)}
.segb{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.segb button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:500}
.segb button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px}
.tl{position:relative}
.tl-bg{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.tl-bg .we{position:absolute;top:0;bottom:0;background:var(--soft)}
.tl-bg .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--late)}
.tl-row{display:flex;position:relative;z-index:1;height:46px;border-top:1px solid var(--line)}
.tl-headrow{height:24px;border-top:0}
.tl-headrow + .tl-headrow{height:26px}
.tl-label{position:sticky;left:0;z-index:3;flex:none;background:var(--surface);border:0;border-right:1px solid var(--line);text-align:left;padding:3px 10px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font-size:.84rem;font-weight:600;white-space:nowrap;border-radius:0}
.tl-label .tt{overflow:hidden;text-overflow:ellipsis}
.tl-label small{font-weight:400;color:var(--muted);font-size:.72rem}
.tl-label.done .tt{text-decoration:line-through;color:var(--muted)}
.tl-group{height:34px;background:color-mix(in srgb,var(--c) 7%,transparent)}
.tl-group .tl-label{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;font:700 .88rem var(--display);background:color-mix(in srgb,var(--c) 7%,var(--surface))}
.tl-group .sd{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.tl-track{position:relative;flex:none}
.tl-m{position:absolute;top:4px;font-size:.78rem;font-weight:700;padding-left:5px;white-space:nowrap;border-left:1px solid var(--line)}
.tl-d{position:absolute;top:4px;text-align:center;font-size:.72rem;color:var(--muted)}
.tl-d.is-today{color:var(--late);font-weight:700}
.tlbar{position:absolute;top:9px;height:28px;border-radius:7px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));color:var(--ink);font-size:.75rem;font-weight:600;text-align:left;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:10px}
.tlbar.st-doing{background:var(--c);color:#fff}
.tlbar.st-done{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)) 0 5px,var(--surface) 5px 10px);color:var(--muted);text-decoration:line-through;border-style:dashed}
.tlbar.late{box-shadow:inset -5px 0 0 var(--late)}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted);margin-top:10px;align-items:center}
.tl-legend .tlbar{position:static;display:inline-block;width:34px;height:14px;padding:0;vertical-align:middle;margin-right:6px;--c:var(--muted)}

/* Courses */
.course-list{display:grid;gap:12px;margin-top:14px}
.course-card{display:flex;gap:14px;align-items:stretch;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.course-card .swatch{width:6px;border-radius:4px;background:var(--c);flex:none}
.course-card .body{flex:1;min-width:0}
.course-card h3{margin:0;font:700 1.1rem/1.25 var(--display)}
.course-card .code{color:var(--muted);font-size:.88rem}
.course-card .stats{display:flex;gap:14px;margin-top:8px;font-size:.88rem;color:var(--muted)}
.course-card .stats b{color:var(--ink)}
.course-card .stats .late{color:var(--late)}

.detail-head{border-left:6px solid var(--c);padding:4px 0 4px 14px;margin:14px 0 4px}
.detail-head h2{margin:0;font:700 1.7rem/1.15 var(--display);letter-spacing:-.02em}
.detail-head .code{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0;font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.notes{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:6px 0;font-weight:500}
.back svg{width:18px;height:18px}

/* Calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.cal-head h2{flex:1;margin:0;font:700 1.3rem var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:2px}
.day{aspect-ratio:1/1.05;border:1px solid transparent;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:5px 2px;gap:4px;font-size:.9rem}
.day.out{background:transparent;color:var(--muted);opacity:.55}
.day.is-today .num{background:var(--mark);color:var(--ink);border-radius:6px;padding:0 5px;font-weight:700}
.day[aria-pressed="true"]{border-color:var(--ink)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:34px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:92vh;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,24,.5)}
@media (max-width:600px){
  dialog{margin:auto 0 0;max-width:100%;width:100%;border-radius:20px 20px 0 0;max-height:90vh}
}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.sheet-head h2{flex:1;margin:0;font:700 1.25rem var(--display)}
.sheet-body{overflow:auto;padding:6px 18px 12px;display:grid;gap:14px}
.sheet-foot{display:flex;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .spacer{flex:1}
label.f{display:grid;gap:5px;font-size:.88rem;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
label.f .lh{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
label.f .lh .req{margin-left:0}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:400}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:6px}
legend{font-size:.88rem;font-weight:600;padding:0;margin-bottom:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:7px 4px;border-radius:8px;font-size:.88rem;font-weight:500}
.seg input:checked+span{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.menu-list{display:grid;gap:4px}
.menu-list button,.menu-list label.mi{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 4px;text-align:left;border-bottom:1px solid var(--line);font-size:1rem;cursor:pointer}
.menu-list .sw{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* v2 additions */
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important;max-width:720px}
nav.tabs button{font-size:.75rem!important}
.head-actions{display:flex;align-items:center;gap:8px}
#toolbar{display:grid;gap:8px;margin-bottom:4px}
#toolbar [hidden]{display:none!important}
.search-row{display:flex;gap:8px;align-items:center}
.search-row input{flex:1}
.qp{border-radius:6px;padding:1px 8px;background:var(--soft);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.qp .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.search-note{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);margin-top:10px}
.focus{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:6px}
.focus-head{display:flex;align-items:flex-start;gap:10px}
.focus-head h2{margin:0;font:700 1.15rem/1.2 var(--display)}
.focus-head h2 span{background:linear-gradient(transparent 50%,var(--mark) 50%,var(--mark) 90%,transparent 90%);padding:0 3px;margin:0 -3px}
.focus-sum{color:var(--muted);font-size:.9rem;margin-top:3px}
.focus-sum b{color:var(--ink)}
.focus-sum .late{color:var(--late)}
.focus ul.tasks{margin-top:12px}
.why{font-size:.78rem;color:var(--muted)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.soon{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--mark);color:#3A3000}
.soon.late{background:var(--late);color:#fff}
.prog{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:8px}
.prog .track{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,var(--surface));overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--c)}
.mini{font-size:.75rem;color:var(--muted)}
.show-old{border:1px dashed var(--line);background:none;border-radius:12px;padding:8px;color:var(--muted);font-weight:600;font-size:.85rem}
.tlbar{touch-action:pan-y}
.tlbar .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c) 40%,transparent);pointer-events:none}
.tlbar .txt{position:relative}
.tlbar.st-doing .fill{background:rgba(255,255,255,.25)}
.tlbar::before,.tlbar::after{content:"";position:absolute;top:5px;bottom:5px;width:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 70%,var(--ink));opacity:0;transition:opacity .15s}
.tlbar::before{left:3px}.tlbar::after{right:3px}
.tlbar:hover::before,.tlbar:hover::after,.tlbar.dragging::before,.tlbar.dragging::after{opacity:.8}
.tlbar.dragging{z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:grabbing}
.tl-tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:600;padding:5px 9px;border-radius:8px;pointer-events:none;white-space:nowrap}
.tl-work{height:40px}
.tl-work .tl-label{font-size:.75rem;color:var(--muted);font-weight:600}
.wk{position:absolute;top:4px;bottom:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--ink);border:1px solid var(--line);overflow:hidden;white-space:nowrap}
.wk.over{color:#fff;background:var(--late)!important;border-color:var(--late)}
.cl-edit{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cl-edit li{display:flex;align-items:center;gap:8px}
.cl-edit input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.cl-edit input[type=text]{flex:1}
.cl-edit li.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.cl-new{display:flex;gap:8px;margin-top:6px}
.cl-new input{flex:1}
.x-btn{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center}
.x-btn svg{width:16px;height:16px}
.toast{display:flex;align-items:center;gap:14px}
.toast.show{pointer-events:auto}
.toast button{border:0;background:none;color:var(--mark);font-weight:700;padding:2px 4px}
.toast button[hidden]{display:none}
.imp-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:48vh;overflow:auto}
.status-msg{color:var(--muted);font-size:.9rem}
.menu-list .sub{display:block;font-size:.8rem;color:var(--muted);font-weight:400}
.menu-list button span,.menu-list label span{display:block}
.cap-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.cap-row input{width:90px}
.backup-list{display:grid;gap:8px}
.backup-list button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.backup-list small{color:var(--muted)}
.link-row{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
[hidden]{display:none!important}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--mark) 30%,var(--surface));border:1px solid color-mix(in srgb,var(--mark) 60%,var(--line))}
.nudge span{flex:1;min-width:220px;font-size:.92rem}
.plan .focus-head{flex-wrap:wrap}
.hours-ctl{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 6px}
.hours-ctl b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.icon-btn.sm{width:30px;height:30px;border-radius:8px;font-size:1.1rem;font-weight:700;line-height:1}
.plan-warn{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--late) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--late) 35%,transparent);font-size:.9rem}
.plan-list{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plan-row{display:flex;align-items:flex-start;gap:4px;border-top:1px solid var(--line);position:relative;padding-left:6px}
.plan-row:first-child{border-top:0}
.plan-row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.plan-row .rank{flex:none;width:24px;margin-top:15px;text-align:center;font:700 .85rem var(--display);color:var(--muted)}
.plan-row .check{margin:12px 0 0 2px}
.plan-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 8px 12px 10px;display:grid;gap:4px}
.plan-main .tag{font-size:.78rem;font-weight:600;color:var(--muted);margin-left:4px}
.why-list{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted)}
.why-list .lead{color:var(--ink);font-weight:600}
.alloc,.score{flex:none;margin:12px 12px 0 0;font-weight:700;font-size:.85rem;border-radius:8px;padding:3px 9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.alloc.idle{background:var(--soft);color:var(--muted)}
.score{background:var(--soft);color:var(--ink)}
.plan-more,.plan-how{margin-top:12px}
.plan-more summary,.plan-how summary{cursor:pointer;font-weight:600;font-size:.9rem}
.plan-how p{font-size:.88rem;color:var(--muted);margin:8px 0 0;max-width:75ch}
.plan-fs{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px}
.plan-fs legend{padding:0 6px}
.plan-hint{margin:0;font-size:.85rem;color:var(--muted)}
.plan-hint b{color:var(--ink)}

.nb-wrap{position:relative;margin-top:10px}
.nb-scroll{overflow:auto;height:calc(100vh - 290px);height:calc(100dvh - 290px);min-height:380px;border-radius:16px;border:1px solid color-mix(in srgb,#7A5230 40%,var(--line));box-shadow:inset 0 2px 10px rgba(60,35,10,.25)}
.nb-board{position:relative;background-color:#C69C6D;background-image:radial-gradient(rgba(90,55,20,.28) 1px,transparent 1.4px),radial-gradient(rgba(255,235,200,.22) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,5px 7px}
:root[data-theme="dark"] .nb-board{background-color:#6E5238}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nb-board{background-color:#6E5238}}
.note{position:absolute;min-height:140px;padding:26px 14px 14px;background:var(--nc);color:#2A2418;border-radius:3px 3px 8px 3px;box-shadow:0 8px 16px rgba(40,25,5,.28),0 1px 2px rgba(0,0,0,.2);transform:rotate(var(--rot));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:.95rem;line-height:1.4;transition:box-shadow .15s,opacity .15s}
.note:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note.dragging{cursor:grabbing;box-shadow:0 18px 32px rgba(40,25,5,.38);transform:rotate(calc(var(--rot) + 3deg)) scale(1.04);pointer-events:none;transition:none;opacity:.95}
.note.dragging.over-target{opacity:.55;transform:scale(.8)}
.note.dim{opacity:.35}
.note.editing{cursor:default;touch-action:auto;user-select:text;-webkit-user-select:text;box-shadow:0 18px 40px rgba(40,25,5,.4)}
.pin{position:absolute;top:6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF8A80,#C62828 60%,#7F0000);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.note-body{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:hidden}
.note-empty{color:rgba(42,36,24,.55);font-style:italic}
.note-tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 22%,rgba(255,255,255,.6));color:color-mix(in srgb,var(--c) 70%,#1a1a1a);margin-bottom:6px;border-left:3px solid var(--c)}
.note-text{width:100%;min-height:120px;border:0;background:rgba(255,255,255,.45);border-radius:6px;padding:8px;font:inherit;color:#2A2418;resize:vertical}
.note-text:focus-visible{outline:2px solid rgba(42,36,24,.4)}
.note-tools{display:grid;gap:8px;margin-top:8px}
.note-colors{display:flex;gap:6px;flex-wrap:wrap}
.nc{width:22px;height:22px;border-radius:50%;border:2px solid rgba(42,36,24,.25);padding:0}
.nc.on{border-color:#2A2418;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.note-course{padding:6px 8px;font-size:14px;background:rgba(255,255,255,.55);border:1px solid rgba(42,36,24,.2);border-radius:8px;color:#2A2418}
.note-btns{display:flex;gap:6px;align-items:center}
.note-btns .nb{border:0;background:rgba(255,255,255,.5);border-radius:8px;width:36px;height:34px;display:grid;place-items:center;color:#2A2418}
.note-btns .nb svg{width:18px;height:18px}
.note-btns .btn{margin-left:auto}
.nb-empty{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:rgba(255,255,255,.85);color:#3A2E1C;border-radius:12px;padding:16px 20px;text-align:center;max-width:300px}
.nb-empty strong{display:block;font:700 1.05rem var(--display)}
.nb-targets{position:absolute;right:14px;bottom:14px;display:flex;gap:12px;pointer-events:none}
.nb-target{pointer-events:auto;width:84px;height:84px;border-radius:18px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ink);box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s,background .15s,border-color .15s;cursor:pointer}
.nb-target.trash{cursor:default}
.nb-target.hot{transform:scale(1.15);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.nb-target.trash.hot{border-color:var(--late);background:color-mix(in srgb,var(--late) 18%,var(--surface));color:var(--late)}
.dragging-note .nb-target{transform:scale(1.05)}
@media (max-width:600px){.nb-target{width:66px;height:66px;border-radius:14px}.nb-scroll{height:calc(100dvh - 300px)}}
.ar-list{display:grid;gap:10px}
.ar-note{background:var(--nc);color:#2A2418;border-radius:6px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ar-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto}
.ar-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.ar-meta .mini{color:rgba(42,36,24,.7)}
.ar-meta .spacer{flex:1}
.ar-meta .link-btn{color:#1F3F9A}
.ar-meta .danger-link{color:#A3241D}

.board-ctl{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.lane{margin-top:16px}
.lane-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 1rem var(--display)}
.lane-head .sd{width:10px;height:10px;border-radius:3px;background:var(--c)}
.lane-head .n{font:500 .82rem var(--body);color:var(--muted)}
.lane .board{margin-top:0}
.lane .col{min-height:110px;border-top:3px solid var(--c)}
.pill.wait{background:color-mix(in srgb,#9A4FD1 16%,transparent);color:color-mix(in srgb,#9A4FD1 80%,var(--ink))}
.pill.risk{background:color-mix(in srgb,#E0673B 20%,transparent);color:color-mix(in srgb,#E0673B 80%,var(--ink))}
.ms{cursor:grab;touch-action:pan-y}
.ms.dragging{cursor:grabbing;box-shadow:0 0 0 2px var(--c),0 6px 14px rgba(0,0,0,.3)}
.card-sub{font-size:.8rem;color:var(--muted);margin:-4px 0 8px;overflow-wrap:anywhere}
.dots i.dd{border-radius:1px;transform:rotate(45deg);width:7px;height:7px;margin:0 1px}
.ms{position:absolute;top:13px;width:18px;height:18px;transform:rotate(45deg);background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--c);border-radius:3px;padding:0;z-index:2}
.ms.done{background:var(--surface)}
.ms.late{box-shadow:0 0 0 2px var(--late)}
.tlbar.prep{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--c) 14%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 22%,var(--surface)) 6px 12px);border-style:dashed}
.tlbar.prep.st-doing{background:color-mix(in srgb,var(--c) 55%,var(--surface));color:#fff}
.ms-key{display:inline-block;width:10px;height:10px;transform:rotate(45deg);background:var(--muted);margin:0 8px 0 3px;border-radius:2px}
.dep-key{display:inline-block;width:26px;height:2px;background:var(--ink);opacity:.6;vertical-align:middle;margin-right:6px;position:relative}
svg.deps{position:absolute;left:0;top:0;pointer-events:none;z-index:2;overflow:visible}
svg.deps path{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1.6}
svg.deps path.bad{stroke:var(--late);stroke-opacity:.9;stroke-dasharray:4 3}
svg.deps path.head{fill:var(--ink);fill-opacity:.55;stroke:none}
svg.deps path.head.bad{fill:var(--late);fill-opacity:.9;stroke:none;stroke-dasharray:none}
.dep-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dep-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:2px 2px 2px 8px;font-size:.84rem;background:var(--surface)}
.dep-chip .x-btn{width:26px;height:26px}
.ftasks .dep-chip{padding:1px 8px;font-size:.75rem}
.tf-files{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.tf-files li{display:flex;align-items:center;gap:8px}
.tf-files a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.hist summary{font-weight:600;font-size:.9rem;cursor:pointer}
details.hist ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.84rem}
details.hist li{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0}
details.hist time{color:var(--muted);white-space:nowrap}
input[type=range]{accent-color:var(--accent);width:100%}
.fwrap{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:12px;align-items:start}
.ftree{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fnode{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;font-weight:600;font-size:.92rem;border:1px solid transparent}
.fnode .sd{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.fnode span:not(.n):not(.sd){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnode .n{color:var(--muted);font-weight:500;font-size:.8rem}
.fnode.sub{padding-left:26px;font-weight:500}
.fnode svg{flex:none;color:var(--muted)}
.fnode.on{background:var(--soft)}
.drop-on{outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 8%,transparent)!important}
.fpane{min-width:0;border-radius:14px}
.fcrumb{font:700 1.15rem var(--display);margin-bottom:8px}
.factions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.factions .spacer{flex:1}
.fsec{display:flex;align-items:center;gap:8px;font:700 .95rem var(--display);margin:18px 0 8px;color:var(--ink)}
.fsec svg{color:var(--muted)}
.fsec .n{font:500 .82rem var(--body);color:var(--muted)}
.flist{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fsec + .flist{margin-top:0}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.fmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:grid;gap:3px}
.fname{font-weight:600;overflow-wrap:anywhere}
.ftasks{display:flex;flex-wrap:wrap;gap:4px}
.ficon{flex:none;width:40px;height:44px;border-radius:7px;display:grid;place-items:center;font-size:.66rem;font-weight:800;letter-spacing:.02em;color:#fff;background:#5E6B7E}
.ficon.k-pdf{background:#C8352E}.ficon.k-image{background:#1D9BB8}.ficon.k-video{background:#9A4FD1}.ficon.k-text{background:#5E6B7E}.ficon.k-link{background:#2C55D6}
.tf-files .ficon{width:28px;height:30px;font-size:.55rem}
.revs{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:4px}
.revs li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}
.revs .spacer{flex:1}
.rev{font-weight:700;font-size:.85rem;border-radius:6px;padding:1px 7px;background:var(--soft)}
@media (max-width:760px){
  .fwrap{grid-template-columns:1fr}
  .ftree{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:6px;gap:6px;scrollbar-width:none}
  .ftree::-webkit-scrollbar{display:none}
  .fgroup{flex-direction:row;gap:6px}
  .fnode{flex:none;white-space:nowrap;border:1px solid var(--line)}
  .fnode.sub{padding-left:10px}
  .fnode.on{border-color:var(--ink)}
}

.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
details summary{cursor:pointer;font-weight:600;font-size:.92rem}
.imp-course{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.imp-course legend{padding:0 6px}
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imp-grid[hidden],#impFillWrap[hidden],.drop[hidden],details[hidden]{display:none}
@media (max-width:480px){.imp-grid{grid-template-columns:1fr}}
.mi-check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.mi-check input{width:18px;height:18px;accent-color:var(--accent)}
.imp-head{display:flex;align-items:center;gap:12px;margin-top:6px}
.imp-head .spacer{flex:1}
.imp-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px}
.imp-fields input,.imp-fields select{width:100%;min-width:0}
.imp-sub>*{min-width:0}
.imp-group .imp-list{overflow:visible;max-height:none}
.imp-group{margin-top:14px}
details *{box-sizing:border-box}
.imp-group summary{cursor:pointer;font-weight:600;font-size:.92rem;margin-bottom:8px}
.imp-row>input[type=checkbox]{margin-top:12px;width:20px;height:20px;flex:none;accent-color:var(--accent)}
.imp-row.off .imp-fields{opacity:.55}
.imp-fields{flex:1;min-width:0;display:grid;gap:6px}
.imp-fields input[type=text]{font-weight:600}
.imp-sub{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.imp-w{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted);min-width:0}
.imp-w input{min-width:0;width:100%}
.imp-w span{white-space:nowrap}
.imp-sub select,.imp-sub input{padding:7px 8px;font-size:14px}
@media (max-width:480px){.imp-sub{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.imp-sub input[type=time]{grid-column:1/-1}}
.imp-flag{font-size:.78rem;font-weight:600;color:var(--muted)}
.imp-flag.warn{color:#9A6400}
:root[data-theme="dark"] .imp-flag.warn{color:var(--mark)}
.imp-src{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-list{max-height:none}

/* ===== Studioso look: notebook spine, graph paper, index cards ===== */
:root{
  --paper:#F2F5FA; --grid:rgba(57,136,254,.075); --surface:#FFFFFF; --ink:#0F1F3D; --navy:#0E2A56; --muted:#5A6A86;
  --line:#D9E2EF; --soft:#EAF0F8; --field:#F7F9FD; --accent:#1F6FEB; --accent-2:#3988FE; --accent-ink:#FFFFFF;
  --sel:#0E2A56; --sel-ink:#FFFFFF; --mark:#FFE45C; --late:#D2382B; --tomato:#E4513B; --leaf:#1E9E74; --warn:#B86A00;
  --spine:#0E2A56; --spine-ink:#C9D7F2; --spine-hi:rgba(255,255,255,.11);
  --shadow:0 1px 2px rgba(14,42,86,.06),0 4px 14px rgba(14,42,86,.06);
  --bg:var(--paper);
  --display:"Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1428; --grid:rgba(96,160,255,.055); --surface:#111E38; --ink:#E7EEFA; --navy:#0E2A56; --muted:#93A3C2;
    --line:#22355C; --soft:#172848; --field:#0D1A33; --accent:#5B9DFF; --accent-2:#6BAAFF; --accent-ink:#071430;
    --sel:#3A6BC4; --sel-ink:#FFFFFF; --mark:#8C7713; --late:#FF7B6E; --tomato:#FF6B55; --leaf:#3CC794; --warn:#F2B04C;
    --spine:#060F24; --spine-ink:#A9BADC; --spine-hi:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1428; --grid:rgba(96,160,255,.055); --surface:#111E38; --ink:#E7EEFA; --navy:#0E2A56; --muted:#93A3C2;
  --line:#22355C; --soft:#172848; --field:#0D1A33; --accent:#5B9DFF; --accent-2:#6BAAFF; --accent-ink:#071430;
  --sel:#3A6BC4; --sel-ink:#FFFFFF; --mark:#8C7713; --late:#FF7B6E; --tomato:#FF6B55; --leaf:#3CC794; --warn:#F2B04C;
  --spine:#060F24; --spine-ink:#A9BADC; --spine-hi:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed;font-size:16px;line-height:1.5}
h1,h2,h3{text-wrap:balance}
.wrap{padding-inline:16px}
/* Logo swaps with the theme */
.brand{display:flex;align-items:center;flex:none}
.brand .logo{height:34px;width:auto;display:block}
.logo-d{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
:root[data-theme="dark"] .logo-l{display:none!important}
:root[data-theme="dark"] .logo-d{display:block!important}
/* Header */
header.top{background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:12px 0 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.top-row{gap:10px}
.top-row > div:first-child{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.today{font:500 .9rem/1.2 var(--display);color:var(--muted);margin:0}
.today .wd{color:var(--ink);font-weight:700;background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 2px}
.sync{font-size:.78rem}
.icon-btn{border-radius:12px;border-color:var(--line);box-shadow:var(--shadow)}
.head-actions{gap:8px}
.pomo-btn{height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;border:1px solid var(--line);background:var(--surface);border-radius:999px;color:var(--tomato);font:700 .9rem var(--display);font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pomo-btn span{color:var(--ink)}

  nav.tabs .nav-pomo.m-short .np-go,nav.tabs .nav-pomo.m-long .np-go{background:var(--leaf)}

/* Type */

input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.seg,.segb{background:var(--field);border-color:var(--line)}
.seg input:checked+span,.segb button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);box-shadow:none}
.chip{border-color:var(--line);box-shadow:0 1px 0 rgba(14,42,86,.04)}

.req{color:var(--late);font-weight:700;margin-left:2px}

dialog{border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(8,20,50,.35)}

.sheet-head{border-bottom:1px solid var(--line);padding-bottom:12px}

  background-color:#FFFEF9;background-image:linear-gradient(to bottom,transparent 38px,rgba(214,57,44,.55) 38px,rgba(214,57,44,.55) 40px,transparent 40px),repeating-linear-gradient(to bottom,transparent 0 27px,rgba(57,136,254,.18) 27px 28px);background-size:100% 100%,100% calc(100% - 40px);background-position:0 0,0 40px;background-repeat:no-repeat,no-repeat}

.alarm-ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tomato) 14%,var(--surface));color:var(--tomato);animation:ring 1s ease-in-out infinite}

.alarm-ring svg{width:38px;height:38px}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.alarm-ring{animation:none}}
@media (max-width:600px){dialog.alarm{margin:auto;border-radius:22px}}

/* ---- v6: settings rows, board sections, rail sidebar ---- */
.cap-row label,.cap-row > span{min-width:0}
.cap-row input[type=number]{width:88px!important;flex:none;text-align:right}
.cap-row .sub{display:block;margin-top:2px;font-weight:400}
.plan{margin-bottom:0}
.board-sec{margin-top:34px;padding-top:22px;border-top:2px solid var(--line);position:relative}
.board-sec::before{content:"";position:absolute;left:0;top:-2px;width:72px;height:2px;background:var(--accent)}
.board-sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.board-sec-head h2{margin:0;font:700 1.35rem/1.2 var(--display);letter-spacing:-.01em}
.board-sec-head .n{font:600 .85rem var(--body);color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 10px}
.board-sec-head .spacer{flex:1}
.board-sec-head .board-ctl{margin:0}
.board-sec .chips{margin-bottom:4px}
.tl-bg .today-line.flash{animation:tlflash 1.6s ease-out 1}
.tl-d.is-today.flash{animation:tlday 1.6s ease-out 1;border-radius:6px}
@keyframes tlflash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--late) 60%,transparent)}30%{box-shadow:0 0 0 7px color-mix(in srgb,var(--late) 30%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes tlday{0%,40%{background:var(--late);color:#fff}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.tl-bg .today-line.flash,.tl-d.is-today.flash{animation:none}}
.nav-date,.nav-focus,.nav-foot,nav.tabs .in .nav-focus{display:none}
@media (min-width:980px){
  body{padding-left:112px}
  header.top{display:none}
  #toolbar{padding-top:18px}
  #toolbar:has(#searchRow[hidden]){padding-top:8px}
  nav.tabs{width:112px;padding:18px 10px calc(14px + env(safe-area-inset-bottom,0px));gap:14px;align-items:stretch}
  nav.tabs::after{right:4px}
  .nav-brand{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0}
  .nav-brand img{width:88px;height:auto}
  .nav-date{display:flex;flex-direction:column;align-items:center;width:58px;border-radius:10px;overflow:hidden;background:#fff;color:var(--navy);box-shadow:0 3px 0 rgba(0,0,0,.18);line-height:1}
  .nd-w{display:block;width:100%;text-align:center;background:var(--tomato);color:#fff;font:700 .62rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:4px 0 3px}
  .nd-d{font:800 1.45rem/1 var(--display);padding:4px 0 0;font-variant-numeric:tabular-nums}
  .nd-m{font:600 .66rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:#51607A;padding:2px 0 5px}
  nav.tabs .in{align-items:stretch;gap:4px}
  nav.tabs .in button{flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:10px 4px 9px;font:500 .74rem/1.1 var(--display)!important;text-align:center;border-radius:12px}
  nav.tabs .in button svg{width:23px;height:23px}
  nav.tabs .in button[aria-current="page"]{box-shadow:none}
  nav.tabs .in button[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-2)}
  nav.tabs .in button{position:relative}
  nav.tabs .in .nav-focus{display:flex;margin-top:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff}
  nav.tabs .in .nav-focus svg{color:var(--tomato)}
  nav.tabs .in .nav-focus:hover{background:rgba(255,255,255,.13)}
  nav.tabs .in .nav-focus.m-short svg,nav.tabs .in .nav-focus.m-long svg{color:var(--leaf)}
  nav.tabs .in .nav-focus.active .nf-l{font:700 .92rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  nav.tabs .in .nav-focus .nf-m{font:500 .62rem/1.1 var(--display);color:var(--spine-ink);margin-top:-2px}
  nav.tabs .in .nav-focus.run{background:color-mix(in srgb,var(--tomato) 26%,transparent);border-color:color-mix(in srgb,var(--tomato) 55%,transparent)}
  nav.tabs .in .nav-focus.run.m-short,nav.tabs .in .nav-focus.run.m-long{background:color-mix(in srgb,var(--leaf) 26%,transparent);border-color:color-mix(in srgb,var(--leaf) 55%,transparent)}
  .nav-foot{display:flex;flex-direction:column;align-items:stretch;gap:4px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
  .nav-tool{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;color:var(--spine-ink);font:500 .74rem/1.1 var(--display);padding:9px 4px;border-radius:12px}
  .nav-tool svg{width:22px;height:22px}
  .nav-tool:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-sync{display:block;text-align:center;font:500 .66rem/1.25 var(--display);color:var(--spine-ink);padding:2px 2px 4px;overflow-wrap:anywhere}
  .nav-sync::before{content:"";display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 4px;background:var(--leaf)}
  .nav-sync[data-state="busy"]::before{background:var(--mark)}
  .nav-sync[data-state="warn"]{color:#FFD0C9}
  .nav-sync[data-state="warn"]::before{background:var(--tomato)}
  .toast{left:calc(50% + 56px)}
}

/* ---- v7 ---- */
.focus-head h2 span,.today .wd{background:none!important;padding:0;margin:0}
.col{background:color-mix(in srgb,var(--surface) 88%,transparent)}
.bk-opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;justify-items:start}
.bk-opt ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.9rem;color:var(--ink)}
.bk-head{display:flex;align-items:center;gap:10px}
.bk-head strong{font:700 1rem var(--display)}
.bk-ico{width:22px;height:22px;border-radius:6px;flex:none;background:var(--muted)}
.bk-gdrive{background:conic-gradient(from 30deg,#1FA463 0 120deg,#FFD04B 0 240deg,#4688F4 0)}
.bk-onedrive{background:linear-gradient(135deg,#28A8EA,#0364B8)}
@media (min-width:980px){
  body{padding-left:136px}
  nav.tabs{width:136px;padding-inline:12px}
  .nav-brand{gap:6px}
  .nav-brand img{width:112px}
  .nav-date{display:block;width:auto;background:none;box-shadow:none;border-radius:0;color:var(--spine-ink);font:500 .78rem/1.2 var(--display);text-align:center;letter-spacing:.01em}
  nav.tabs .in button[aria-current="page"]::before{left:-12px}
  .toast{left:calc(50% + 68px)}
}

/* ---- v8 ---- */
.col-more{margin-top:12px}
.col-more > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font:600 .86rem var(--display);color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.col-more > summary::-webkit-details-marker{display:none}
.col-more > summary::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.col-more[open] > summary::after{transform:rotate(-135deg) translate(-2px,0)}
.col-more > summary:hover{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.col-more .cm-close,.col-more[open] .cm-open{display:none}
.col-more[open] .cm-close{display:inline}
.col-more[open] > .col-list{margin-top:12px}
.board.dragging .col-more:not([open]) > summary{border-style:solid}
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}

/* ---- v9: notes ---- */
.note-rot{position:absolute;right:-11px;top:-11px;width:26px;height:26px;border-radius:50%;background:#fff;color:#2A2418;box-shadow:0 2px 6px rgba(0,0,0,.3);display:grid;place-items:center;opacity:0;transition:opacity .15s;cursor:grab;touch-action:none;z-index:2}
.note:hover .note-rot,.note:focus-visible .note-rot,.note.rotating .note-rot{opacity:1}
@media (hover:none){.note-rot{opacity:.9}}
.note.rotating{transition:none;box-shadow:0 14px 28px rgba(40,25,5,.35)}
.note.rotating::after{content:attr(data-deg);position:absolute;left:50%;bottom:-30px;transform:translateX(-50%) rotate(calc(-1 * var(--rot)));background:#10254A;color:#fff;font:700 .75rem var(--display);padding:3px 8px;border-radius:6px;white-space:nowrap}
.note-task-tag{display:inline-flex;align-items:center;gap:2px;max-width:100%;border:0;border-radius:5px;background:rgba(255,255,255,.6);color:#1F3F9A;font:700 .72rem/1.3 var(--display);padding:2px 7px;margin:0 0 6px 4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-task-tag:hover{background:#fff}
.note-task{padding:6px 8px;font-size:14px;background:rgba(255,255,255,.55)!important;border:1px solid rgba(42,36,24,.2)!important;border-radius:8px;color:#2A2418!important}
.tf-notes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tf-note{position:relative;width:150px;min-height:70px;background:var(--nc);color:#2A2418;border-radius:3px 3px 8px 3px;padding:8px 26px 8px 9px;font-size:.84rem;line-height:1.35;box-shadow:0 3px 8px rgba(0,0,0,.15);white-space:pre-wrap;overflow-wrap:anywhere}
.tf-note .x-btn{position:absolute;right:0;top:0;width:26px;height:26px;color:#2A2418}
.note-count{display:inline-flex;align-items:center}

/* ---- v9: archive ---- */
.arch-link{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;border:1px dashed var(--line);background:none;border-radius:10px;padding:7px 8px;color:var(--muted);font:600 .8rem var(--display)}
.arch-link:hover{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.arch-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.arch-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);border-left:4px solid var(--c);flex-wrap:wrap}
.arch-row:first-child{border-top:0}
.arch-st{flex:none;font:700 .7rem var(--display);letter-spacing:.02em;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--muted);min-width:64px;text-align:center}
.arch-st.st-done{background:color-mix(in srgb,var(--leaf) 16%,transparent);color:color-mix(in srgb,var(--leaf) 80%,var(--ink))}
.arch-main{flex:1;min-width:180px;border:0;background:none;text-align:left;padding:0;display:grid;gap:1px}
.arch-t{font-weight:600}
.arch-acts{display:flex;align-items:center;gap:6px;flex:none}
.arch-term{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface) 90%,transparent);padding:4px 14px 14px;box-shadow:var(--shadow)}
.arch-term > summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 0;cursor:pointer}
.arch-term-name{font:700 1.15rem var(--display)}
.arch-course{margin-top:12px}
.arch-course-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.arch-course-head .sd{width:10px;height:10px;border-radius:3px;background:var(--c)}
.arch-course-head .spacer{flex:1}
.term-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.9rem}
.term-bar > span{flex:1;min-width:220px;display:flex;align-items:center;gap:8px}
.nt-list{display:grid;gap:6px}
.nt-row{padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.nt-row .sd{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
/* ---- v9: schedule ---- */
.sch-nav{display:flex;align-items:center;gap:8px}
.sch-range{font:600 .95rem var(--display);min-width:118px;text-align:center}
.sch-sum{margin:6px 0 10px}
.sch-missing{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sch-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sch-grid{display:grid;grid-template-columns:54px repeat(var(--n),minmax(0,1fr))}
.sch-corner,.sch-head{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--soft) 55%,var(--surface))}
.sch-head{border-left:1px solid var(--line);padding:8px 6px;min-height:64px;display:grid;align-content:start;gap:5px}
.sch-dn{display:flex;align-items:baseline;gap:6px;font-family:var(--display)}
.sch-dn span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sch-dn b{font-size:1.15rem}
.sch-head.is-today .sch-dn b{background:var(--late);color:#fff;border-radius:7px;padding:0 6px}
.sch-due{display:grid;gap:3px}
.sch-chip{border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);font:600 .72rem/1.25 var(--body);text-align:left;padding:3px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch-chip span{color:var(--muted);font-weight:500}
.sch-gutter{position:relative}
.sch-gutter span{position:absolute;right:8px;transform:translateY(-50%);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sch-gutter span:first-child{transform:none}
.sch-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0 55px,var(--line) 55px 56px)}
.sch-col.is-today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.sch-b{position:absolute;overflow:hidden;text-align:left;border:0;border-radius:8px;padding:5px 7px;display:grid;align-content:start;gap:1px;font-size:.72rem;line-height:1.25;background:var(--c);color:#fff;box-shadow:0 2px 6px rgba(8,20,50,.18);cursor:pointer}
.sch-b b{font:700 .8rem/1.2 var(--display)}
.sch-b span{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-b:hover{filter:brightness(1.06);z-index:2}
.sch-b.k-lab{background:repeating-linear-gradient(135deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 82%,#000) 8px 16px)}
.sch-b.k-discussion{background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);border:2px solid var(--c)}
.sch-b.k-officehours{background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--ink);border:2px dashed color-mix(in srgb,var(--c) 70%,transparent);box-shadow:none}
.sch-b.k-other{background:color-mix(in srgb,var(--c) 70%,var(--surface))}
.sch-b.sch-exam{background:var(--surface);color:var(--ink);border:2px solid var(--late);box-shadow:inset 4px 0 0 var(--late),0 2px 6px rgba(8,20,50,.18)}
.sch-now{position:absolute;left:0;right:0;height:2px;background:var(--late);z-index:3}
.sch-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--late)}
.sch-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
.sch-legend .lg{display:inline-flex;align-items:center;gap:6px}
.sch-legend .lg::before{content:"";width:22px;height:12px;border-radius:3px;background:var(--accent)}
.sch-legend .k-lab::before{background:repeating-linear-gradient(135deg,var(--accent) 0 4px,color-mix(in srgb,var(--accent) 75%,#000) 4px 8px)}
.sch-legend .k-discussion::before{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:2px solid var(--accent)}
.sch-legend .k-officehours::before{background:none;border:2px dashed var(--accent)}
.sch-legend .sch-exam::before{background:var(--surface);border:2px solid var(--late)}
.sch-pills{display:none}
@media (max-width:700px){
  .sch-pills{display:flex;gap:6px;margin-bottom:10px}
  .sch-pills button{flex:1;display:grid;justify-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;font:600 .72rem var(--display);color:var(--muted)}
  .sch-pills button b{font-size:1rem;color:var(--ink)}
  .sch-pills button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
  .sch-pills button[aria-pressed="true"] b{color:var(--sel-ink)}
  .sch-grid{grid-template-columns:48px minmax(0,1fr)}
  .sch-head:not(.sel),.sch-col:not(.sel){display:none}
  .sch-b{font-size:.8rem}
}
/* class time editor */
.meet-list{display:grid;gap:8px;margin-bottom:8px}
.meet-row{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--soft) 40%,transparent)}
.meet-row .meet-days{grid-column:2/4}.meet-row .x-btn{grid-column:4;grid-row:1}.meet-row .meet-times{grid-column:1/3}.meet-row input[data-k=where]{grid-column:3/5}
.meet-row select,.meet-row input{padding:7px 8px;font-size:14px}
.meet-days{display:flex;gap:2px}
.meet-days button{width:30px;height:32px;border:1px solid var(--line);background:var(--field);border-radius:7px;font:700 .72rem var(--display);color:var(--muted);padding:0}
.meet-days button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.meet-times{display:flex;align-items:center;gap:4px;min-width:0}
.meet-times span{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){.meet-row{grid-template-columns:minmax(0,1fr) auto}.meet-row select{grid-column:1}.meet-row .x-btn{grid-column:2;grid-row:1}.meet-row .meet-days{grid-column:1/-1;flex-wrap:wrap}.meet-row .meet-times{grid-column:1/-1}.meet-row input[data-k=where]{grid-column:1/-1}}
@media (min-width:980px){nav.tabs .in button{padding:8px 4px 7px}}

@media (min-width:980px){
  nav.tabs{padding-top:14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
  nav.tabs .in{gap:2px}
  nav.tabs .in button{padding:7px 4px 6px;gap:4px}
  nav.tabs .in button svg{width:21px;height:21px}
  nav.tabs .in .nav-focus{margin-top:4px}
  .nav-foot{padding-top:8px;gap:2px}
  .nav-tool{padding:6px 4px;gap:4px}

}
@media (min-width:980px) and (max-height:760px){
  .nav-brand img{width:96px}
  nav.tabs .in button span,nav.tabs .in button{font-size:.7rem!important}

}
@media (max-width:420px){nav.tabs .in button{font-size:.6rem!important}nav.tabs .in button svg{width:20px;height:20px}}

/* ---- desktop app window ---- */
body.desk{--tb:34px;padding-top:var(--tb)}
body.desk::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--tb);background:var(--spine);-webkit-app-region:drag;z-index:400}
body.desk header.top{top:var(--tb)}
@media (min-width:980px){body.desk nav.tabs{top:var(--tb)}}
body.desk dialog{max-height:calc(100vh - var(--tb) - 24px)}

@media (min-width:980px){.nav-tool{color:rgba(255,255,255,.78)}.nav-tool:hover{color:#fff}}

/* ---- theme toggle ---- */
.theme-btn .ti-sun{display:none}
.theme-btn.is-dark .ti-sun{display:block}
.theme-btn.is-dark .ti-moon{display:none}
.icon-btn.theme-btn svg{width:19px;height:19px}

html{transition:none}

<body>
<div class="wrap">
  <header class="top">

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const dayDiff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const fmtShort = s => parse(s).toLocaleDateString(undefined, {month:"short", day:"numeric"});
const fmtDate = s => parse(s).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const mondayOf = s => { const d = parse(s); const wd = (d.getDay() + 6) % 7; return addDays(s, -wd); };
function fmtTime(t){ const [h,m] = t.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0); return d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}); }

function normTask(t){
  t = Object.assign({title:"Untitled", courseId:"", type:"Assignment", start:"", due:"", time:"", priority:"med", status:"todo", notes:"", hours:null, checklist:[], pct:0, dependsOn:[], history:[], location:"", link:"", team:"", reading:"", weight:null, difficulty:"med", late:"unknown"}, t);
  if (!DIFF_M[t.difficulty]) t.difficulty = "med";
  if (!LATE_M[t.late]) t.late = "unknown";
  if (!Array.isArray(t.dependsOn)) t.dependsOn = [];
  if (!Array.isArray(t.history)) t.history = [];
  t.pct = Math.max(0, Math.min(100, Number(t.pct) || 0));
  if (!STATUS_LABEL[t.status]) t.status = "todo";
  if (!PRIO[t.priority]) t.priority = "med";
  if (!Array.isArray(t.checklist)) t.checklist = [];
  if (!isDate(t.due)) t.due = "";
  if (!isDate(t.start)) t.start = "";
  delete t.earned; delete t.possible;
  return t;
}
function normFile(f){
  f = Object.assign({name:"Untitled", courseId:"", folderId:"other", kind:"file", revs:[], taskIds:[], desc:"", url:""}, f);
  if (!Array.isArray(f.revs)) f.revs = [];
  if (!Array.isArray(f.taskIds)) f.taskIds = [];

function queueWrite(kind, id, data){

async function runQueue(key, e){

// Connects a storage backend (Claude's or your Supabase project) and keeps the app in sync with it.
async function connectBackend(b){
  const snap = await b.base.get();
  const md = snap.exists ? clone(snap.data()) : null;
  Object.assign(cloud, {base: b.base, tasks: b.tasks, courses: b.courses, files: b.files, notes: b.notes, decks: b.decks, backups: b.backups, refresh: b.refresh || null});
  if (md && md.schema === 2) {
    if (md.settings) state.settings = Object.assign({capacity:15}, md.settings);
  } else {
    // First connection: move what's on this device (or older single-document data) into the backend, one record per item.
    const v1 = md && (Array.isArray(md.courses) || Array.isArray(md.tasks)) ? fromArrays(md) : null;
    const localHas = Object.keys(state.tasks).length || Object.keys(state.courses).length || Object.keys(state.notes).length || Object.keys(state.decks || {}).length;
    const src = (v1 && (!localHas || (v1.updated || 0) >= (state.updated || 0))) ? v1 : state;
    const items = [...Object.values(src.courses).map(c => ["course", c]), ...Object.values(src.tasks).map(t => ["task", t]),
      ...Object.values(src.files || {}).map(f => ["file", f]), ...Object.values(src.notes || {}).map(n => ["note", n]), ...Object.values(src.decks || {}).map(d => ["deck", d])];
    for (let i = 0; i < items.length; i += 5) {
      await Promise.all(items.slice(i, i + 5).map(([k, o]) => refFor(k, o.id).set(clone(o))));
    }
    await b.base.set({schema:2, settings: src.settings || state.settings, migratedAt: Date.now()});
    state = src; saveLocal();
    if (items.length && !inClaude()) toast(`Moved ${items.length} item${items.length === 1 ? "" : "s"} from this device into your account`);
  }
  cloud.on = true; syncLabel();
  await flushOutbox();
  const got = {task:false, course:false, file:false, note:false};
  const sub = (kind, col) => {
    let retried = false;
    const start = () => col.onSnapshot(s => {
      applySnap(kind, s); got[kind] = true;
      if (got.task && got.course && got.file) maybeAutoBackup();
    }, err => {
      if (err && err.code === "unavailable" && !retried) { retried = true; setTimeout(start, 3000); return; }
      if (err && err.code === "revoked") { cloud.on = false; syncLabel(); }
    });
    start();
  };
  sub("task", cloud.tasks); sub("course", cloud.courses); sub("file", cloud.files); sub("note", cloud.notes); if (cloud.decks) sub("deck", cloud.decks);

/* ---------- Offline outbox: changes made while disconnected are kept and sent later ---------- */
const OUTBOX = "studioso:outbox";
const outboxGet = () => { try { return JSON.parse(localStorage.getItem(OUTBOX) || "{}") || {}; } catch(e) { return {}; } };
function outboxAdd(kind, id, data){

function outboxDone(key, data){

let flushing = false;
async function flushOutbox(){

    const i = k.indexOf(":"), kind = k.slice(0, i), id = k.slice(i + 1);

    catch(e) { break; }

async function sbBackend(client, userId){
  const T = "items";
  const cache = {task: new Map(), course: new Map(), file: new Map(), note: new Map(), deck: new Map(), meta: new Map()};
  const listeners = {task: [], course: [], file: [], note: [], deck: []};
  const snapOf = kind => ({docs: [...cache[kind].entries()].map(([id, d]) => ({id, data: () => d}))});
  const emit = kind => (listeners[kind] || []).forEach(f => { try { f(snapOf(kind)); } catch(e) { console.warn(e); } });
  const loadAll = async () => {
    const fresh = {task: new Map(), course: new Map(), file: new Map(), note: new Map(), deck: new Map(), meta: new Map()};
    for (let from = 0; ; from += 1000) {
      const {data, error} = await client.from(T).select("kind,id,data").neq("kind", "backup").order("kind").order("id").range(from, from + 999);
      if (error) throw sbErr(error);
      (data || []).forEach(r => { if (fresh[r.kind]) fresh[r.kind].set(r.id, r.data); });
      if (!data || data.length < 1000) break;
    }
    Object.keys(fresh).forEach(k => { cache[k] = fresh[k]; });
  };
  await loadAll();
  const upsert = async (kind, id, d) => {
    const {error} = await client.from(T).upsert({user_id: userId, kind, id, data: d, updated_at: new Date().toISOString()}, {onConflict: "user_id,kind,id"});
    if (error) throw sbErr(error);
    if (cache[kind]) cache[kind].set(id, d);
  };
  const remove = async (kind, id) => {
    const {error} = await client.from(T).delete().eq("user_id", userId).eq("kind", kind).eq("id", id);
    if (error) throw sbErr(error);
    if (cache[kind]) cache[kind].delete(id);
  };
  // Live updates from your other devices
  client.channel("studioso-" + userId).on("postgres_changes", {event: "*", schema: "public", table: T}, p => {
    const row = p.eventType === "DELETE" ? p.old : p.new;
    if (!row || row.user_id !== userId || !listeners[row.kind]) return;
    if (p.eventType === "DELETE") cache[row.kind].delete(row.id); else cache[row.kind].set(row.id, row.data);
    emit(row.kind);
  }).subscribe();
  const doc = (kind, id) => ({id,
    get: async () => {
      const {data, error} = await client.from(T).select("data").eq("user_id", userId).eq("kind", kind).eq("id", id).maybeSingle();
      if (error) throw sbErr(error);
      return {exists: !!data, data: () => data ? data.data : undefined};
    },
    set: d => upsert(kind, id, d),
    delete: () => remove(kind, id)});
  const col = kind => ({doc: id => doc(kind, id), onSnapshot: cb => { listeners[kind].push(cb); setTimeout(() => cb(snapOf(kind)), 0); return () => {}; }});
  const backups = {doc: id => doc("backup", id),
    orderBy: () => ({limit: n => ({get: async () => {
      const {data, error} = await client.from(T).select("id,data").eq("user_id", userId).eq("kind", "backup").order("updated_at", {ascending: false}).limit(n);
      if (error) throw sbErr(error);
      return {docs: (data || []).map(r => ({id: r.id, data: () => r.data}))};
    }})})};
  // Catch up with changes from other devices when you come back to this tab
  const refresh = async () => { try { await loadAll(); ["task", "course", "file", "note", "deck"].forEach(emit); } catch(e) {} };
  return {base: doc("meta", "planner"), tasks: col("task"), courses: col("course"), files: col("file"), notes: col("note"), decks: col("deck"), backups, refresh};
}

    const path = `${sbUser.id}/${uid()}-${safe}`;
    const {error} = await sb.storage.from(SB_BUCKET).upload(path, file, {contentType: type, upsert: false});

  const f = (k, label, fmt) => { const x = a[k] || "", y = b[k] || ""; if (String(x) !== String(y)) out.push(`${label}: ${fmt ? fmt(x) : (x || "none")} → ${fmt ? fmt(y) : (y || "none")}`); };

const DIFF_M = {easy:0.7, med:1, hard:1.5};
const DIFF_LABEL = {easy:"Easy", med:"Medium", hard:"Hard"};
const PRIO_M = {low:0.8, med:1, high:1.25, urgent:1.6};
const LATE_M = {none:1.2, penalty:1, free:0.85, unknown:1};

const dailyHours = () => Math.max(0, Number(state.settings.dailyHours ?? 3));
function todayHours(){

function setTodayHours(h){ try { localStorage.setItem("coursework:today", JSON.stringify({d: todayISO(), h})); } catch(e) {} }
const typeDef = t => TYPE_DEFAULTS[t.type] || TYPE_DEFAULTS.Other;
const hasWeight = t => isNum(t.weight) && Number(t.weight) > 0;

// Total hours the task takes. Exams and Quizzes: study time grows with difficulty and with how much of the grade they're worth.
function effortOf(t){

  return head + chipsHtml() + searchNote() + `<div class="tl-scroll" data-today="${x(today)}" data-dw="${dw}">
      <div class="tl" style="width:${LW + W}px" data-lw="${LW}">
        <div class="tl-bg" style="left:${LW}px;width:${W}px">${bg}</div>

        ${rows}

    <div class="tl-legend"><span><i class="ms-key"></i>Exam or Quiz</span><span><i class="dep-key"></i>Depends On</span><span><i class="tlbar st-todo"></i>To Do</span><span><i class="tlbar st-doing"></i>In Work</span><span><i class="tlbar st-done"></i>Complete</span><span><i class="tlbar late"></i>Past Due</span></div>
    <p class="hint-line">Drag a bar to move it, or drag either end to change the start or due date. On a phone, press and hold a bar first. Diamonds mark exam and quiz dates, and you can drag them to a new day too. Arrows show dependencies and turn red when a task starts before the one it depends on is due. Weeks over your hours limit turn red.${noDue ? ` ${noDue} task${noDue === 1 ? " has" : "s have"} no due date and ${noDue === 1 ? "isn't" : "aren't"} shown.` : ""}</p>`;
}
function viewCalendar(mode){
  const today = todayISO();
  if (!ui.calMonth) ui.calMonth = today.slice(0, 7) + "-01";
  if (!ui.calDay) ui.calDay = today;
  const m = parse(ui.calMonth);
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const byDay = {};
  visibleTasks().forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });
  const dows = [];
  for (let i = 0; i < 7; i++) { const d = new Date(2023, 0, 1 + i); dows.push(`<div class="dow" aria-hidden="true">${d.toLocaleDateString(undefined, {weekday:"narrow"})}</div>`); }
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d);
    const ts = (byDay[k] || []).slice().sort(sortTasks);
    const out = d.getMonth() !== m.getMonth();
    const dots = ts.slice(0, 6).map(t => `<i class="${MILESTONE(t.type) ? "dd" : ""}" title="${esc(t.title)}" style="--c:${esc(colorOf(t.courseId))};${t.status === "done" ? "opacity:.35" : ""}"></i>`).join("");
    cells += `<button class="day ${out ? "out" : ""} ${k === today ? "is-today" : ""}" data-act="pick-day" data-id="${k}" aria-pressed="${k === ui.calDay}" aria-label="${esc(d.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"}))}, ${ts.length} task${ts.length === 1 ? "" : "s"} due"><span class="num">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  const dayTasks = (byDay[ui.calDay] || []).slice().sort(sortTasks);
  const dayLabel = parse(ui.calDay).toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
  return `<div class="tl-controls"><h2>Timeline</h2>${mode}</div>${chipsHtml()}${searchNote()}
    <div class="cal-head">
      <button class="icon-btn" data-act="cal-prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2>${esc(m.toLocaleDateString(undefined, {month:"long", year:"numeric"}))}</h2>
      <button class="btn small" data-act="cal-today">Today</button>
      <button class="icon-btn" data-act="cal-next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="cal">${dows.join("")}${cells}</div>
    <h2 class="sec ${ui.calDay === today ? "hl" : ""}"><span class="t">Due ${esc(dayLabel)}</span><span class="n">${dayTasks.length || ""}</span></h2>
    ${dayTasks.length ? taskList(dayTasks) : `<div class="empty">Nothing due. <button class="link-btn" data-act="new-task" data-due="${ui.calDay}">Add a task due this day</button></div>`}`;
}

/* ---------- Archive ---------- */
const ARCHIVE_SM = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg>';
function archRow(t){

}
function viewArchive(){
  const q = t => matchesQ(t) && inFilter(t);
  const done = allTasks().filter(t => autoArchived(t) && !t.archivedTerm && q(t)).sort((a, b) => doneTime(b) - doneTime(a));
  const terms = {};
  const termOf = name => terms[name] = terms[name] || {name, at: 0, courses: {}, loose: []};
  allCourses().filter(c => c.archived).forEach(c => { const g = termOf(c.archived); g.at = Math.max(g.at, c.archivedAt || 0); g.courses[c.id] = {c, tasks: []}; });
  allTasks().filter(t => t.archivedTerm && q(t)).forEach(t => {
    const g = termOf(t.archivedTerm); g.at = Math.max(g.at, t.archivedAt || 0);
    const c = state.courses[t.courseId];
    if (c && c.archived === t.archivedTerm) g.courses[c.id].tasks.push(t);
    else if (c) (g.courses[c.id] = g.courses[c.id] || {c, tasks: [], active: !c.archived}).tasks.push(t);
    else g.loose.push(t);
  });
  const decksByTerm = {}; Object.values(state.decks || {}).filter(d => d.archived).forEach(d => { decksByTerm[d.archived] = (decksByTerm[d.archived] || 0) + 1; });
  const termList = Object.values(terms).sort((a, b) => b.at - a.at);
  const shown = ui.archAll ? done : done.slice(0, 25);
  const termHtml = termList.map((g, i) => {
    const cs = Object.values(g.courses), nT = cs.reduce((n, x) => n + x.tasks.length, 0) + g.loose.length;
    return `<details class="arch-term" ${i === 0 || ui.q ? "open" : ""}><summary><span class="arch-term-name">${esc(g.name)}</span><span class="mini">${cs.length} course${cs.length === 1 ? "" : "s"}, ${nT} task${nT === 1 ? "" : "s"}${decksByTerm[g.name] ? `, ${decksByTerm[g.name]} flashcard deck${decksByTerm[g.name] === 1 ? "" : "s"}` : ""}${g.at ? ` · archived ${esc(new Date(g.at).toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"}))}` : ""}</span></summary>
      ${cs.map(x => `<div class="arch-course" style="--c:${esc(x.c.color)}"><div class="arch-course-head"><span class="sd"></span><strong>${esc(x.c.name)}</strong>${x.c.code ? `<span class="mini">${esc(x.c.code)}</span>` : ""}<span class="spacer"></span>${x.c.archived ? `<button class="btn small" data-act="arch-course-restore" data-id="${esc(x.c.id)}">Restore Course</button>` : `<span class="mini">Course is active again</span>`}</div>
        ${x.tasks.length ? `<ul class="arch-list">${x.tasks.sort(sortTasks).map(archRow).join("")}</ul>` : `<p class="mini" style="margin:6px 0 0">No tasks.</p>`}</div>`).join("")}
      ${g.loose.length ? `<div class="arch-course" style="--c:#8A94A6"><div class="arch-course-head"><span class="sd"></span><strong>No Course</strong></div><ul class="arch-list">${g.loose.sort(sortTasks).map(archRow).join("")}</ul></div>` : ""}
    </details>`;
  }).join("");
  return `<div class="view-head"><h2>Archive</h2><button class="btn small" data-act="new-term">Start a New Term</button><button class="btn small" data-act="archive-back">Back to Board</button></div>
    <p class="mini" style="margin:6px 0 0;max-width:70ch">Completed tasks move here ${ARCHIVE_DAYS} days after you finish them, and past terms move here when you start a new term. Move anything back to To Do or In Work whenever you need it.</p>
    ${chipsHtml()}${searchNote()}
    <h3 class="fsec">${ARCHIVE_SM}Completed Tasks<span class="n">${done.length}</span></h3>
    ${done.length ? `<ul class="arch-list">${shown.map(archRow).join("")}</ul>${done.length > shown.length ? `<button class="show-old" data-act="arch-all" style="width:100%;margin-top:8px">Show all ${done.length}</button>` : ""}` : `<div class="empty">Nothing here yet. Tasks you finish show up here two weeks later.</div>`}

}
function seasonGuess(){
  // Name the term after when most of the current tasks are due.
  const ds = tasksArr().filter(t => t.due && courseOf(t.courseId)).map(t => t.due).sort();
  const d = ds.length ? parse(ds[Math.floor(ds.length / 2)]) : new Date();
  const m = d.getMonth();
  return `${m <= 4 ? "Spring" : m <= 7 ? "Summer" : "Fall"} ${d.getFullYear()}`;
}
function newTermSheet(){
  const cs = coursesArr();

    <div class="sheet-body">${REQ_NOTE}
      <p style="margin:0">This puts the finished term's courses, tasks, flashcards and sticky notes in the Archive, so your board, timeline and plan start clean. Nothing is deleted, and you can bring anything back later.</p>
