        ${cs.map(c => `<label class="mi-check nt-row" style="--c:${esc(c.color)}"><input type="checkbox" name="c" value="${esc(c.id)}" checked><span class="sd"></span><span><b>${esc(c.name)}</b> <span class="mini">${esc(c.code || "")} · ${cnt(c)} task${cnt(c) === 1 ? "" : "s"}</span></span></label>`).join("")}
        ${loose ? `<label class="mi-check nt-row"><input type="checkbox" name="loose" checked><span class="sd" style="--c:#8A94A6"></span><span><b>Tasks with no course</b> <span class="mini">${loose} task${loose === 1 ? "" : "s"}</span></span></label>` : ""}
      </div></fieldset>
      <fieldset><legend>Also Archive</legend>
        <label class="mi-check"><input type="checkbox" name="decks" checked> Flashcard decks for these courses</label>
        <label class="mi-check"><input type="checkbox" name="notes" checked> Sticky notes for these courses</label>
      </fieldset>
      <p class="mini" style="margin:0">Open tasks are archived too. Move any you're carrying over back to To Do from the Archive.</p>
    </div>
    <div class="sheet-foot"><span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-submit>Archive Term</button></div>
  </form>`, fd => {
    const label = String(fd.get("term") || "").trim(); if (!label) return false;
    const ids = new Set(fd.getAll("c")), now = Date.now(), ch = [];

    if (fd.get("decks")) decksArr().filter(d => ids.has(d.courseId)).forEach(d => ch.push({kind: "deck", id: d.id, after: Object.assign(clone(d), {archived: label})}));
    if (fd.get("notes")) notesArr().filter(n => !n.archived && ids.has(n.courseId)).forEach(n => ch.push({kind: "note", id: n.id, after: Object.assign(clone(n), {archived: true, archivedAt: now})}));

    applyChanges(ch, `Archived ${label}: ${ids.size} course${ids.size === 1 ? "" : "s"}, ${nT} task${nT === 1 ? "" : "s"}`, {label: "Add New Courses", fn: () => { ui.tab = "courses"; render(); courseForm(null); }});

}
function restoreTask(id, st){
  const t = state.tasks[id]; if (!t) return;
  const n = clone(t);
  n.status = st; n.doneAt = null; n.archivedTerm = null; n.archivedAt = null;

            <select id="tfNoteAttach" aria-label="Attach an existing sticky note"></select></fieldset>
          ${isNew ? `<div class="two" id="repeatRow">
            <label class="f">Repeat<select name="repeat"><option value="">Doesn't repeat</option><option value="7">Every week</option><option value="14">Every 2 weeks</option></select></label>
            <label class="f">Until<input type="date" name="until"></label>
          </div>` : ""}
          ${!isNew && t.pomos ? `<p class="mini" style="margin:0">${TOMATO} ${t.pomos} focus session${t.pomos === 1 ? "" : "s"}, ${fmtHM((t.focusMin || 0) / 60)} focused on this task.</p>` : ""}
        </div>
      </details>
      ${!isNew && t.due ? `<div class="link-row"><a href="${esc(gcalLink(t))}" target="_blank" rel="noopener noreferrer">Add to Google Calendar</a></div>` : ""}
      ${!isNew && t.seriesId ? `<p class="mini" style="margin:0">${REPEAT} Part of a repeating series. Changes here apply to this task only.</p>` : ""}
      ${!isNew && t.history.length ? `<details class="hist"><summary>History (${t.history.length})</summary><ul>${t.history.slice().reverse().map(h => `<li><span>${esc(h.text)}</span><time>${esc(new Date(h.at).toLocaleString(undefined, {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}</time></li>`).join("")}</ul></details>` : ""}
    </div>
    <div class="sheet-foot">${isNew ? "" : `<button type="button" class="btn danger" data-act="delete-task" data-id="${esc(t.id)}">Delete</button><button type="button" class="btn focus-btn" data-act="pomo-task" data-id="${esc(t.id)}">${TOMATO}Focus</button>`}<span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" data-submit>${isNew ? "Add task" : "Save task"}</button></div>
  </form>`, fd => {
    const title = String(fd.get("title") || "").trim();
    if (!title) return false;
    const pending = $("#clNew").value.trim();
    if (pending) items.push({id: uid(), text: pending, done: false});
    const hours = fd.get("hours");
    const type = fd.get("type") || "Assignment", cfg = cfgOf(type);
    const txt = k => String(fd.get(k) || "").trim();
    let link = "";
    if (cfg.link && txt("link")) { link = safeUrl(txt("link")); if (!link) { toast("Enter a valid web address for the link"); return false; } }
    const due = fd.get("due") || "";
    const data = {
      title, courseId: fd.get("courseId") || "", type,
      start: cfg.single ? due : (fd.get("start") || ""), due, time: cfg.time ? (fd.get("time") || "") : "",
      status: fd.get("status") || "todo", priority: fd.get("priority") || "med",
      notes: String(fd.get("notes") || ""), hours: !cfg.hours || hours === "" || hours === null ? null : Number(hours),
      checklist: items.filter(i => i.text.trim()).map(i => ({id: i.id, text: i.text.trim(), done: !!i.done})),
      pct: Number(fd.get("pct") || 0), dependsOn: deps.slice(),
      weight: isNum(fd.get("weight")) && Number(fd.get("weight")) > 0 ? Math.min(100, Number(fd.get("weight"))) : null,
      difficulty: fd.get("difficulty") || "med", late: fd.get("late") || "unknown",
      location: cfg.location ? txt("location") : "", team: cfg.team ? txt("team") : "", reading: cfg.reading ? txt("reading") : "", link
    };
    if (cfg.single && !due) { toast(`Pick the ${type.toLowerCase()} date`); dlg.querySelector("input[name=due]").focus(); return false; }
    const pendNote = $("#tfNoteNew").value.trim(); if (pendNote) newNotes.push(pendNote);
    const noteChanges = notesArr().filter(n => noteSet.has(n.id) !== (n.taskId === t.id)).map(n => ({kind:"note", id: n.id, after: Object.assign(clone(n), {taskId: noteSet.has(n.id) ? t.id : ""})}));
    { let z = notesArr().reduce((m, n) => Math.max(m, n.z || 0), 0);
      newNotes.forEach((text, i) => { const n = normNote({id: uid(), text, color: "yellow", x: 60 + (i % 4) * 230 + Math.round(Math.random() * 30), y: 50 + Math.round(Math.random() * 60), z: ++z, rot: Math.round((Math.random() * 4 - 2) * 10) / 10, courseId: fd.get("courseId") || "", taskId: t.id, created: Date.now()}); noteChanges.push({kind:"note", id: n.id, after: n}); }); }
    const fileChanges = noteChanges.concat(Object.values(state.files).filter(f => attached.has(f.id) !== f.taskIds.includes(t.id)).map(f => {
      const n = clone(f); n.taskIds = attached.has(f.id) ? n.taskIds.concat(t.id) : n.taskIds.filter(x => x !== t.id);
      return {kind:"file", id: f.id, after: n};
    }));
    if (data.start && data.due && data.start > data.due) data.start = data.due;
    if (isNew) {
      const every = Number(fd.get("repeat") || 0), until = fd.get("until") || "";
      if (every) {
        if (!data.due) { toast("Set a due date to repeat this task"); return false; }
        if (!until || until < data.due) { toast("Pick an end date for the repeats"); return false; }
      }
      const base = newTask(Object.assign({}, data, {id: t.id, doneAt: data.status === "done" ? Date.now() : null}));
      const changes = [{kind:"task", id: base.id, after: base}];
      if (every) {
        base.seriesId = uid();
        const off = dayDiff(base.start, base.due);
        for (let d = addDays(base.due, every), n = 1; d <= until && n < 60; d = addDays(d, every), n++) {
          const copy = Object.assign(clone(base), {id: uid(), due: d, start: addDays(d, -off), status: "todo", doneAt: null, order: base.order + n,
            checklist: base.checklist.map(i => ({id: uid(), text: i.text, done: false}))});
          changes.push({kind:"task", id: copy.id, after: copy});
        }
      }
      applyChanges(changes.concat(fileChanges), changes.length > 1 ? `Added ${changes.length} tasks` : "Task added");
    } else {
      const x = state.tasks[t.id]; if (!x) return;
      const next = Object.assign(clone(x), data);
      if (data.status === "done" && x.status !== "done") next.doneAt = Date.now();
      if (data.status !== "done") next.doneAt = null;
      if (data.status !== x.status) next.order = nextOrder(data.status);
      const inv = applyChanges([{kind:"task", id: t.id, after: next}].concat(fileChanges), "");
      const moved = next.due !== x.due || startOf(next) !== startOf(x);
      toast("Task saved", () => { applyChanges(inv, null); toast("Undone"); }, moved ? shiftOffer(t.id) : null);
    }
  });
  const list = $("#clList");
  const curType = () => $("#tfType").value;
  // A short summary of what's filled in under Advanced Settings, so nothing hides there unnoticed
  const advSummary = () => {
    const f = dlg.querySelector("form"); if (!f) return;
    const v = n => (f.elements[n] && !f.elements[n].closest("[hidden]")) ? String(f.elements[n].value || "").trim() : "";
    const bits = [];
    if (v("time")) bits.push("due " + fmtTime(v("time")));
    if (v("hours")) bits.push(v("hours") + "h");
    if (v("location")) bits.push(v("location"));
    if (v("team")) bits.push("team");
    if (v("link")) bits.push("link");
    if (v("weight")) bits.push(v("weight") + "% of grade");
    const diff = (f.querySelector("input[name=difficulty]:checked") || {}).value; if (diff && diff !== "med") bits.push(DIFF_LABEL[diff].toLowerCase());
    { const nn = (typeof noteSet !== "undefined" ? noteSet.size : 0) + (typeof newNotes !== "undefined" ? newNotes.length : 0); if (nn) bits.push(nn + " sticky note" + (nn === 1 ? "" : "s")); }
    if (items.length) bits.push(`checklist ${items.filter(i => i.done).length}/${items.length}`);
    if (deps.length) bits.push(`${deps.length} dependenc${deps.length === 1 ? "y" : "ies"}`);
    if (attached.size) bits.push(`${attached.size} file${attached.size === 1 ? "" : "s"}`);
    const rp = f.elements.repeat && f.elements.repeat.value; if (rp) bits.push(rp === "7" ? "weekly" : "every 2 weeks");
    $("#advSum").textContent = bits.length ? bits.join(", ") : "Due time, hours, checklist, files and more";
  };
  const drawCl = () => {
    const pw = $("#pctWrap"); if (pw) pw.hidden = items.length > 0 && !MILESTONE(curType());
    const pc = $("#pctFromCl"); if (pc) { pc.hidden = !(items.length > 0 && !MILESTONE(curType())); pc.textContent = `Progress comes from the checklist in Advanced Settings: ${items.filter(i => i.done).length} of ${items.length} done.`; }
    if (typeof advSummary === "function" && $("#advSum")) advSummary();
    list.innerHTML = items.map((i, n) => `<li class="${i.done ? "done" : ""}"><input type="checkbox" data-i="${n}" ${i.done ? "checked" : ""} aria-label="Done"><input type="text" data-i="${n}" value="${esc(i.text)}" data-noenter aria-label="Step ${n + 1}"><button type="button" class="x-btn" data-rm="${n}" aria-label="Remove step">${CLOSE}</button></li>`).join("");
  };
  drawCl();
  list.addEventListener("change", e => { const n = e.target.dataset.i; if (e.target.type === "checkbox" && n != null) { items[n].done = e.target.checked; drawCl(); } });
  list.addEventListener("input", e => { const n = e.target.dataset.i; if (e.target.type === "text" && n != null) items[n].text = e.target.value; });
  list.addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { items.splice(Number(b.dataset.rm), 1); drawCl(); } });
  const add = () => { const inp = $("#clNew"), v = inp.value.trim(); if (!v) return; items.push({id: uid(), text: v, done: false}); inp.value = ""; drawCl(); inp.focus(); };
  const pctIn = dlg.querySelector("input[name=pct]");
  const pctHint = () => {
    const v = Number(pctIn.value);
    $("#pctHint").textContent = MILESTONE(curType()) ? (v >= 90 ? "Ready" : v >= 60 ? "Mostly ready, a few topics to review" : v >= 30 ? "Getting there" : "Just starting to study") : "";
  };
  const setStatus = v => { const r = dlg.querySelector(`input[name=status][value="${v}"]`); if (r && !r.checked) r.checked = true; };
  pctIn.addEventListener("input", () => {
    $("#pctOut").textContent = pctIn.value + "%"; pctHint();
    // Progress drives status for regular tasks: above 0% is In work, 100% is Complete.
    if (!MILESTONE(curType())) { const v = Number(pctIn.value); setStatus(v >= 100 ? "done" : v > 0 ? "doing" : "todo"); }
  });
  const tForm = dlg.querySelector("form");
  tForm.addEventListener("change", e => {
    if (e.target.name !== "status" || MILESTONE(curType())) return;
    const v = e.target.value, cur = Number(pctIn.value);
    if (v === "done" && cur < 100) pctIn.value = 100;
    else if (v === "todo" && cur > 0) pctIn.value = 0;
    else if (v === "doing" && cur >= 100) pctIn.value = 90;
    $("#pctOut").textContent = pctIn.value + "%";
  });
  const applyType = () => {
    const type = curType(), cfg = cfgOf(type);
    const show = (fld, on, label) => { const el = dlg.querySelector(`[data-fld="${fld}"]`); if (!el) return; el.hidden = !on; if (label) el.querySelector(".lbl").textContent = label; };
    show("start", !cfg.single, cfg.start);
    show("time", !!cfg.time, cfg.time);
    show("hours", !!cfg.hours, cfg.hours);
    show("location", !!cfg.location, cfg.location);
    show("team", !!cfg.team, cfg.team);
    show("link", !!cfg.link, cfg.link);
    show("reading", !!cfg.reading, cfg.reading);
    $("#dueLbl").textContent = cfg.due;
    $("#pctLbl").textContent = cfg.prog;
    $("#clLegend").textContent = cfg.checklist;
    $("#clNew").placeholder = cfg.step;
    $("#notesLbl").textContent = cfg.notes;
    dlg.querySelector("textarea[name=notes]").placeholder = cfg.notesPh;
    dlg.querySelector("input[name=title]").placeholder = cfg.title;
    $("#prioLbl").textContent = MILESTONE(type) ? "Importance" : "Priority";
    const cur = (dlg.querySelector("input[name=status]:checked") || {}).value || t.status;
    $("#statusSeg").innerHTML = seg("status", STATUSES.map(x => [x[0], statusLabels(type)[x[0]]]), cur);
    $$(".two", dlg).forEach(row => { row.hidden = [...row.children].every(c => c.hidden); });
    const rr = $("#repeatRow"); if (rr) rr.hidden = type === "Exam";
    const dueIn = dlg.querySelector("input[name=due]"); dueIn.required = !!cfg.single; $("#dueReq").hidden = !cfg.single;
    pctHint(); drawCl(); if (typeof planHint === "function") planHint(); advSummary();
  };
  $("#tfType").addEventListener("change", applyType);
  const planHint = () => {
    const f = new FormData(dlg.querySelector("form"));
    const probe = normTask(Object.assign(clone(t), {type: f.get("type"), hours: f.get("hours") === "" ? null : Number(f.get("hours")), pct: Number(f.get("pct") || 0),
      status: f.get("status") || "todo", weight: f.get("weight") === "" ? null : Number(f.get("weight")), difficulty: f.get("difficulty") || "med", checklist: items}));
    const w = dlg.querySelector("input[name=weight]"); w.placeholder = `typical ${typeDef(probe).w}`;
    const R = remainingOf(probe);
    const ms = MILESTONE(probe.type);
    const x = FOCUS && FOCUS.info[t.id];
    const rankTxt = x ? (() => { const i = FOCUS.ranked.indexOf(x); return i >= 0 ? ` Currently #${i + 1} in Today's Plan${x.alloc > 0 ? `, with ${fmtHM(x.alloc)} suggested today` : ""}.` : ""; })() : "";
    $("#planHint").innerHTML = (ms ? `Estimated <b>${fmtHM(R)}</b> of studying left, based on difficulty, grade weight and preparedness.`
      : `Estimated <b>${fmtHM(R)}</b> of work left${isNum(probe.hours) && probe.hours > 0 ? "" : " (a typical amount for this type, add Hours needed for a better plan)"}.`) + rankTxt;
  };
  tForm.addEventListener("input", planHint); tForm.addEventListener("change", planHint);
  tForm.addEventListener("input", advSummary); tForm.addEventListener("change", advSummary);
  $("#tfAdv").addEventListener("toggle", e => { ui.advOpen = e.target.open; });
  // Dependencies
  const depList = $("#depList"), depAdd = $("#depAdd");
  const drawDeps = () => {
    depList.innerHTML = deps.map(id => { const x = state.tasks[id]; return x ? `<span class="dep-chip" style="--c:${esc(colorOf(x.courseId))}">${x.status === "done" ? CHECK.replace('<svg', '<svg width="12" height="12"') : ""}${esc(x.title)}${x.due ? ` <span class="mini">${esc(fmtShort(x.due))}</span>` : ""}<button type="button" class="x-btn" data-dep-rm="${esc(id)}" aria-label="Remove dependency on ${esc(x.title)}">${CLOSE}</button></span>` : ""; }).join("") || `<span class="mini">None. Add tasks that must be finished before this one can start.</span>`;
    const cid = dlg.querySelector("select[name=courseId]").value;
    const cands = tasksArr().filter(x => x.id !== t.id && !deps.includes(x.id) && !dependsOnSelf(x.id)).sort(sortTasks);
    const grp = (label, arr) => arr.length ? `<optgroup label="${esc(label)}">${arr.map(x => `<option value="${esc(x.id)}">${esc(x.title)}${x.due ? " (" + esc(fmtShort(x.due)) + ")" : ""}</option>`).join("")}</optgroup>` : "";
    depAdd.innerHTML = `<option value="">Add a task this depends on…</option>` + grp("This course", cands.filter(x => (x.courseId || "") === cid)) + grp("Other courses", cands.filter(x => (x.courseId || "") !== cid));
  };
  depAdd.addEventListener("change", () => { if (depAdd.value) { deps.push(depAdd.value); drawDeps(); } });
  depList.addEventListener("click", e => { const b = e.target.closest("[data-dep-rm]"); if (b) { deps = deps.filter(x => x !== b.dataset.depRm); drawDeps(); } });
  dlg.querySelector("select[name=courseId]").addEventListener("change", () => { drawDeps(); drawFiles(); });
  drawDeps();
  // Files
  const tfFiles = $("#tfFiles"), tfAttach = $("#tfAttach");
  const drawFiles = () => {
    const fs = [...attached].map(id => state.files[id]).filter(Boolean);
    tfFiles.innerHTML = fs.map(f => `<li>${fileIcon(f)}<a href="${esc(fileHref(f))}" ${fileAttr(f)} target="_blank" rel="noopener noreferrer">${esc(f.name)}</a>${f.kind === "file" && f.revs.length > 1 ? `<span class="mini">Rev ${revLetter(f.revs.length - 1)}</span>` : ""}<button type="button" class="x-btn" data-f-rm="${esc(f.id)}" aria-label="Detach ${esc(f.name)}">${CLOSE}</button></li>`).join("") || `<li class="mini">No files attached.</li>`;
    const cid = dlg.querySelector("select[name=courseId]").value;
    const cands = Object.values(state.files).filter(f => !attached.has(f.id)).sort((a, b) => a.name.localeCompare(b.name));
    const grp = (label, arr) => arr.length ? `<optgroup label="${esc(label)}">${arr.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("")}</optgroup>` : "";
    tfAttach.innerHTML = `<option value="">Attach a file…</option>` + grp("This course", cands.filter(f => (f.courseId || "") === cid)) + grp("Other files", cands.filter(f => (f.courseId || "") !== cid));
    $("#tfUpload").hidden = !caps.assets;
  };
  tfAttach.addEventListener("change", () => { if (tfAttach.value) { attached.add(tfAttach.value); drawFiles(); } });
  tfFiles.addEventListener("click", e => { const b = e.target.closest("[data-f-rm]"); if (b) { attached.delete(b.dataset.fRm); drawFiles(); } });
  $("#tfUpload").addEventListener("click", () => $("#tfFile").click());
  $("#tfFile").addEventListener("change", async e => {
    const list = [...(e.target.files || [])]; e.target.value = "";
    if (!list.length) return;
    const cid = dlg.querySelector("select[name=courseId]").value;
    const made = await uploadFiles(list, {courseId: cid, folderId: "assignments", quiet: true});
    made.forEach(f => attached.add(f.id));
    if (dlg.open) drawFiles();
  });
  drawFiles();
  // Sticky notes
  const tfNotes = $("#tfNotes"), tfNoteAttach = $("#tfNoteAttach");
  const drawNotes = () => {
    const ns = [...noteSet].map(id => state.notes[id]).filter(Boolean);
    tfNotes.innerHTML = ns.map(n => `<div class="tf-note" style="--nc:${noteColor(n.color)}"><span>${esc(n.text.slice(0, 140)) || "<i>Empty note</i>"}</span><button type="button" class="x-btn" data-n-rm="${esc(n.id)}" aria-label="Detach note">${CLOSE}</button></div>`).join("")
      + newNotes.map((txt, i) => `<div class="tf-note" style="--nc:${noteColor("yellow")}"><span>${esc(txt.slice(0, 140))}</span><button type="button" class="x-btn" data-n-new="${i}" aria-label="Remove new note">${CLOSE}</button></div>`).join("")
      || `<span class="mini">No sticky notes. Write one here, or attach one from the Notes board.</span>`;
    const cands = notesArr().filter(n => !noteSet.has(n.id) && !n.archived).sort((a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0));
    tfNoteAttach.innerHTML = `<option value="">Attach a note from the board…</option>` + cands.map(n => `<option value="${esc(n.id)}">${esc((n.text.trim() || "Empty note").slice(0, 60))}${n.taskId && state.tasks[n.taskId] ? " (on " + esc(state.tasks[n.taskId].title) + ")" : ""}</option>`).join("");
    tfNoteAttach.hidden = !cands.length;

  };
  tfNoteAttach.addEventListener("change", () => { if (tfNoteAttach.value) { noteSet.add(tfNoteAttach.value); drawNotes(); } });
  tfNotes.addEventListener("click", e => { const b = e.target.closest("[data-n-rm]"), c = e.target.closest("[data-n-new]"); if (b) { noteSet.delete(b.dataset.nRm); drawNotes(); } if (c) { newNotes.splice(Number(c.dataset.nNew), 1); drawNotes(); } });
  const addNote = () => { const inp = $("#tfNoteNew"), v = inp.value.trim(); if (!v) return; newNotes.push(v); inp.value = ""; drawNotes(); inp.focus(); };
  $("#tfNoteAddBtn").addEventListener("click", addNote);
  $("#tfNoteNew").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); addNote(); } });
  drawNotes();
  $("#clAdd").addEventListener("click", add);
  $("#clNew").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  applyType();
}

function deleteTask(id){
  const t = state.tasks[id]; if (!t) return;
  const later = t.seriesId ? tasksArr().filter(x => x.seriesId === t.seriesId && x.id !== id && x.due >= t.due) : [];
  if (!later.length) { dlg.close(); applyChanges([{kind:"task", id, after:null}], `Deleted ${t.title}`); return; }
  openSheet(`<form class="sheet">${head("Delete Repeating Task")}<div class="sheet-body"><p style="margin:0">${esc(t.title)} repeats. Delete just this one, or this one and the ${later.length} after it?</p></div>
    <div class="sheet-foot"><button type="button" class="btn" data-act="close">Cancel</button><span class="spacer"></span><button type="button" class="btn" id="delOne">Just this one</button><button type="button" class="btn primary" id="delAll" style="background:var(--late);border-color:var(--late);color:#fff">This and later</button></div></form>`);
  $("#delOne").addEventListener("click", () => { dlg.close(); applyChanges([{kind:"task", id, after:null}], `Deleted ${t.title}`); });
  $("#delAll").addEventListener("click", () => { dlg.close(); applyChanges([t, ...later].map(x => ({kind:"task", id:x.id, after:null})), `Deleted ${later.length + 1} tasks`); });
}

/* ---------- Syllabus parsing (rule-based, no AI) ---------- */
const SY = (() => {
  const MONTH_RE = "(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\\.?";
  const MIDX = m => ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m.toLowerCase().slice(0, 3));
  const ORD = "(?:st|nd|rd|th)?";
  const WEEKDAY_RE = /\b(mon(?:day)?|tues?(?:day)?|wed(?:nesday)?|thu(?:rs?(?:day)?)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b\.?,?/gi;
  const pad2 = n => String(n).padStart(2, "0");
  const isoOf = (y, m, d) => { const dt = new Date(y, m, d); return (dt.getMonth() === m && dt.getDate() === d) ? `${y}-${pad2(m + 1)}-${pad2(d)}` : ""; };

  function termInfo(text){
    let m = text.match(/\b(fall|autumn|spring|summer|winter)\s*(?:semester|quarter|term|session)?\s*[,'’]?\s*(20\d{2})\b/i) || text.match(/\b(20\d{2})\s*(fall|autumn|spring|summer|winter)\b/i);
    if (!m) {
      const s2 = text.match(/\b(fall|autumn|spring|summer|winter)\s*(?:semester|quarter|term)?\s*['’](\d{2})\b/i) || text.match(/\b(FA|FL|AU|SP|SU|SM|WI|WN)\s?-?(\d{2})\b/);
      if (!s2) return null;
      const map = {fa:"fall", fl:"fall", au:"fall", sp:"spring", su:"summer", sm:"summer", wi:"winter", wn:"winter"};
      const season = map[s2[1].toLowerCase()] || s2[1].toLowerCase();
      return {season: season === "autumn" ? "fall" : season, year: 2000 + Number(s2[2]), label: s2[0]};
    }
    const season = (isNaN(m[1]) ? m[1] : m[2]).toLowerCase(), year = Number(isNaN(m[1]) ? m[2] : m[1]);
    return {season: season === "autumn" ? "fall" : season, year, label: m[0]};
  }
  function makeYearFor(term, today){
    return (mo) => {
      if (term) {
        if (term.season === "fall" && mo <= 1) return term.year + 1;
        if (term.season === "winter" && mo >= 10) return term.year - 1;
        return term.year;
      }
      const t = new Date(today + "T00:00:00");
      let y = t.getFullYear();
      const d = new Date(y, mo, 15);
      if ((t - d) / 864e5 > 120) y += 1;
      else if ((d - t) / 864e5 > 240) y -= 1;
      return y;
    };
  }

  // Find all dates in a line. Returns [{index, end, iso, isoEnd}]
  // Handles month names (Oct 5, 5 Oct, October the 5th, 5th of October, Oct-5, 5-Oct-26, Oct.5), numeric dates
  // (10/5, 10/5/26, 10-05-2026, 10.5.2026, 2026-10-05, 2026/10/05), day-first dates when the syllabus uses them
  // (25/10), ranges (Oct 5-9, Oct 30 - Nov 2, 5-9 Oct, 10/5-10/9), lists (Oct 5 & 7) and weekday forms (Tue 9-30).
  let DAY_FIRST = false;
  const WDAY = "(?:mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sun)(?:day|sday|nesday|rsday|urday)?\\.?";
  const YR = "(?:,?\\s*(?:(20\\d{2})|['’](\\d{2})))";
  const RANGE = "\\s*(?:-|–|—|to|through|thru|until|till)\\s*";
  const y2 = (full, short) => full ? Number(full) : short ? 2000 + Number(short) : null;
  const yNum = s => s ? (s.length === 2 ? 2000 + Number(s) : Number(s)) : null;
  function findDates(line, yearFor){
    const out = [], used = [];
    const overlap = (a, b) => used.some(([x, y]) => a < y && b > x);
    const push = (idx, end, iso, isoEnd) => { if (!iso || overlap(idx, end)) return false; used.push([idx, end]); out.push({index: idx, end, iso, isoEnd: isoEnd || ""}); return true; };
    const md = (a, b) => { // numeric month/day order
      a = Number(a); b = Number(b);
      if (a > 12 && b <= 12) return [b - 1, a];
      if (DAY_FIRST && b <= 12) return [b - 1, a];
      return [a - 1, b];
    };
    let m;
    // ISO and year-first numeric: 2026-10-05, 2026/10/05, 2026.10.05
    const reISO = /\b(20\d{2})([-/.])(\d{1,2})\2(\d{1,2})\b/g;
    while ((m = reISO.exec(line))) push(m.index, m.index + m[0].length, isoOf(Number(m[1]), Number(m[3]) - 1, Number(m[4])));
    // Day-month-year joined by dashes, slashes or dots: 5-Oct-26, 05/Oct/2026
    const reDMY = new RegExp("\\b(\\d{1,2})[-/.]" + MONTH_RE + "[-/.](20\\d{2}|\\d{2})(?![\\d:])", "gi");
    while ((m = reDMY.exec(line))) push(m.index, m.index + m[0].length, isoOf(yNum(m[3]), MIDX(m[2]), Number(m[1])));
    // Month name first: Oct 5, October 5th, Oct. 5, 2026, Oct the 5th, Oct-5, Oct.5, with optional range to another day or month
    const reA = new RegExp("\\b" + MONTH_RE + "(?:\\s*[-/]\\s*|\\s+the\\s+|\\s*)(\\d{1,2})" + ORD + "(?!\\d)(?!:\\d)" + YR + "?(?:" + RANGE + "(?:" + MONTH_RE + "\\s*[-/]?\\s*)?(\\d{1,2})" + ORD + "(?!\\d)(?!:\\d)(?!\\s*(?:am|pm|a\\.m|p\\.m))" + YR + "?)?", "gi");
    while ((m = reA.exec(line))) {
      const mo = MIDX(m[1]), d = Number(m[2]);
      if (d < 1 || d > 31) continue;
      if (/^(may|mar)$/.test(m[1])) continue; // lowercase "may" and "mar" are ordinary words
      const y = y2(m[3], m[4]) || yearFor(mo);
      let isoEnd = "";
      if (m[6]) { const mo2 = m[5] ? MIDX(m[5]) : mo; const yy = y2(m[7], m[8]) || (mo2 < mo ? y + 1 : y); isoEnd = isoOf(yy, mo2, Number(m[6])); }
      if (push(m.index, m.index + m[0].length, isoOf(y, mo, d), isoEnd)) {
        // "Oct 5 & 7", "Oct 5 and 12", "Oct 5, 7"
        const rest = line.slice(m.index + m[0].length);
        const more = /^(\s*(?:&|and|,|\/)\s*(\d{1,2})(?:st|nd|rd|th)?)(?![\d:%]|\s*(?:am|pm|a\.m|p\.m|points?|pts|%))/i.exec(rest);
        if (more && Number(more[2]) >= 1 && Number(more[2]) <= 31) push(m.index + m[0].length, m.index + m[0].length + more[1].length, isoOf(y, mo, Number(more[2])));
      }
    }
    // Day first: 5 Oct, 5th October, 5th of October, 5-Oct, 5-Oct-26, 5/Oct/2026, 5-9 Oct, 5th-9th of October
    const reB = new RegExp("\\b(\\d{1,2})" + ORD + "(?:" + RANGE + "(\\d{1,2})" + ORD + ")?(?:\\s+of\\s+|\\s*[-/.]\\s*|\\s+)" + MONTH_RE + "(?:\\s*[-/]\\s*(\\d{2}|20\\d{2})(?![\\d:])|,?\\s+(20\\d{2})(?![\\d:]))?", "gi");
    while ((m = reB.exec(line))) {
      const mo = MIDX(m[3]), d = Number(m[1]);
      if (d < 1 || d > 31) continue;
      const y = yNum(m[4]) || yNum(m[5]) || yearFor(mo);
      push(m.index, m.index + m[0].length, isoOf(y, mo, d), m[2] ? isoOf(y, mo, Number(m[2])) : "");
    }
    // Numeric with a year, dashes or dots: 10-05-2026, 10.5.26, 25.10.2026
    const reN = /(^|[^\d.\-/])(\d{1,2})([-.])(\d{1,2})\3(20\d{2}|\d{2})(?![\d.\-/])/g;
    while ((m = reN.exec(line))) {
      const [mo, d] = md(m[2], m[4]);
      if (mo < 0 || mo > 11 || d < 1 || d > 31) continue;
      push(m.index + m[1].length, m.index + m[0].length, isoOf(yNum(m[5]), mo, d));
    }
    // Weekday then month-day with dash or dot: Tue 9-30, Thu 10.1 (needs the weekday so section numbers aren't mistaken for dates)
    const reG = new RegExp("\\b" + WDAY + ",?\\s*\\(?\\s*(\\d{1,2})[-.](\\d{1,2})\\)?(?![\\d.])", "gi");
    while ((m = reG.exec(line))) {
      const [mo, d] = md(m[1], m[2]);
      if (mo >= 0 && mo < 12) push(m.index, m.index + m[0].length, isoOf(yearFor(mo), mo, d));
    }
    // Slashes: 10/5, 10/05/26, 10/5/2026, 10/5-10/9, 10/5 - 9, 25/10 (day first)
    const reC = /(^|[^\d/.])(\d{1,2})\/(\d{1,2})(?:\/(\d{4}|\d{2}))?(?:\s*(?:-|–|—|to|through|thru)\s*(\d{1,2})(?:\/(\d{1,2}))?(?:\/(\d{4}|\d{2}))?(?![\d:])(?!\s*(?:am|pm|a\.m|p\.m)))?(?![\d/])(?!\s*(?:of\b|pts?\b|points?\b|%|marks?\b))/g;
    while ((m = reC.exec(line))) {
      const [mo, d] = md(m[2], m[3]);
      if (mo < 0 || mo > 11 || d < 1 || d > 31) continue;
      const y = yNum(m[4]) || yearFor(mo);
      let isoEnd = "";
      if (m[5]) {
        if (m[6]) { const [mo2, d2] = md(m[5], m[6]); isoEnd = isoOf(yNum(m[7]) || (mo2 < mo ? y + 1 : y), mo2, d2); }
        else if (Number(m[5]) > d && Number(m[5]) <= 31) isoEnd = isoOf(y, mo, Number(m[5]));
      }
      push(m.index + m[1].length, m.index + m[0].length, isoOf(y, mo, d), isoEnd);
    }
    return out.sort((a, b) => a.index - b.index);
  }

  // Due times: 11:59 pm, 11:59pm, 11:59 PM, 11:59p, 5pm, 5 p.m., 11.59pm, 23:59, noon, midnight, end of day, 8:30-10:20 am
  function findTime(s, preferStart){
    const AP = "(a\\.?m\\.?|p\\.?m\\.?|(?<=\\d)[ap](?![a-z]))";

  function canonicalTitle(seg, type, yearFor){

  function courseInfo(lines, text){

  const WEEK_WORDS = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18};

  function gradeWeights(lines){
    const out = {};

    for (const l of lines) { const m = l.match(/^(?:grand\s+)?total(?:\s+points)?\b[^\d%]*(\d{2,4})(?:\s*(?:pts|points))?\s*$/i); if (m) { total = Number(m[1]); break; } }

  // Main entry: text -> {course, items, term}
  function parse(text, today){
    text = String(text || "").replace(/\r/g, "").replace(/\u00a0/g, " ");

      if (/^(?:page\s*)?\d{1,3}\s*(?:of|\/)\s*\d{1,3}$/i.test(l) || /^page\s+\d{1,3}$/i.test(l) || /^[-–]?\s*\d{1,3}\s*[-–]?$/.test(l)) return false;

    const weekMon = {};
    const monday = iso => { const d = new Date(iso + "T00:00:00"); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    const addD = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    lines.forEach(l => {
      const w = weekOf(l);
      if (!w) return;
      const ds = findDates(l, yearFor);
      const after = w.end;
      if (ds.length && ds[0].index >= after && ds[0].index - after <= 16 && !classify(l.slice(after, ds[0].index))) weekMon[w.n] = monday(ds[0].iso);
      else if (ds.length && ds[0].end <= w.index && w.index - ds[0].end <= 6) weekMon[w.n] = monday(ds[0].iso);
    });
    let week1 = null;
    for (const l of lines) { if (/\b(classes|instruction|semester|quarter|term|class)\s+(begins?|starts?)|first day of (class|classes|instruction)/i.test(l)) { const ds = findDates(l, yearFor); if (ds.length) { week1 = monday(ds[0].iso); break; } } }
    const known = Object.keys(weekMon).map(Number).sort((a, b) => a - b);
    if (!week1 && known.length) week1 = addD(weekMon[known[0]], -7 * (known[0] - 1));
    const weekDue = n => weekMon[n] ? addD(weekMon[n], 4) : week1 ? addD(week1, 7 * (n - 1) + 4) : "";
    // "Class 12", "Lecture 12", "Session 12": count class meetings from the first week
    const mdays = meetingDays(course.schedule);
    const sessionDate = n => {
      if (!week1 || !mdays.length || n < 1 || n > 80) return "";
      let d = week1, count = 0;
      for (let i = 0; i < 200; i++) { const wd = new Date(d + "T00:00:00").getDay(); if (mdays.includes(wd)) { count++; if (count === n) return d; } d = addD(d, 1); }
      return "";
    };

    const items = [], assigned = {};
    let ctxMonth = -1, ctxMonthAge = 99;
    let ctxDate = null, ctxAge = 99, ctxWeek = null, ctxWeekAge = 99;
    const MONTH_ONLY = new RegExp("^\\s*" + MONTH_RE + "(?:\\s+20\\d{2})?\\s*[:\\-–—]?\\s*$", "i");
    const DAY_LEAD = new RegExp("^\\s*(?:" + WDAY + ",?\\s*)?(\\d{1,2})(?:st|nd|rd|th)?(?:\\s*\\(?" + WDAY + "\\)?)?(?=[\\s\\t:.)\\-–—]|$)(?!:\\d)(?!\\.\\d)(?![\\s\\t]*[\\/%])(?!\\s*(?:of|pts?|points?|am|pm|a\\.m|p\\.m|hours?|hrs?|min)\\b)", "i");
    lines.forEach(line => {
      const mh = line.match(MONTH_ONLY);
      if (mh) { ctxMonth = MIDX(mh[1]); ctxMonthAge = 0; return; }
      ctxMonthAge++;
      let dates = findDates(line, yearFor);
      if (!dates.length && ctxMonth >= 0 && ctxMonthAge <= 40) {
        const dl = line.match(DAY_LEAD);
        if (dl && Number(dl[1]) >= 1 && Number(dl[1]) <= 31) { const iso = isoOf(yearFor(ctxMonth), ctxMonth, Number(dl[1])); if (iso) dates = [{index: 0, end: dl[0].length, iso, isoEnd: ""}]; }
      }
      const wk = weekOf(line);
      if (!dates.length) {
        const sm = line.match(/\b(?:class|lecture|lec|session|meeting|day)\s*#?\s*(\d{1,2})\b/i);
        if (sm) { const iso = sessionDate(Number(sm[1])); if (iso) { dates = [{index: sm.index, end: sm.index + sm[0].length, iso, isoEnd: "", session: true}]; } }
      }
      if (dates.length && !SKIP_LINE.test(line)) { ctxDate = dates; ctxAge = 0; } else ctxAge++;
      if (wk) { ctxWeek = wk.n; ctxWeekAge = 0; } else ctxWeekAge++;
      if (SKIP_LINE.test(line) && !/\b(homework|hw\s*\d|quiz|exam|midterm|project|lab\s*\d|essay|paper)\b.*\bdue\b/i.test(line)) return;
      const segs = segments(line);
      segs.forEach(seg => {
        const type = classify(seg);
        if (!type) return;
        let ds = findDates(seg, yearFor);
        let source = "date";
        if (!ds.length && dates.length) { ds = dates.length === 1 ? dates : [dates[Math.min(dates.length - 1, segs.indexOf(seg))] || dates[0]]; if (ds[0].session) source = "session"; }
        const itemLine = line.length < 100 && /\b(due|begins?|starts?|assigned|released|opens?|posted|submit|turn in)\b/i.test(line);
        const bare = line.replace(/\b\d{1,2}(?:[:.]\d{2})?\s*(?:a\.?m\.?|p\.?m\.?)|\b\d{1,2}:\d{2}\b/gi, " ").replace(/\b(?:homework|hw|problem set|pset|ps|quiz|exam|midterm|test|lab|project|assignment|essay|paper|report|chapter|ch|module|unit|part)\s*#?\s*\d+[a-z]?\b/gi, " ").match(/\b\d+(?:\.\d+)?\b/g) || [];
        if (!ds.length && !wk && ctxDate && ctxAge >= 1 && ctxAge <= (itemLine ? 7 : 2) && line.length < 100 && !POLICY.test(seg) && bare.length === 0) { ds = [ctxDate[ctxDate.length - 1]]; source = "context"; }
        let due = "", start = "";
        if (ds.length) {
          const d = ds[ds.length - 1];
          if (ds.length >= 2 && /(assigned|out|released).*(due)/i.test(seg)) { start = ds[0].iso; due = ds[ds.length - 1].iso; }
          else if (d.isoEnd && (type === "Project" || /through|thru|window|open/i.test(seg))) { start = d.iso; due = d.isoEnd; }
          else due = d.isoEnd && /due/i.test(seg) ? d.isoEnd : d.iso;
        } else if (ctxWeek && ctxWeekAge <= 8) {
          due = weekDue(ctxWeek); source = due ? "week" : "none";
          const wd = seg.match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i);
          if (due && wd) due = addD(due, ["mon","tue","wed","thu","fri","sat","sun"].indexOf(wd[1].toLowerCase()) - 4);
        }
        else source = "none";
        if (POLICY.test(seg) && source !== "date") return;
        if (POLICY.test(line) && source === "date" && !findDates(seg, yearFor).length && !segs.some(x => x !== seg && findDates(x, yearFor).length) && /\b(all|each|every)\b/i.test(line)) return;
        if (POLICY.test(seg) && !/\bdue\b/i.test(seg) && seg.length > 60) return;
        if (source === "none") {
          if (!/\b(homework|hw\s*\d|quiz\s*\d|exam|midterm|final exam|project|lab\s*\d)\b/i.test(seg)) return;
          if (POLICY.test(line) || /\t/.test(line) || bare.length >= 1) return; // grading tables and policy text, not tasks
          if (!/\d/.test(canonicalTitle(seg, type, yearFor)) && !/\b(final|midterm)\b/i.test(seg)) return; // "Homework" with no number or date
          // Sentences from policy or description paragraphs aren't tasks.
          if (seg.length > 45 || /[.!?]\s+[A-Z]|\b(is|are|will|may|can|must|should|there|if|when|however|available|allowed|policy)\b/i.test(line)) return;
        }
        const title = canonicalTitle(seg, type, yearFor);
        if (!title || title.length < 2) return;
        if (ASSIGNED.test(seg) && !/\bdue\b/i.test(seg) && due && type !== "Exam" && type !== "Quiz") { assigned[title.toLowerCase()] = due; return; }
        const pS = type === "Exam" || type === "Quiz";
        const time = findTime(seg, pS) || (ds.length && dates.length === 1 && source !== "context" ? findTime(line, pS) : "");
        items.push({title, type, due, start, time, source, note: line.slice(0, 300), hasDue: /\bdue\b/i.test(seg)});
      });
    });

    // Merge duplicates: same title and date, or numbered titles repeated elsewhere (prefer the one marked "due").
    const out = [];
    const byKey = {};
    items.forEach(it => {
      const k = it.title.toLowerCase() + "|" + it.due;
      if (byKey[k]) { if (!byKey[k].time && it.time) byKey[k].time = it.time; return; }
      byKey[k] = it; out.push(it);
    });
    const numbered = {};
    out.forEach(it => { if (/\d/.test(it.title)) (numbered[it.title.toLowerCase()] = numbered[it.title.toLowerCase()] || []).push(it); });
    const drop = new Set();
    Object.values(numbered).forEach(g => {
      if (g.length < 2) return;
      const dated = g.filter(x => x.source === "date");
      const keep = (dated.filter(x => x.hasDue)[0]) || dated[0] || g[0];
      g.forEach(x => { if (x !== keep) drop.add(x); });
    });
    const final = out.filter(x => !drop.has(x)).map(x => {
      if (!x.start && assigned[x.title.toLowerCase()] && assigned[x.title.toLowerCase()] <= x.due) x.start = assigned[x.title.toLowerCase()];
      return x;
    });
    final.sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : 0);
    // Grade weights from the grading breakdown ("Homework 20%", "Midterm exams 40% (20% each)", or a points table with a Total row)
    const weights = gradeWeights(lines);
    const countOf = type => final.filter(x => x.type === type && !(type === "Exam" && /final/i.test(x.title) && weights.Final)).length;
    final.forEach(x => {
      const key = x.type === "Exam" && /final/i.test(x.title) && weights.Final ? "Final" : x.type;
      const w = weights[key];
      if (!w) return;
      const v = w.each != null ? w.each : w.pct / Math.max(1, w.count || (key === "Final" ? 1 : countOf(x.type)));
      if (v > 0 && v <= 100) x.weight = Math.round(v * 10) / 10;
    });
    return {course, items: final, term, lineCount: lines.length, weightsFound: Object.keys(weights).length > 0};
  }
  return {parse, findDates, termInfo, findTime, meetingDays};
})();

/* ---------- Syllabus import (PDF or text, parsed on this device) ---------- */
const PDFJS_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFW_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Couldn't load " + src)); document.head.appendChild(s); });
}
let pdfReady = null;
function loadPdfJs(){
  if (!pdfReady) pdfReady = (async () => {
    // Loading the worker script first lets pdf.js run on the page itself, which works inside the published page.
    await loadScript(PDFW_URL);
    await loadScript(PDFJS_URL);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFW_URL;
  })().catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}
async function pdfText(buf, onPage){
  await loadPdfJs();
  const doc = await window.pdfjsLib.getDocument({data: buf, isEvalSupported: false, disableFontFace: true}).promise;
  const n = Math.min(doc.numPages, 40), out = [];
  for (let p = 1; p <= n; p++) {
    if (onPage) onPage(p, n);
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => typeof i.str === "string" && i.str.trim() !== "")
      .map(i => ({s: i.str, x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || i.height || 10}));
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const r = rows.find(r => Math.abs(r.y - it.y) <= Math.max(2, Math.min(r.h, it.h) * 0.45));
      if (r) r.items.push(it); else rows.push({y: it.y, h: it.h, items: [it]});
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let line = "", end = null;
      for (const it of r.items) {
        if (end !== null) {
          const gap = it.x - end;
          if (gap > it.h * 1.2) line += "\t";
          else if (gap > it.h * 0.12 && !/\s$/.test(line) && !/^\s/.test(it.s)) line += " ";
        }
        line += it.s; end = it.x + it.w;
      }
      out.push(line);
    }
    out.push("");
  }
  return {text: out.join("\n"), pages: doc.numPages, read: n};
}

const SEPS = {auto: null, tab: "\t", dash: " - ", colon: ":", equals: "=", semicolon: ";", comma: ","};
function parseCards(text, sep){
  const out = [], bad = [];
  String(text || "").replace(/\r/g, "").split("\n").forEach(line => {
    if (!line.trim()) return;
    let i = -1, s = "";
    if (sep && sep !== "auto") { s = SEPS[sep]; i = line.indexOf(s); }
    else for (const cand of ["\t", " - ", " – ", " — ", " : ", ": ", " = ", " ; ", ";", ","]) { const k = line.indexOf(cand); if (k > 0) { i = k; s = cand; break; } }
    if (i <= 0) { bad.push(line); return; }
    const front = line.slice(0, i).trim(), back = line.slice(i + s.length).trim();
    if (front && back) out.push({front, back}); else bad.push(line);
  });
  return {cards: out, bad};
}

/* Quizzes made automatically from your cards */
const normAns = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\([^)]*\)/g, " ").replace(/[^a-z0-9%.\- ]+/g, " ").replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b){
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) { const cur = [i]; for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[b.length];
}
function gradeWritten(given, expected){
  const g = normAns(given); if (!g) return {correct: false};
  const alts = [expected].concat(String(expected).split(/\s*[\/;]\s*/)).map(normAns).filter(Boolean);
  if (alts.includes(g)) return {correct: true};
  for (const a of alts) if (a.length >= 4 && lev(g, a) <= Math.max(1, Math.floor(a.length * 0.15))) return {correct: true, close: true};
  const kw = normAns(expected).split(" ").filter(w => w.length > 3);
  if (kw.length >= 3 && kw.filter(w => g.includes(w)).length / kw.length >= 0.8) return {correct: true, close: true};
  return {correct: false};
}
function buildQuiz(deckIds, n, types, dir){
  const pool = [];
  deckIds.forEach(id => { const d = state.decks[id]; if (d) d.cards.forEach(c => { if (c.front.trim() && c.back.trim()) pool.push({deckId: id, c}); }); });
  const picks = shuffle(pool.slice()).sort((a, b) => a.c.box - b.c.box).slice(0, n === "all" ? pool.length : Number(n));
  shuffle(picks);
  const related = deckId => {
    const d = state.decks[deckId], out = [];
    pool.forEach(x => out.push(x));
    decksArr().forEach(o => { if (!deckIds.includes(o.id) && d && o.courseId === d.courseId) o.cards.forEach(c => out.push({deckId: o.id, c})); });
    return out;
  };
  const qs = picks.map((x, k) => {
    const fwd = dir === "fwd" ? true : dir === "rev" ? false : Math.random() < 0.5;
    const prompt = fwd ? x.c.front : x.c.back, answer = fwd ? x.c.back : x.c.front;
    const field = fwd ? "back" : "front";
    const others = [...new Map(related(x.deckId).filter(o => o.c.id !== x.c.id).map(o => [normAns(o.c[field]), o.c[field]])).entries()]
      .filter(([k2]) => k2 && k2 !== normAns(answer)).map(([, v]) => v);
    let type = types[k % types.length];
    if (type === "mc" && others.length < 2) type = types.includes("tf") && others.length >= 1 ? "tf" : "written";
    if (type === "tf" && others.length < 1) type = "written";
    const q = {deckId: x.deckId, cardId: x.c.id, type, prompt, answer, fwd};
    if (type === "mc") q.options = shuffle([answer].concat(shuffle(others).slice(0, 3)));
    if (type === "tf") { q.truth = Math.random() < 0.5; q.shown = q.truth ? answer : shuffle(others)[0]; }
    return q;
  });
  return qs;
}

function answerQuiz(given){
  const f = ui.fc, q = f.qs[f.i]; if (!q || f.ans[f.i]) return;
  let r;
  if (q.type === "mc") r = {given, correct: normAns(given) === normAns(q.answer)};
  else if (q.type === "tf") r = {given, correct: (given === "true") === q.truth};
  else r = Object.assign({given}, gradeWritten(given, q.answer));
  f.ans[f.i] = r;

  const d = state.decks[q.deckId] && clone(state.decks[q.deckId]);
  if (d) { const c = d.cards.find(x => x.id === q.cardId); if (c) { if (r.correct) c.right++; else { c.wrong++; c.box = Math.max(0, c.box - 1); c.due = todayISO(); c.seen = Math.max(1, c.seen); } saveDeck(d, null); } }

function finishQuiz(){
  const f = ui.fc; f.done = true;

function icsEscape(s){ return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }

function buildIcs(){
  const now = new Date(), stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Studioso//Student planner//EN", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Studioso deadlines"];
  const from = addDays(todayISO(), -1);
  const ts = tasksArr().filter(t => t.due && t.status !== "done" && t.due >= from);
  ts.forEach(t => {
    const c = courseOf(t.courseId);
    lines.push("BEGIN:VEVENT", "UID:" + t.id + "@coursework", "DTSTAMP:" + stamp);
    lines.push(fold("SUMMARY:" + icsEscape((c ? courseLabel(c) + ": " : "") + t.title)));
    const d = t.due.replace(/-/g, "");
    if (t.time) {
      const e = parse(t.due); const [h, m] = t.time.split(":").map(Number); e.setHours(h, m + 30);
      lines.push("DTSTART:" + d + "T" + t.time.replace(":", "") + "00", "DTEND:" + iso(e).replace(/-/g, "") + "T" + pad(e.getHours()) + pad(e.getMinutes()) + "00");
    } else {
      lines.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + addDays(t.due, 1).replace(/-/g, ""));
    }
    lines.push(fold("DESCRIPTION:" + icsEscape([t.type, "Priority: " + PRIO[t.priority], t.notes].filter(Boolean).join("\n"))));
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEscape(t.title + " is due"), t.time ? "TRIGGER:-P1D" : "TRIGGER:-PT15H", "END:VALARM", "END:VEVENT");

}

/* ---------- Zip archives (backups that include your uploaded files) ---------- */
function zipMany(entries){

    lh.setUint32(14, crc, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true); lh.setUint16(26, nm.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(14, 33, true);

}
async function assetBytes(id){

// Brings a backup's files into this app's storage and points the file records at the new copies.
async function importBackupFiles(files, zipEntries){
  const byName = new Map(zipEntries.map(e => [e.name, e.data]));
  const assets = await getAssets();
  let moved = 0, skipped = 0;
  const out = [];
  for (const f of files) {
    const g = clone(f);
    if (g.kind === "file") {
      for (const r of g.revs) {
        const bytes = byName.get("files/" + r.assetId);
        if (!bytes || !assets) { skipped++; continue; }
        try {
          toast(`Restoring files: ${moved + skipped + 1}…`);
          const up = await assets.upload(new File([bytes], r.name || g.name, {type: r.type || "application/octet-stream"}), {type: r.type || "application/octet-stream"});

const safeName = s => String(s || "").replace(/[\\/:*?"<>|\u0000-\u001f]+/g, "_").replace(/\s+/g, " ").trim().slice(0, 100) || "Untitled";
async function runFolderBackup(){
  if (FSB.status !== "on" || !FSB.dir || FSB.busy) return;
  FSB.busy = true;
  try {
    const json = JSON.stringify(Object.assign({app: "studioso", savedAt: new Date().toISOString()}, toArrays()), null, 1);
    await writeText(FSB.dir, "studioso-latest.json", json);                                // always current
    const daily = await FSB.dir.getDirectoryHandle("Daily backups", {create: true});
    await writeText(daily, `studioso-${todayISO()}.json`, json);                          // one per day
    const names = []; for await (const [n, h] of daily.entries()) if (h.kind === "file" && /^studioso-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort(); for (const n of names.slice(0, Math.max(0, names.length - 90))) { try { await daily.removeEntry(n); } catch(e) {} }  // keep 90 days
    // Copies of uploaded files, organized by course and folder
    const done = (() => { try { return JSON.parse(localStorage.getItem("studioso:fsFiles") || "{}"); } catch(e) { return {}; } })();
    const filesDir = await FSB.dir.getDirectoryHandle("Files", {create: true});
    let copied = 0;
    for (const f of Object.values(state.files)) {
      if (f.kind !== "file") continue;
      for (let i = 0; i < f.revs.length; i++) {
        const r = f.revs[i];
        if (!r.assetId || done[r.assetId] || copied >= 25) continue;
        try {
          const c = courseOf(f.courseId), fo = foldersOf(f.courseId).find(x => x.id === f.folderId);
          const d1 = await filesDir.getDirectoryHandle(safeName(c ? courseLabel(c) : "General"), {create: true});
          const d2 = await d1.getDirectoryHandle(safeName(fo ? fo.name : "Other"), {create: true});
          const base = safeName(r.name || f.name), fname = f.revs.length > 1 ? base.replace(/(\.[^.]+)?$/, ` (Rev ${revLetter(i)})$1`) : base;
          const bytes = await assetBytes(r.assetId);
          const fh = await d2.getFileHandle(fname, {create: true}); const w = await fh.createWritable(); await w.write(bytes); await w.close();
          done[r.assetId] = 1; copied++;
        } catch(e) { /* try again next time */ }
      }
    }
    try { localStorage.setItem("studioso:fsFiles", JSON.stringify(done)); } catch(e) {}
    FSB.last = Date.now();
    try { localStorage.setItem("studioso:fsLast", String(FSB.last)); localStorage.setItem("studioso:lastExport", String(FSB.last)); } catch(e) {}
    if (copied >= 25) scheduleFolderBackup(15000);
  } catch(e) {
    console.warn("Folder backup failed", e);
    if (e && (e.name === "NotAllowedError" || e.name === "SecurityError")) FSB.status = "paused";
    else if (e && e.name === "NotFoundError") { FSB.status = "paused"; toast("The backup folder was moved or deleted. Choose it again in Settings."); }
  }
  FSB.busy = false;
  scheduleRender();
}

/* ---------- Desktop app: local folder, offline files, clean shutdown ---------- */
// A small stand-in for the browser's folder handles, so automatic backups write straight into the Studioso folder.
function deskDir(rel, name){
  const join = n => (rel ? rel + "/" : "") + n;
  const bytesOf = async parts => {
    if (parts.every(x => typeof x === "string")) return parts.join("");
    const arr = await Promise.all(parts.map(async x => typeof x === "string" ? new TextEncoder().encode(x) : x instanceof Blob ? new Uint8Array(await x.arrayBuffer()) : x instanceof ArrayBuffer ? new Uint8Array(x) : x));
    const out = new Uint8Array(arr.reduce((n, a) => n + a.length, 0)); let o = 0; arr.forEach(a => { out.set(a, o); o += a.length; }); return out;
  };
  return {kind: "directory", name: name || "Studioso", rel,
    getDirectoryHandle: async (n, o) => { const r = join(n); if (o && o.create) await DESK.mkdir(r); else if (!(await DESK.exists(r))) throw Object.assign(new Error("Not found"), {name: "NotFoundError"}); return deskDir(r, n); },
    getFileHandle: async n => ({name: n, kind: "file", createWritable: async () => { const parts = []; return {write: async d => { parts.push(d); }, close: async () => { await DESK.write(join(n), await bytesOf(parts)); }}; }}),
    entries: async function* () { for (const e of await DESK.list(rel)) yield [e.name, {kind: e.dir ? "directory" : "file", name: e.name}]; },
    removeEntry: async n => DESK.remove(join(n)),
    queryPermission: async () => "granted", requestPermission: async () => "granted"};
}
const deskDone = () => { try { return JSON.parse(localStorage.getItem("studioso:fsFiles") || "{}"); } catch(e) { return {}; } };
function deskMarkDone(id){ const d = deskDone(); d[id] = 1; try { localStorage.setItem("studioso:fsFiles", JSON.stringify(d)); } catch(e) {} }
function deskMirrorRel(f, i, courseId, folderId){
  const cid = courseId != null ? courseId : f.courseId, fid = folderId != null ? folderId : f.folderId;
  const c = courseOf(cid) || state.courses[cid], fo = foldersOf(cid).find(x => x.id === fid);
  const r = f.revs ? f.revs[i] : null, nm = safeName((r && r.name) || f.name);
  const fname = f.revs && f.revs.length > 1 ? nm.replace(/(\.[^.]+)?$/, ` (Rev ${revLetter(i)})$1`) : nm;
  return `Files/${safeName(c ? courseLabel(c) : "General")}/${safeName(fo ? fo.name : "Other")}/${fname}`;
}
function deskRevOf(id){
  for (const f of Object.values(state.files)) { const i = (f.revs || []).findIndex(r => r.assetId === id); if (i >= 0) return {f, i}; }
  return null;
}
const deskCandidates = (f, i) => [f.revs[i].localRel, deskMirrorRel(f, i)].filter(Boolean);
async function deskUniqueRel(rel){
  if (!(await DESK.exists(rel))) return rel;
  for (let k = 2; k < 500; k++) { const r = rel.replace(/(\.[^./]+)?$/, ` (${k})$1`); if (!(await DESK.exists(r))) return r; }
  return rel.replace(/(\.[^./]+)?$/, ` (${uid()})$1`);
}
const deskAssets = {
  upload: async (file, o = {}) => {
    const type = o.type || file.type || "application/octet-stream";
    const bytes = new Uint8Array(await file.arrayBuffer());
    const rel = await deskUniqueRel(deskMirrorRel({name: file.name, courseId: o.courseId || "", folderId: o.folderId || "other"}, 0, o.courseId || "", o.folderId || "other"));
    await DESK.write(rel, bytes);                                   // saved on this computer first
    let id = "local:" + uid();
    if (sbActive() && cloud.on && navigator.onLine !== false) { try { id = (await sbAssets.upload(file, {type})).id; } catch(e) {} }   // then online, if it can
    deskMarkDone(id);
    return {id, url: "#", sizeBytes: file.size, contentType: type, localRel: rel};
  },
  // Local copies are never removed, only the online copy.
  delete: async id => { if (!/^local:/.test(id) && sbActive()) { try { await sbAssets.delete(id); } catch(e) {} } return {deleted: true}; }
};
let deskPromoting = false;
async function deskPromote(){
  // Files added while offline are uploaded once you're signed in and online.
  if (!DESK || deskPromoting || !sbActive() || !cloud.on || navigator.onLine === false) return;
  deskPromoting = true;
  try {
    let n = 0;
    for (const f of Object.values(state.files)) {
      if (f.kind !== "file" || !(f.revs || []).some(r => /^local:/.test(r.assetId) && r.localRel)) continue;
      const nf = clone(f); let changed = false;
      for (const r of nf.revs) {
        if (!/^local:/.test(r.assetId) || !r.localRel) continue;
        const bytes = await DESK.read(r.localRel); if (!bytes) continue;
        try { const up = await sbAssets.upload(new File([bytes], r.name || f.name, {type: r.type || "application/octet-stream"}), {type: r.type || "application/octet-stream"}); deskMarkDone(up.id); r.assetId = up.id; changed = true; n++; }
        catch(e) { throw e; }
      }
      if (changed) applyChanges([{kind: "file", id: f.id, after: nf}], "");
    }
    if (n) toast(`Uploaded ${n} file${n === 1 ? "" : "s"} added while offline`);
  } catch(e) { /* try again later */ }
  deskPromoting = false;
}
async function deskOpenAsset(id){
  const hit = deskRevOf(id);
  if (hit) {
    for (const rel of deskCandidates(hit.f, hit.i)) if (await DESK.exists(rel)) { const err = await DESK.openFile(rel); if (err) toast("Couldn't open the file: " + err); return; }
    if (/^local:/.test(id)) { toast("That file isn't in the Studioso folder any more"); return; }
    try {
      toast("Downloading…");
      const bytes = await assetBytes(id), rel = deskMirrorRel(hit.f, hit.i);
      await DESK.write(rel, bytes); deskMarkDone(id);
      const err = await DESK.openFile(rel); if (err) toast("Couldn't open the file: " + err);
    } catch(e) { toast(navigator.onLine === false ? "You're offline and this file hasn't been saved to this computer yet" : "Couldn't download the file. Try again."); }
  }
}

// Outside Claude (for example on GitHub Pages) files download the normal browser way.
function saveBlob(filename, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type: type || "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const inClaude = () => !!(window.claude && typeof window.claude.use === "function");

  $$(".col.over").forEach(c => { if (c !== col) c.classList.remove("over"); });
  if (!col) return;
  col.classList.add("over");
  const shown = el => el.checkVisibility ? el.checkVisibility() : !!el.getClientRects().length;
  const lists = [...col.querySelectorAll(".col-list")].filter(shown);
  const list = lists[lists.length - 1] || col.querySelector(".col-list");
  const cards = [...col.querySelectorAll(".card")].filter(c => c !== drag.el && shown(c));
  let before = null;
  for (const c of cards) { const r = c.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = c; break; } }
  if (before) { if (drag.ph.nextElementSibling !== before) before.parentNode.insertBefore(drag.ph, before); }
  else if (list.lastElementChild !== drag.ph) list.appendChild(drag.ph);
}
function endDrag(ok){
  cancelAnimationFrame(drag.raf);
  const d = drag; drag = null; renderBlocked = false;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (d.kind === "rot") {
    d.el.classList.remove("rotating");
    const n = state.notes[d.id];
    if (!ok || !n || d.rot === n.rot) { render(); return; }
    applyChanges([{kind:"note", id: n.id, after: Object.assign(clone(n), {rot: d.rot})}], "");
    return;
  }
  if (d.kind === "note") {
    document.body.classList.remove("dragging-note");
    $$("[data-drop-note]").forEach(t => t.classList.remove("hot"));
    const n = state.notes[d.id];
    if (!ok || !n) { render(); return; }
    if (d.target === "trash") { noteToTrash(n.id); return; }
    if (d.target === "archive") { noteToArchive(n.id); return; }
    const z = notesArr().reduce((m, x) => Math.max(m, x.z || 0), 0) + (n.z === notesArr().reduce((m, x) => Math.max(m, x.z || 0), 0) ? 0 : 1);
    if (d.nx === n.x && d.ny === n.y && z === n.z) { render(); return; }
    applyChanges([{kind:"note", id: n.id, after: Object.assign(clone(n), {x: d.nx, y: d.ny, z})}], "");
    return;
  }
  const t = state.tasks[d.id];
  if (d.kind === "bar") {
    d.tip.remove(); d.el.classList.remove("dragging");
    if (!ok || !t || (d.start === d.start0 && d.due === d.due0)) { render(); return; }
    const n = Object.assign(clone(t), {start: d.start, due: d.due});
    const label = `${t.title}: ${d.start === d.due ? fmtShort(d.due) : fmtShort(d.start) + " to " + fmtShort(d.due)}`;
    const inv = applyChanges([{kind:"task", id: t.id, after: n}], "");
    const redo = () => { applyChanges(inv, null); toast("Undone"); };
    toast(label, redo, shiftOffer(t.id));
    return;
  }
  d.ghost.remove();
  if (d.board) d.board.classList.remove("dragging");
  $$(".col.over").forEach(c => c.classList.remove("over"));
  if (!ok || !t || !d.ph.parentNode || !d.ph.closest(".col")) { render(); return; }
  const colEl = d.ph.closest(".col");
  const status = colEl.dataset.status;
  const laneCourse = colEl.hasAttribute("data-course") ? colEl.dataset.course : null;
  const seq = [...d.ph.closest(".col").querySelectorAll(".col-list > *")].filter(n => n === d.ph || (n.classList.contains("card") && n !== d.el));
  const i = seq.indexOf(d.ph);
  const prev = seq[i - 1] ? state.tasks[seq[i - 1].dataset.id] : null, next = seq[i + 1] ? state.tasks[seq[i + 1].dataset.id] : null;
  const num = x => x && typeof x.order === "number";
  const changes = [];
  let order;
  if ((prev && !num(prev)) || (next && !num(next)) || (num(prev) && num(next) && Math.abs(next.order - prev.order) < 1e-6)) {
    // Renumber the whole column so every card has a clean position.
    const colTasks = tasksArr().filter(x => x.status === status && x.id !== t.id).sort(boardOrder);
    const ids = seq.map(n => n === d.ph ? t.id : n.dataset.id);
    const rest = colTasks.filter(x => !ids.includes(x.id)).map(x => x.id);
    [...ids, ...rest].forEach((tid, k) => {
      if (tid === t.id) { order = (k + 1) * 10; return; }
      const x = state.tasks[tid]; if (x && x.order !== (k + 1) * 10) changes.push({kind:"task", id: tid, after: Object.assign(clone(x), {order: (k + 1) * 10})});
    });
  } else if (num(prev) && num(next)) order = (prev.order + next.order) / 2;
  else if (num(prev)) order = prev.order + 10;
  else if (num(next)) order = next.order - 10;
  else order = 10;
  const n = Object.assign(clone(t), {status, order});
  if (status === "done" && t.status !== "done") { n.doneAt = Date.now(); n.pct = 100; }
  if (status !== "done") n.doneAt = null;
  if (!MILESTONE(t.type) && status !== t.status) { if (status === "todo") n.pct = 0; else if (status === "doing" && n.pct >= 100) n.pct = 90; }
  const movedCourse = laneCourse !== null && laneCourse !== (t.courseId || "");
  if (movedCourse) n.courseId = laneCourse;
  changes.push({kind:"task", id: t.id, after: n});
  const cName = movedCourse ? (courseOf(laneCourse) ? courseLabel(courseOf(laneCourse)) : "No Course") : "";
  if (status === "done" && t.status !== "done") confetti();
  applyChanges(changes, movedCourse ? `Moved ${t.title} to ${cName}${t.status !== status ? ", " + STATUS_LABEL[status] : ""}` : t.status !== status ? `Moved ${t.title} to ${STATUS_LABEL[status]}` : "Card moved");
}

try { applyTheme(); } catch(e) {}
loadLocal();

pomoBoot();
initFolderBackup();
render();
initCloud();

ui._day = todayISO();
})();
