<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Match speedrun</title>
<!--
  Exam-prep set · a speedrun of Studyboard's real Match game (pair 6 terms with definitions; a wrong pair adds 1 s).
  Frame 0: the timer is already running and the first pair is lighting up. A wrong pair at 2.2 s (+1 s penalty) adds
  tension; the final time is the challenge ("drop your time"). Matching is retrieval practice (testing effect).
  Music: quirky.wav from 24.0.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#0F1F3D;-webkit-font-smoothing:antialiased;background:#EEF3FF}
#txt{position:absolute;left:60px;right:60px;top:220px;text-align:center;z-index:20}
.blk{display:inline;background:#000;color:#fff;font-weight:800;font-size:64px;line-height:1.34;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#timer{position:absolute;left:0;right:0;top:400px;text-align:center;font-weight:900;font-size:150px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#pen{position:absolute;left:0;right:0;top:420px;text-align:center;font-weight:900;font-size:60px;color:#E4513B;opacity:0;margin-left:520px}
#grid{position:absolute;left:50px;right:50px;top:620px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.c{height:230px;border-radius:30px;background:#fff;box-shadow:0 10px 30px -10px rgba(20,40,90,.3);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-weight:800;font-size:40px;line-height:1.15;border:6px solid transparent}
.c.def{font-weight:600;font-size:34px;color:#36455F}
#done{position:absolute;left:0;right:0;top:1480px;text-align:center;opacity:0}
#done .a{font-weight:900;font-size:90px;color:#1E9E74}
#done .b{font-weight:800;font-size:44px;margin-top:6px}
#sb{position:absolute;left:0;right:0;top:1690px;text-align:center;opacity:0}
#sb span{display:inline-flex;align-items:center;gap:14px;background:#0F1F3D;color:#fff;border-radius:22px;padding:16px 26px;font-weight:700;font-size:36px}
#sb img{width:54px;height:54px;border-radius:12px}
</style>
</head>
<body>
<div id="stage">
  <div id="timer">0.0s</div><div id="pen">+1s</div>
  <div id="grid"></div>
  <div id="done"><div class="a">5.9s 🏁</div><div class="b">drop your time 👇</div></div>
  <div id="sb"><span><img src="{{ROOT}}/icon-512.png" alt="">match game · any deck · studyboard (free)</span></div>
  <div id="txt"><span class="blk">bio final speedrun. beat my time 👀</span></div>
</div>
<script src="{{ROOT}}/marketing/reels/_shared/kit.js"></script>
<script>
const PAIRS = [["Mitosis", "cell divides into 2"], ["ATP", "the cell's energy"], ["Osmosis", "water crosses a membrane"], ["Enzyme", "speeds up reactions"], ["Ribosome", "makes proteins"], ["DNA", "genetic instructions"]];
// layout: 12 cards in a 3x4 grid (terms and definitions shuffled, fixed order)
const ORDER = [[0, 0], [3, 1], [1, 0], [5, 1], [2, 0], [0, 1], [4, 0], [2, 1], [3, 0], [1, 1], [5, 0], [4, 1]];
$("grid").innerHTML = ORDER.map(([p, s], i) => `<div class="c ${s ? "def" : ""}" id="c${i}">${PAIRS[p][s]}</div>`).join("");
const idx = (p, s) => ORDER.findIndex(o => o[0] === p && o[1] === s);
// the run: [time, pair] correct matches, plus one wrong pick (Enzyme + "makes proteins") at 2.15 s
const HITS = [[.45, 0], [1.25, 1], [2.75, 2], [3.45, 3], [4.15, 4], [4.9, 5]], WRONG = [2.15, idx(3, 0), idx(4, 1)];
const FIN = 4.9, END = 7.4;
function render(t) {
  const clock = Math.min(t, FIN) + (t >= WRONG[0] ? 1 : 0);
  $("timer").textContent = (Math.max(0, clock)).toFixed(1) + "s";
  $("timer").style.color = t >= FIN ? "#1E9E74" : "";
  const pk = P(t, WRONG[0], WRONG[0] + .7); $("pen").style.opacity = t >= WRONG[0] && pk < 1 ? 1 - pk * pk : 0; $("pen").style.transform = `translateY(${-40 * pk}px)`;
  ORDER.forEach((_, i) => { const el = $("c" + i); el.style.borderColor = "transparent"; el.style.opacity = 1; el.style.transform = ""; el.style.background = ""; });
  // the wrong pair flashes red and nudges
  if (t >= WRONG[0] - .25 && t < WRONG[0] + .35) [WRONG[1], WRONG[2]].forEach(i => { const el = $("c" + i);
    el.style.borderColor = t < WRONG[0] ? "#3988FE" : "#E4513B"; if (t >= WRONG[0]) { el.style.background = "#FFECE9"; el.style.transform = `translateX(${nudge(t, WRONG[0], 18)}px)`; } });
  HITS.forEach(([th, p]) => { [idx(p, 0), idx(p, 1)].forEach((i, j) => { const el = $("c" + i);
    const sel = th - .3 + j * .15;                       // the term is tapped, then the definition
    if (t >= sel && t < th) el.style.borderColor = "#3988FE";
    if (t >= th) { const k = P(t, th, th + .3); el.style.background = "#DFF7EC"; el.style.borderColor = "#1E9E74";
      el.style.transform = `scale(${1 + .08 * Math.sin(k * Math.PI) - .9 * P(t, th + .25, th + .5)})`; el.style.opacity = 1 - P(t, th + .3, th + .5); } }); });
  const d = P(t, FIN + .2, FIN + .45); $("done").style.opacity = d; $("done").style.transform = `scale(${lerp(1.6, 1, oBack(d))})`;
  const s = P(t, 5.9, 6.2); $("sb").style.opacity = s; $("sb").style.transform = `translateY(${(1 - oBack(s, 1.3)) * 50}px)`;
}
window.render = render; window.END = END; window.COVER = .6;
render(0);
</script>
</body>
</html>
