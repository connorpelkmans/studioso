<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claw machine motivation</title>
<!--
  Set 5 · big moving object from frame 0: a claw already descending on a plush labelled "motivation". It grabs it,
  lifts, wobbles... and drops it at the last second (everyone stays for the drop). Then it grabs "snacks" instead.
  Entertainment; brand in the caption. Music: lofi.wav intro, slowed + reverb.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:radial-gradient(90% 60% at 50% 40%,#2B3F8F 0%,#0D1434 75%)}
#txt{position:absolute;left:60px;right:60px;top:220px;text-align:center;z-index:20}
.blk{display:inline;background:#fff;color:#000;font-weight:800;font-size:66px;line-height:1.34;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#box{position:absolute;left:60px;top:440px;width:960px;height:1200px;border-radius:40px;border:10px solid #FF5FA2;background:rgba(255,255,255,.06);box-shadow:0 0 50px rgba(255,95,162,.45);overflow:hidden}
#rail{position:absolute;left:0;right:0;top:0;height:30px;background:#FF5FA2}
#claw{position:absolute;top:0;width:0;z-index:4}
#cable{position:absolute;left:-5px;top:0;width:10px;background:#C9CED8}
#head{position:absolute;left:-70px;width:140px;height:70px;border-radius:20px;background:#D7DCE6}
.arm{position:absolute;top:50px;width:18px;height:130px;border-radius:9px;background:#AEB5C2;transform-origin:50% 0}
.toy{position:absolute;width:260px;height:230px;border-radius:120px 120px 70px 70px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:36px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -14px 0 rgba(0,0,0,.15)}
.toy b{font-size:80px;line-height:1}
#res{position:absolute;left:0;right:0;top:1690px;text-align:center;font-weight:900;font-size:74px;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="box"><div id="rail"></div>
    <div class="toy" id="tm" style="left:350px;top:900px;background:#1E9E74"><b>⭐</b>motivation</div>
    <div class="toy" id="ts" style="left:20px;top:930px;background:#F2A33A"><b>🍟</b>snacks</div>
    <div class="toy" id="tn" style="left:680px;top:930px;background:#7A4FD6"><b>📺</b>netflix</div>
    <div id="claw"><div id="cable"></div><div id="head"><div class="arm" id="aL" style="left:14px"></div><div class="arm" id="aR" style="left:108px"></div></div></div>
  </div>
  <div id="res">of course. 🍟</div>
  <div id="txt"><span class="blk" id="txtB">trying to grab some motivation at 2am</span></div>
</div>
<script src="{{ROOT}}/marketing/reels/_shared/kit.js"></script>
<script>
// timeline: descend 0-1.2, close 1.2-1.5, lift 1.5-2.6 (with the toy), wobble, DROP at 3.3 (toy falls back), move left 3.8-4.6,
// descend on snacks 4.6-5.3, close, lift with snacks 5.6-6.4
const MX = 480, SX = 150, END = 7.4;
function render(t) {
  let x = MX, d, open = 1;
  if (t < 1.2) d = lerp(380, 700, oCubic(P(t, -0.5, 1.2)));
  else if (t < 1.5) { d = 700; open = 1 - P(t, 1.2, 1.5); }
  else if (t < 3.8) { d = lerp(700, 260, io(P(t, 1.5, 2.6))); open = t >= 3.3 ? P(t, 3.3, 3.45) : 0; }
  else if (t < 4.6) { d = 260; x = lerp(MX, SX, io(P(t, 3.8, 4.6))); }
  else if (t < 5.6) { x = SX; d = lerp(260, 730, io(P(t, 4.6, 5.3))); open = 1 - P(t, 5.3, 5.6); }
  else { x = SX; d = lerp(730, 300, io(P(t, 5.6, 6.4))); open = 0; }
  // wobble while carrying motivation (smooth, slowing), sway on the move
  const wob = t >= 2.2 && t < 3.3 ? Math.sin((t - 2.2) * 9) * 7 * P(t, 2.2, 2.5) : 0;
  $("claw").style.left = x + "px"; $("claw").style.transform = `rotate(${wob}deg)`; $("claw").style.transformOrigin = "0 0";
  $("cable").style.height = (d + 30) + "px"; $("head").style.top = (d + 30) + "px";
  $("aL").style.transform = `rotate(${20 + 22 * open}deg)`; $("aR").style.transform = `rotate(${-20 - 22 * open}deg)`;
  // motivation: lifted with the claw 1.5-3.3, then falls back with a bounce
  const tm = $("tm");
  if (t >= 1.5 && t < 3.3) { tm.style.top = (d + 150) + "px"; tm.style.left = (x - 130) + "px"; tm.style.transform = `rotate(${wob}deg)`; }
  else if (t >= 3.3) { const f = P(t, 3.3, 3.75); const y = lerp(260 + 150, 900, f * f); tm.style.top = y + "px"; tm.style.left = (MX - 130) + "px";
    tm.style.transform = `rotate(${(1 - f) * 12}deg) scale(${t > 3.75 ? 1 + .08 * Math.sin(P(t, 3.75, 3.95) * Math.PI) : 1},1)`; }
  else { tm.style.top = "900px"; tm.style.left = "350px"; tm.style.transform = ""; }
  const ts = $("ts"); if (t >= 5.6) { ts.style.top = (d + 150) + "px"; ts.style.left = (SX - 130) + "px"; } else { ts.style.top = "930px"; ts.style.left = "20px"; }
  $("box").style.transform = `translateX(${nudge(t, 3.75, 10)}px)`;
  const r = P(t, 6.3, 6.55); $("res").style.opacity = r; $("res").style.transform = `scale(${lerp(1.5, 1, oBack(r))})`;
  const txt = t >= 3.4 && t < 6.3 ? "NO 😭" : "trying to grab some motivation at 2am";
  if ($("txtB").textContent !== txt) $("txtB").textContent = txt;
}
window.render = render; window.END = END; window.COVER = .8;
render(0);
</script>
</body>
</html>
