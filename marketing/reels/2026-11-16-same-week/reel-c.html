<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same week reel v2</title>
<!--
  v2, modelled on the top exam-week outlier (847K views, 42x median; vidIQ breakdown 2026-11-15):
  real person at frame 0, one persistent native-style caption (white bold sans, black outline), first cut ~2.6 s on a music hit,
  the Studyboard calendar as the "proof" shot, push-in on the drop, a punchline shot, and a hard loop back to the calm opener.
  No logo, no CTA in the video: it should read as a student post. The background footage is built by build_bg.py (shots-<v>.json).
-->
<style>
@font-face{font-family:"Lexend";font-weight:600;src:url({{ROOT}}/website/assets/fonts/lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-weight:700;src:url({{ROOT}}/website/assets/fonts/lexend-latin-700-normal.woff2) format("woff2")}
:root{--tomato:#E4513B;--display:"Lexend",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff;-webkit-font-smoothing:antialiased}
/* Caption: native look (Inter, white, thick black outline), never moves */
#cap{position:absolute;left:80px;width:840px;top:1070px;text-align:center;z-index:10;
  font:800 64px/1.18 "Inter","Atkinson",system-ui,sans-serif;letter-spacing:-.01em;color:#fff;
  -webkit-text-stroke:9px #000;paint-order:stroke fill;text-shadow:0 4px 18px rgba(0,0,0,.35)}
/* Calendar "proof" shot, opaque, only during its segment */
#cal{position:absolute;inset:0;visibility:hidden;
  background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px),radial-gradient(120% 70% at 80% 0%,#1B4A8F 0%,#0E2A56 55%,#0A1F42 100%);background-size:54px 54px,54px 54px,auto}
#cam{position:absolute;inset:0}
#grid{position:absolute;left:100px;top:330px;width:798px}
.dh{display:flex;gap:10px;margin:0 0 12px 150px;font:600 26px var(--display);color:rgba(255,255,255,.5)}
.dh span{width:84px;text-align:center}
.wk{display:flex;align-items:center;gap:10px;height:72px;margin-bottom:10px;position:relative}
.wl{width:140px;font:600 28px var(--display);color:rgba(255,255,255,.65)}
.c{width:84px;height:72px;border-radius:16px;background:rgba(207,235,221,.18);flex:none}
.glow{position:absolute;left:140px;right:-14px;top:-10px;bottom:-10px;border-radius:24px;outline:5px solid #FF6B57;box-shadow:0 0 54px 10px rgba(228,81,59,.8);opacity:0}
.chip{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;color:#0F1F3D;border-radius:18px;padding:16px 24px;font:700 34px var(--display);box-shadow:0 18px 40px -10px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
.chip i{width:18px;height:18px;border-radius:50%}
.chip em{font-style:normal;font-weight:600;color:var(--tomato);font-size:28px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#tag{position:absolute;left:0;right:0;top:250px;text-align:center;opacity:0}
#tag span{display:inline-block;font:700 32px var(--display);letter-spacing:.04em;color:#0E2A56;background:#FFE45C;padding:12px 24px;border-radius:14px}
#btn{position:absolute;left:250px;width:600px;top:900px;text-align:center;font:700 38px var(--display);color:#fff;background:#3988FE;padding:24px;border-radius:22px;box-shadow:0 20px 50px -12px rgba(57,136,254,.6);opacity:0}
#end{position:absolute;inset:0;visibility:hidden;z-index:8;text-align:center;
  background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px),radial-gradient(120% 70% at 80% 0%,#1B4A8F 0%,#0E2A56 55%,#0A1F42 100%);background-size:54px 54px,54px 54px,auto}
#end img{position:absolute;left:400px;top:520px;width:200px;height:200px;border-radius:46px;box-shadow:0 26px 60px rgba(0,0,0,.4)}
#end .w{position:absolute;left:60px;right:160px;top:770px;font:800 104px/1 var(--display);letter-spacing:-.03em}
#end .s{position:absolute;left:60px;right:160px;top:910px;font:600 40px var(--display);color:#C9D7F2}
#end .u{position:absolute;left:60px;right:160px;top:1010px}
#end .u span{display:inline-block;background:#3988FE;color:#fff;border-radius:26px;padding:24px 42px;font:700 44px var(--display)}
</style>
</head>
<body>
<div id="stage">
  <div id="cal"><div id="cam"><div id="grid"><div class="dh"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div><div id="chips"></div></div></div>
  <div id="tag"><span>Crunch Forecast · free</span></div>
  <div id="btn">Pull work forward</div>
  <div id="end"><img src="{{ROOT}}/icon-512.png" alt=""><div class="w">studyboard</div><div class="s">free · no account needed</div><div class="u"><span>studyboardapp.com</span></div></div>
  <div id="flash"></div>
  <div id="cap"></div>
</div>
<script>
["600 100px Lexend","700 100px Lexend","800 100px Inter"].forEach(f => document.fonts.load(f));
const VARIANT = "c";
const TEXT = {
  a: "every exam i have this semester somehow landed in the exact same week",
  b: "me realizing 3 exams, a lab report and an essay are all in week 11 and it's already week 10",
  c: "nobody warned me november has 4 week elevens in a row",
};
// Caption track: the relatable line, then a turn, then what Studyboard does (only claims the README makes)
const CAPS = [[0, 7.4, TEXT[VARIANT]], [7.4, 8.6, "plot twist: you can see it coming"], [8.6, 10.6, "studyboard flags your worst week, weeks early"]];

// Timeline on a 2.0 s beat grid: dramatic.wav from 32.4 s hits at 0.6, 2.6, 4.6, 6.6; lofi.wav drops at 8.6 for the fix.
// 0-2.6 face | 2.6-5.6 calendar chaos | 5.6-8.6 face-plant (head lands 6.6) | 8.6-10.6 the fix | 10.6-12.0 end card. 12.0 s loops on the grid.
const CAL_IN = 2.6, CAL_OUT = 5.6, FIX_IN = 8.6, FIX_OUT = 10.6, END = 12.0, COVER = 0.3;
const PRESS = 9.1, COOL = 9.35;
const HITS = [2.6, 3.1, 3.6, 4.1], DROP = 4.6;

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const oBack = x => { const c = 2.2, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ioCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const WEEKS = [7, 8, 9, 10, 11, 12], CR = 4;
const RED = VARIANT === "c" ? [2, 3, 4, 5] : [CR];
$("grid").insertAdjacentHTML("beforeend", WEEKS.map((w, r) => `<div class="wk" id="wk${r}"><span class="wl">Week ${w}</span>${[0,1,2,3,4,5,6].map(d => `<span class="c" id="c${r}_${d}"></span>`).join("")}${RED.includes(r) ? `<span class="glow" id="g${r}"></span>` : ""}</div>`).join(""));
const CHIPS = [["Bio midterm", "Tue", "#1E9E74", 150, -70, -8], ["Chem exam", "Wed", "#7A4FD6", 430, -96, 6], ["Calc exam", "Thu", "#E4513B", 290, -160, -4], ["Lab report", "Fri", "#1F6FEB", 470, -40, 4]];
if (VARIANT !== "c") $("chips").innerHTML = CHIPS.map((c, i) => `<div class="chip" id="ch${i}"><i style="background:${c[2]}"></i>${c[0]}<em>${c[1]}</em></div>`).join("");
const HEAT = [.35, .9, 1, 1, .95, .55, .6];
const rowY = r => 330 + 50 + r * 82;

// Heat colours for the fix: mint -> yellow -> orange -> red
const STOPS = [[0, [207, 235, 221]], [.45, [255, 228, 92]], [.72, [255, 160, 70]], [1, [228, 81, 59]]];
const heat = v => { v = clamp(v); for (let i = 1; i < STOPS.length; i++) if (v <= STOPS[i][0]) { const [a, ca] = STOPS[i - 1], [b, cb] = STOPS[i], k = (v - a) / (b - a); return `rgb(${ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(",")})`; } return "rgb(228,81,59)"; };
const COOLED = [.2, .45, .5, .45, .4, .15, .15];

function render(t) {
  const cap = CAPS.find(([a, b]) => t >= a && t < b);
  $("cap").textContent = cap ? cap[2] : "";
  const inCal = t >= CAL_IN && t < CAL_OUT, inFix = t >= FIX_IN && t < FIX_OUT;
  document.querySelectorAll(".c").forEach(el => { el.style.opacity = ""; });
  $("cal").style.visibility = inCal || inFix ? "visible" : "hidden";
  $("end").style.visibility = t >= FIX_OUT ? "visible" : "hidden";
  // White flash on each cut, for 2 frames
  const cut = [CAL_IN, CAL_OUT, FIX_IN, FIX_OUT].some(c => t >= c && t < c + .07);
  $("flash").style.opacity = cut ? .35 : 0;
  $("tag").style.opacity = inFix ? P(t, FIX_IN, FIX_IN + .2) : 0;
  $("btn").style.opacity = inFix ? P(t, FIX_IN + .1, FIX_IN + .3) : 0;
  if (inFix) {
    const pr = P(t, PRESS - .05, PRESS + .05) - P(t, PRESS + .05, PRESS + .2);
    $("btn").style.transform = `scale(${1 - pr * .06})`;
    $("btn").style.background = t > PRESS ? "#1E9E74" : "";
    $("btn").textContent = t > PRESS + .1 ? "✓ Moved 3 things earlier" : "Pull work forward";
    $("cam").style.transform = "none";
    if (VARIANT !== "c") CHIPS.forEach((_, i) => { $("ch" + i).style.opacity = 0; });
    const k = ioCubic(P(t, COOL, COOL + .6));
    WEEKS.forEach((_, r) => [0,1,2,3,4,5,6].forEach(d => {
      const el = $(`c${r}_${d}`), idx = RED.indexOf(r);
      if (idx >= 0) el.style.background = heat(HEAT[d] + (COOLED[d] - HEAT[d]) * k);
      else if (VARIANT !== "c" && (r === CR - 1 || r === CR - 2) && d < 5 && k > 0) { el.style.background = heat(.3 * k); el.style.opacity = .25 + .75 * k; }
      else el.style.background = "";
    }));
    RED.forEach(r => { const g = $("g" + r); g.style.opacity = 1;
      g.style.outlineColor = k > .5 ? "#1E9E74" : ""; g.style.boxShadow = k > .5 ? "0 0 54px 10px rgba(30,158,116,.6)" : ""; });
    return;
  }
  RED.forEach(r => { const g = $("g" + r); g.style.outlineColor = ""; g.style.boxShadow = ""; });
  if (t >= FIX_OUT) { const e = P(t, FIX_OUT, FIX_OUT + .3); $("end").style.opacity = 1; $("cap").textContent = "";
    [...$("end").children].forEach((el, i) => { const k = ioCubic(P(t, FIX_OUT + .05 * i, FIX_OUT + .3 + .05 * i)); el.style.transform = `translateY(${(1 - k) * 40}px)`; el.style.opacity = k; }); return; }
  if (!inCal) return;
  // Shake on each hit, push-in toward the red week on the drop
  let shake = 0; HITS.concat([DROP]).forEach(h => { const k = P(t, h, h + .25); if (k > 0 && k < 1) shake += Math.sin(k * Math.PI * 6) * (1 - k) * 10; });
  const push = ioCubic(P(t, DROP, DROP + .35));
  const focusY = VARIANT === "c" ? rowY(3.5) : rowY(CR);
  $("cam").style.transformOrigin = `540px ${focusY}px`;
  $("cam").style.transform = `scale(${1 + push * .32}) translate(${shake}px,${shake * .4}px)`;
  if (VARIANT !== "c") CHIPS.forEach((c, i) => {
    const el = $("ch" + i), k = P(t, HITS[i] - .1, HITS[i]);
    el.style.left = (100 + c[3]) + "px"; el.style.top = (rowY(CR) + c[4]) + "px";
    el.style.opacity = k > 0 ? 1 : 0;
    el.style.transform = `translateY(${(1 - k) * -280}px) rotate(${c[5]}deg) scale(${1 + (1 - oBack(P(t, HITS[i], HITS[i] + .3))) * .3})`;
  });
  WEEKS.forEach((_, r) => [0,1,2,3,4,5,6].forEach(d => {
    const idx = RED.indexOf(r), el = $(`c${r}_${d}`);
    if (idx < 0) { el.style.background = ""; return; }
    const h = VARIANT === "c" ? HITS[idx] : HITS[0];
    const k = P(t, h, h + (VARIANT === "c" ? .15 : 1.5)), v = HEAT[d] * k;
    el.style.background = k > 0 ? `rgba(${Math.round(207 + 21 * v)},${Math.round(235 - 154 * v)},${Math.round(221 - 162 * v)},${.18 + .82 * k})` : "";
  }));
  RED.forEach(r => { $("g" + r).style.opacity = P(t, DROP - .05, DROP + .1) * (.65 + .35 * Math.abs(Math.sin(t * 3.4))); });
}
window.render = render; window.END = END; window.COVER = COVER;
render(0);
</script>
</body>
</html>
