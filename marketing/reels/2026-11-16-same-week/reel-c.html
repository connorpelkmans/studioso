<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same week reel</title>
<!--
  Relatability format (from vidIQ outlier research, Nov 2026): one block of relatable text over a near-static visual,
  music-only (added in the app), built to loop. Brand stays small: the planner UI is the visual, the logo sits in a corner.
-->
<style>
@font-face{font-family:"Lexend";font-weight:600;src:url({{ROOT}}/website/assets/fonts/lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-weight:700;src:url({{ROOT}}/website/assets/fonts/lexend-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-weight:800;src:url({{ROOT}}/website/assets/fonts/lexend-latin-800-normal.woff2) format("woff2")}
:root{--mark:#FFE45C;--tomato:#E4513B;--display:"Lexend",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;color:#fff;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px),radial-gradient(120% 70% at 80% 0%,#1B4A8F 0%,#0E2A56 55%,#0A1F42 100%);background-size:54px 54px,54px 54px,auto}
#cam{position:absolute;inset:0;transform-origin:50% 62%}
#txt{position:absolute;left:70px;width:830px;top:290px;font:700 64px/1.22 var(--display);letter-spacing:-.015em}
#txt b{color:var(--mark);font-weight:800}
#grid{position:absolute;left:70px;top:720px;width:798px}
.dh{display:flex;gap:10px;margin:0 0 12px 150px;font:600 26px var(--display);color:rgba(255,255,255,.5)}
.dh span{width:84px;text-align:center}
.wk{display:flex;align-items:center;gap:10px;height:72px;margin-bottom:10px;position:relative}
.wl{width:140px;font:600 28px var(--display);color:rgba(255,255,255,.65)}
.c{width:84px;height:72px;border-radius:16px;background:rgba(207,235,221,.2);flex:none}
#glow{position:absolute;left:140px;right:-14px;top:-10px;bottom:-10px;border-radius:24px;outline:5px solid #FF6B57;box-shadow:0 0 54px 10px rgba(228,81,59,.8);opacity:0}
.chip{position:absolute;display:flex;align-items:center;gap:14px;background:#fff;color:#0F1F3D;border-radius:18px;padding:16px 24px;font:700 34px var(--display);box-shadow:0 18px 40px -10px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
.chip i{width:18px;height:18px;border-radius:50%}
.chip em{font-style:normal;font-weight:600;color:var(--tomato);font-size:28px}
#brand{position:absolute;left:70px;top:1330px;display:flex;align-items:center;gap:16px;font:600 30px var(--display);color:rgba(255,255,255,.6)}
#brand img{width:52px;height:52px;border-radius:13px}
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="txt"></div>
    <div id="grid"><div class="dh"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div>
    <div id="chips"></div>
  </div>
  <div id="brand"><img src="{{ROOT}}/icon-512.png" alt="">studyboard</div>
</div>
<script>
["600 100px Lexend","700 100px Lexend","800 100px Lexend"].forEach(f => document.fonts.load(f));
const VARIANT = "c";
const TEXT = {
  a: "every exam i have this semester somehow landed in <b>the exact same week</b>",
  b: "me realizing <b>3 exams, a lab report and an essay</b> are all in week 11 and it's somehow <b>already week 10</b>",
  c: "nobody warned me november has <b>4 week elevens</b> in a row",
};
document.getElementById("txt").innerHTML = TEXT[VARIANT];

const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const oBack = x => { const c = 2.2, d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const WEEKS = [7, 8, 9, 10, 11, 12], CR = 4;
// Variant c: weeks 9-12 all turn red, one after another
const RED = VARIANT === "c" ? [2, 3, 4, 5] : [CR];
$("grid").insertAdjacentHTML("beforeend", WEEKS.map((w, r) => `<div class="wk" id="wk${r}"><span class="wl">Week ${w}</span>${[0,1,2,3,4,5,6].map(d => `<span class="c" id="c${r}_${d}"></span>`).join("")}${r === CR ? '<span id="glow"></span>' : ""}</div>`).join(""));
const CHIPS = [["Bio midterm", "Tue", "#1E9E74", 150, -70, -8], ["Chem exam", "Wed", "#7A4FD6", 430, -96, 6], ["Calc exam", "Thu", "#E4513B", 290, -160, -4], ["Lab report", "Fri", "#1F6FEB", 470, -40, 4]];
$("chips").innerHTML = CHIPS.map((c, i) => `<div class="chip" id="ch${i}"><i style="background:${c[2]}"></i>${c[0]}<em>${c[1]}</em></div>`).join("");
const HEAT = [.3, .9, 1, 1, .95, .55, .6];
const END = 7.5, COVER = 4;
// Hits: when each chip slams in (variant c: each week turns red instead)
const HITS = [1.4, 1.9, 2.4, 2.9];

function render(t) {
  // Slow push-in for the whole loop, plus a small shake on each hit
  let shake = 0; HITS.forEach(h => { const k = P(t, h, h + .25); if (k > 0 && k < 1) shake += Math.sin(k * Math.PI * 6) * (1 - k) * 9; });
  $("cam").style.transform = `scale(${1 + t / END * .05}) translate(${shake}px,${shake * .4}px)`;
  const rowY = r => 720 + 50 + r * 82;
  if (VARIANT !== "c") {
    CHIPS.forEach((c, i) => {
      const el = $("ch" + i), k = P(t, HITS[i] - .12, HITS[i]);
      el.style.left = (70 + c[3]) + "px"; el.style.top = (rowY(CR) + c[4]) + "px";
      el.style.opacity = k > 0 ? 1 : 0;
      el.style.transform = `translateY(${(1 - k) * -260}px) rotate(${c[5]}deg) scale(${1 + (1 - oBack(P(t, HITS[i], HITS[i] + .3))) * .3})`;
    });
  }
  WEEKS.forEach((_, r) => [0,1,2,3,4,5,6].forEach(d => {
    const el = $(`c${r}_${d}`); const idx = RED.indexOf(r);
    const hitT = VARIANT === "c" ? HITS[idx] : HITS[0];
    const k = idx >= 0 ? P(t, hitT, hitT + (VARIANT === "c" ? .2 : 1.6)) : 0;
    const v = HEAT[d] * k;
    el.style.background = idx >= 0 && k > 0 ? `rgba(${Math.round(207 + (228 - 207) * v)},${Math.round(235 - (235 - 81) * v)},${Math.round(221 - (221 - 59) * v)},${.2 + .8 * k})` : "";
  }));
  $("glow").style.opacity = VARIANT === "c" ? 0 : P(t, 2.9, 3.2) * (.6 + .4 * Math.abs(Math.sin(t * 3.4)));
  // Fade everything back to the start state in the last 0.4 s so the loop is seamless
  const lo = P(t, END - .4, END);
  $("chips").style.opacity = 1 - lo; $("grid").style.opacity = 1 - lo * .0;
  if (lo > 0) WEEKS.forEach((_, r) => [0,1,2,3,4,5,6].forEach(d => { const el = $(`c${r}_${d}`); if (el.style.background) el.style.opacity = 1 - lo; }));
  else WEEKS.forEach((_, r) => [0,1,2,3,4,5,6].forEach(d => { $(`c${r}_${d}`).style.opacity = 1; }));
}
window.render = render; window.END = END; window.COVER = COVER;
render(0);
</script>
</body>
</html>
