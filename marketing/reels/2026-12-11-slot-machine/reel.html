<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finals slot machine</title>
<!--
  Set 5 · from the skip-rate data: the reels with a BIG MOVING OBJECT in frame 0 were skipped least (wheel 56.6% vs chat
  screen 91.7%). A slot machine fills the frame, its reels already spinning; each reel stops on a beat (abrupt onsets),
  and the "jackpot" is the worst possible schedule. Minimal reading.
  Music: dramatic.wav from 33.0 (hits every 2 s).
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  background:radial-gradient(80% 50% at 50% 45%,#4A1A6B 0%,#160A2A 70%)}
#txt{position:absolute;left:60px;right:60px;top:220px;text-align:center;z-index:20}
.blk{display:inline;background:#fff;color:#000;font-weight:800;font-size:66px;line-height:1.34;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#m{position:absolute;left:40px;top:470px;width:910px;height:1000px;border-radius:70px;background:linear-gradient(180deg,#F0445B,#B3122E);box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 8px 0 rgba(255,255,255,.25)}
#top{position:absolute;left:0;right:0;top:40px;text-align:center;font-weight:900;font-size:84px;letter-spacing:.04em;color:#FFE45C;text-shadow:0 6px 0 #8A0A1E}
#lights{position:absolute;left:40px;right:40px;top:170px;display:flex;justify-content:space-between}
#lights i{width:34px;height:34px;border-radius:50%;background:#FFE45C;box-shadow:0 0 18px #FFE45C}
#win{position:absolute;left:60px;right:60px;top:250px;height:440px;border-radius:40px;background:#1B0B12;display:flex;gap:24px;padding:24px}
.r{flex:1;border-radius:26px;background:#fff;overflow:hidden;position:relative}
.strip{position:absolute;left:0;right:0;top:0}
.s{height:392px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.s b{font-size:150px;line-height:1}
.s span{font-weight:800;font-size:40px;color:#0F1F3D}
#lever{position:absolute;right:-70px;top:230px;width:40px;height:360px;transform-origin:50% 100%}
#lever::before{content:"";position:absolute;left:8px;top:40px;width:24px;height:320px;border-radius:12px;background:#C9CED8}
#lever::after{content:"";position:absolute;left:-22px;top:-20px;width:84px;height:84px;border-radius:50%;background:#FF2D55;box-shadow:inset -8px -8px 0 rgba(0,0,0,.2)}
#jack{position:absolute;left:0;right:0;top:740px;text-align:center;opacity:0}
#jack .a{font-weight:900;font-size:110px;letter-spacing:.03em;color:#FFE45C;text-shadow:0 6px 0 #8A0A1E}
#jack .b{font-weight:800;font-size:58px;margin-top:6px}
#sb{position:absolute;left:0;right:0;top:1560px;text-align:center;opacity:0}
#sb span{display:inline-flex;align-items:center;gap:16px;background:#fff;color:#0F1F3D;border-radius:24px;padding:20px 30px;font-weight:700;font-size:40px}
#sb img{width:60px;height:60px;border-radius:14px}
</style>
</head>
<body>
<div id="stage">
  <div id="m"><div id="top">FINALS</div><div id="lights"></div>
    <div id="win"><div class="r"><div class="strip" id="s0"></div></div><div class="r"><div class="strip" id="s1"></div></div><div class="r"><div class="strip" id="s2"></div></div></div>
    <div id="lever"></div>
    <div id="jack"><div class="a">JACKPOT</div><div class="b">3 exams. same day. 💀</div></div></div>
  <div id="sb"><span><img src="{{ROOT}}/icon-512.png" alt="">studyboard saw this coming in october</span></div>
  <div id="txt"><span class="blk">spinning for my finals schedule 🎰</span></div>
</div>
<script src="{{ROOT}}/marketing/reels/_shared/kit.js"></script>
<script>
const SYM = [["☕", "coffee"], ["📚", "reading"], ["😴", "nap"], ["📝", "EXAM"], ["🍕", "snacks"], ["😭", "cry"]];
const H = 392, LEN = SYM.length, REPS = 14;
[0, 1, 2].forEach(r => { $("s" + r).innerHTML = Array.from({length: LEN * REPS}, (_, i) => { const [e, w] = SYM[(i + r * 2) % LEN]; return `<div class="s"><b>${e}</b><span>${w}</span></div>`; }).join(""); });
$("lights").innerHTML = Array.from({length: 11}, () => "<i></i>").join("");
const STOP = [2.0, 3.0, 4.0], END = 7.4, JACK = 4.1;
// where each reel must stop so "📝 EXAM" (index 3) is centred: strip index k with (k + r*2) % LEN === 3
const target = r => { let k = LEN * (REPS - 2); while ((k + r * 2) % LEN !== 3) k++; return k * H; };
function render(t) {
  [0, 1, 2].forEach(r => {
    const T = target(r), v = 5200;                         // px per second while spinning
    const k = P(t, -0.4, STOP[r]), y = T * (1 - Math.pow(1 - k, 3)) + (k >= 1 ? 0 : 0);
    // after stopping: a small bounce
    const bnc = t >= STOP[r] ? Math.sin(P(t, STOP[r], STOP[r] + .3) * Math.PI) * 26 * (1 - P(t, STOP[r], STOP[r] + .3)) : 0;
    const el = $("s" + r); el.style.transform = `translateY(${-(y) + bnc}px)`;
    const speed = 3 * T * Math.pow(1 - k, 2) / (STOP[r] + .4);
    el.style.filter = k < 1 ? `blur(${Math.min(10, speed / 900).toFixed(2)}px)` : "";
  });
  // lever pulled at frame 0 and springing back
  $("lever").style.transform = `rotate(${lerp(38, 0, oBack(P(t, -.1, .45)))}deg)`;
  // lights chase (smooth), then all glow on the jackpot
  [...$("lights").children].forEach((l, i) => { const ph = (Math.sin(t * 6 - i * .9) + 1) / 2; l.style.opacity = t >= JACK ? .7 + .3 * Math.sin(t * 5) : .35 + .65 * ph; });
  const j = P(t, JACK, JACK + .3); $("jack").style.opacity = j; $("jack").style.transform = `scale(${lerp(1.7, 1, oBack(j, 2))})`;
  $("m").style.transform = `translateX(${nudge(t, STOP[0], 6) + nudge(t, STOP[1], 6) + nudge(t, STOP[2], 12)}px)`;
  const s = P(t, 5.6, 5.9); $("sb").style.opacity = s; $("sb").style.transform = `translateY(${(1 - oBack(s, 1.3)) * 60}px)`;
}
window.render = render; window.END = END; window.COVER = 1.0;
render(0);
</script>
</body>
</html>
