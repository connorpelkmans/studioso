<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plinko decides tonight</title>
<!--
  Set 5 · big moving object from frame 0: a ball already dropping through a peg board, bouncing on every peg;
  viewers wait to see the slot. It lands on the one slot nobody wanted ("study"), and the text flips to "rigged 😐".
  Music: quirky.wav from 24.0.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#0F1F3D;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,#DFF3FF,#BFE3FF)}
#txt{position:absolute;left:60px;right:60px;top:220px;text-align:center;z-index:20}
.blk{display:inline;background:#000;color:#fff;font-weight:800;font-size:66px;line-height:1.34;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#board{position:absolute;left:40px;top:430px;width:1000px;height:1180px;border-radius:50px;background:#fff;box-shadow:0 30px 70px -20px rgba(20,60,120,.4)}
.peg{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;background:#9BB3D1}
.peg.hit{background:#FFB020;box-shadow:0 0 0 14px rgba(255,176,32,.35)}
#ball{position:absolute;width:130px;height:130px;margin:-65px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF8A8A,#E4314B 60%,#A3122C);box-shadow:0 10px 20px rgba(160,20,40,.35);z-index:3}
.slot{position:absolute;top:1020px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:26px;font-weight:800;font-size:34px;color:#fff}
.slot b{font-size:64px;line-height:1.1}
#rig{position:absolute;left:0;right:0;top:1660px;text-align:center;font-weight:900;font-size:96px;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="board"></div>
  <div id="rig">rigged 😐</div>
  <div id="txt"><span class="blk" id="txtB">letting plinko decide my night</span></div>
</div>
<script src="{{ROOT}}/marketing/reels/_shared/kit.js"></script>
<script>
const B = $("board"), W = 1000, ROWS = 7, GAP = 128, TOP = 120;
const pegs = [];
for (let r = 0; r < ROWS; r++) { const n = r % 2 ? 7 : 8, off = r % 2 ? GAP / 2 : 0;
  for (let i = 0; i < n; i++) { const x = 52 + off + i * GAP, y = TOP + r * 125; pegs.push([x, y]);
    B.insertAdjacentHTML("beforeend", `<div class="peg" style="left:${x}px;top:${y}px"></div>`); } }
const SL = [["😴", "nap", "#7A4FD6"], ["📺", "netflix", "#E4513B"], ["📚", "study", "#1E9E74"], ["📱", "scroll", "#F2A33A"], ["🍜", "snack", "#1F6FEB"]];
SL.forEach(([e, n, c], i) => B.insertAdjacentHTML("beforeend", `<div class="slot" style="left:${20 + i * 194}px;width:180px;background:${c}"><b>${e}</b>${n}</div>`));
// a hand-tuned path: one bounce on a peg per row, drifting to "study" (slot 2, centre x 498)
const BX = [564, 628, 564, 500, 436, 500, 436], pegEls = [...B.querySelectorAll(".peg")];
const T0 = -0.3, DT = .52, END_T = T0 + DT * 8;
const PTS = [[564, TOP - 220, T0]].concat(BX.map((x, r) => [x, TOP + r * 125 - 46, T0 + DT * (r + 1)])).concat([[498, 1060, END_T]]);
const LAND = END_T;
function render(t) {
  let x, y;
  if (t >= LAND) { x = 498; y = 1060; }
  else { let k = 0; while (k < PTS.length - 2 && t >= PTS[k + 1][2]) k++;
    const [x0, y0, a] = PTS[k], [x1, y1, b] = PTS[k + 1], f = clamp((t - a) / (b - a));
    x = lerp(x0, x1, f); y = lerp(y0, y1, f) - (k === 0 ? 0 : Math.sin(f * Math.PI) * 70); }
  const ball = $("ball") || (B.insertAdjacentHTML("beforeend", '<div id="ball"></div>'), $("ball"));
  ball.style.left = x + "px"; ball.style.top = y + "px";
  const sq = t >= LAND ? 1 - .18 * Math.sin(P(t, LAND, LAND + .25) * Math.PI) : 1; ball.style.transform = `scale(${2 - sq},${sq})`;
  pegEls.forEach(p => p.classList.remove("hit"));
  BX.forEach((bx, r) => { const tb = T0 + DT * (r + 1); if (t >= tb && t < tb + .3) {
    let best = null, bd = 1e9; pegEls.forEach((p, k) => { const [px, py] = pegs[k]; if (py !== TOP + r * 125) return; const d = Math.abs(px - bx); if (d < bd) { bd = d; best = p; } }); if (best) best.classList.add("hit"); } });
  B.style.transform = `translateY(${nudge(t, LAND, 10)}px)`;
  const g = P(t, LAND + .5, LAND + .7); $("rig").style.opacity = g; $("rig").style.transform = `scale(${lerp(1.6, 1, oBack(g))})`;
  const txt = t >= LAND + .5 ? "plinko said study." : "letting plinko decide my night";
  if ($("txtB").textContent !== txt) $("txtB").textContent = txt;
}
window.render = render; window.END = 6.4; window.COVER = .9;
render(0);
</script>
</body>
</html>
