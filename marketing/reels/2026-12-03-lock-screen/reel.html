<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen during finals week</title>
<!--
  Set 3, fully animated (no stock footage). A phone lock screen at 2:47 AM; notifications drop in from frame 0, each one
  worse than the last (abrupt onsets every ~0.4 s), then Studyboard's own notification lands as the calm turn at 3.3 s.
  Native look: one static text block, music only, no logo card.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;
  background:radial-gradient(90% 60% at 20% 15%,#5B3FA8 0%,transparent 60%),radial-gradient(80% 60% at 90% 80%,#1F4E9E 0%,transparent 60%),linear-gradient(160deg,#241640,#0B1430 70%)}
#txt{position:absolute;left:70px;right:70px;top:250px;text-align:center;z-index:5}
.blk{display:inline;background:#fff;color:#000;font-weight:700;font-size:62px;line-height:1.38;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#date{position:absolute;left:0;right:0;top:420px;text-align:center;font-weight:600;font-size:46px;opacity:.9}
#time{position:absolute;left:0;right:0;top:470px;text-align:center;font-weight:700;font-size:250px;letter-spacing:-.03em;line-height:1}
#stack{position:absolute;left:44px;right:44px;top:800px}
.n{position:absolute;left:0;right:0;display:flex;gap:26px;align-items:flex-start;padding:30px 32px;border-radius:44px;
  background:rgba(245,245,250,.24);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.ic{flex:none;width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px}
.ic img{width:100%;height:100%;border-radius:20px}
.bd{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;font-size:37px;font-weight:600;line-height:1.2}
.hd span:last-child{font-weight:400;opacity:.75;font-size:30px}
.tx{font-size:37px;line-height:1.3;margin-top:4px;opacity:.96}
.n.sb{background:rgba(255,255,255,.88);color:#0F1F3D}
.n.sb .hd span:last-child{opacity:.6}
#cam{position:absolute;inset:0;transform-origin:50px 840px}
#txt{z-index:20}
</style>
</head>
<body>
<div id="stage">
  <div id="txt"><span class="blk">rate my lock screen 1–10 💀</span></div>
  <div id="cam"><div id="date">Thursday, December 10</div>
  <div id="time">2:47</div>
  <div id="stack"></div>
</div>
</div>
<script>
document.fonts.load("700 250px Inter"); document.fonts.load("600 52px Inter");
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const oBack = (x, c = 1.3) => { const d = c + 1; return 1 + d * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// [time it lands, icon html, icon bg, app, title, body, extra class]
const N = [
  [-0.12, "🎓", "#2D6BE4", "Student Portal", "Final Exam · BIOL 1200", "Tomorrow, 8:00 AM · Gym B"],
  [0.35, "💬", "#34C759", "bio study group 📚", "Jess", "did anyone actually start the study guide"],
  [0.75, "⏳", "#7A4FD6", "Screen Time", "Weekly report", "Your screen time was up 46% last week, an average of 7h 12m a day."],
  [1.15, "💬", "#34C759", "Mom", "Mom", "are you sleeping?? 😴"],
  [1.55, "🍔", "#FF8A3D", "Food delivery", "Almost there!", "Your 2:44 AM order is 3 minutes away."],
  [3.30, '<img src="{{ROOT}}/icon-512.png" alt="">', "transparent", "Studyboard", "Do this next", "Bio review, 25 min. Then sleep. You've got this 🌱", "sb"],
];
$("stack").innerHTML = N.map((n, i) => `<div class="n ${n[6] || ""}" id="n${i}"><div class="ic" style="background:${n[2]}">${n[1]}</div><div class="bd"><div class="hd"><span>${n[3]}</span><span>now</span></div><div class="tx"><b style="font-weight:600">${n[4]}</b><br>${n[5]}</div></div></div>`).join("");
const els = N.map((_, i) => $("n" + i));
let H = null;
const END = 6.0;
function render(t) {
  // Hook: open zoomed in on the most alarming detail, then pull back to reveal everything flooding in
  { const k = P(t, 0.35, 1.15), e = k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; $("cam").style.transform = `scale(${1.7 - (1.7 - 1) * e})`; }
  if (!H) H = els.map(e => e.offsetHeight + 22);
  // Newest on top: each landed notification pushes the older ones down (iOS order), smoothly
  const landed = N.map(n => oBack(P(t, n[0], n[0] + .32)));
  els.forEach((el, i) => {
    const k = landed[i];
    let y = 0; for (let j = i + 1; j < N.length; j++) y += H[j] * clamp(landed[j], 0, 1);
    el.style.opacity = clamp(P(t, N[i][0], N[i][0] + .12) * 1.0);
    el.style.transform = `translateY(${y - (1 - k) * 160}px) scale(${.9 + .1 * clamp(k, 0, 1.2)})`;
    el.style.zIndex = 10 + i;
  });
  // the older ones fade a little once Studyboard's lands, so it reads as the answer
  const calm = P(t, 3.3, 3.7); els.forEach((el, i) => { if (i < N.length - 1) el.style.filter = `brightness(${1 - .25 * calm})`; });
}
window.render = render; window.END = END; window.COVER = 1.9;
render(0);
</script>
</body>
</html>
