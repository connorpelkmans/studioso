<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A text from September</title>
<!--
  Set 4 · retention device: SUSPENSE (long typing dots before the reply everyone is waiting for).
  0.0  "a text from me in september:" + September's confident message already on screen
  2.0  the date jumps to "Dec 9, 2:47 AM"; 2.4-4.4 typing dots (the wait); 4.5 "lol"; 5.2 dots; 6.0 "who told you that"
  Music: lofi.wav intro, slowed + reverb.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Inter",system-ui,sans-serif;background:#fff;color:#000;-webkit-font-smoothing:antialiased}
#txt{position:absolute;left:60px;right:60px;top:230px;text-align:center;z-index:20}
.blk{display:inline;background:#000;color:#fff;font-weight:800;font-size:64px;line-height:1.36;padding:6px 18px;border-radius:14px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#who{position:absolute;left:0;right:0;top:400px;text-align:center}
#who i{display:inline-flex;width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#F2A33A,#E4713B);align-items:center;justify-content:center;font-size:64px;font-style:normal}
#who div{font-weight:700;font-size:44px;margin-top:10px}
.m{position:absolute;left:50px;max-width:860px;padding:30px 40px;border-radius:52px;font-size:58px;line-height:1.24;background:#E9E9EB;opacity:0}
.m.me{left:auto;right:50px;background:#1F8BFF;color:#fff}
.dt{position:absolute;left:0;right:0;text-align:center;font-size:36px;color:#8A8A90;font-weight:600;opacity:0}
.dt b{color:#3A3A3F}
.ty{position:absolute;right:50px;padding:40px 48px;border-radius:56px;background:#1F8BFF;display:flex;gap:18px;opacity:0}
.ty i{width:30px;height:30px;border-radius:50%;background:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="who"><i>🤓</i><div>me (september)</div></div>
  <div class="dt" id="d1" style="top:620px"><b>Sep 3</b> 9:12 AM</div>
  <div class="m" id="m1" style="top:690px">this term i'm staying on top of everything 📚✨</div>
  <div class="m" id="m2" style="top:1000px">color-coded notes. no all-nighters. starting early.</div>
  <div class="dt" id="d2" style="top:1300px"><b>Dec 9</b> 2:47 AM</div>
  <div class="ty" id="ty1" style="top:1370px"><i></i><i></i><i></i></div>
  <div class="m me" id="r1" style="top:1370px">lol</div>
  <div class="ty" id="ty2" style="top:1540px"><i></i><i></i><i></i></div>
  <div class="m me" id="r2" style="top:1540px">who told you that</div>
  <div id="txt"><span class="blk">a text from me in september:</span></div>
</div>
<script src="{{ROOT}}/marketing/reels/_shared/kit.js"></script>
<script>
const END = 6.8;
const dots = (el, t, a, b) => { const on = t >= a && t < b; el.style.opacity = on ? 1 : 0;
  el.querySelectorAll("i").forEach((d, j) => d.style.opacity = .35 + .65 * Math.max(0, Math.sin(t * 8 - j * .9))); };
const msg = (el, t, t0, right) => { el.style.transformOrigin = right ? "100% 100%" : "0% 100%"; popIn(el, t, t0, .6, .25); };
function render(t) {
  $("d1").style.opacity = 1; msg($("m1"), t, -1); msg($("m2"), t, .9);
  $("d2").style.opacity = P(t, 2.0, 2.2); $("d2").style.transform = `scale(${lerp(1.3, 1, oBack(P(t, 2.0, 2.25)))})`;
  dots($("ty1"), t, 2.3, 3.7); msg($("r1"), t, 3.7, true);
  dots($("ty2"), t, 4.3, 5.1); msg($("r2"), t, 5.1, true);
}
window.render = render; window.END = END; window.COVER = 1.2;
render(0);
</script>
</body>
</html>
