# A candidate to compare (Apache 2.0, no gated download). Note: if the training data came from a Gemma teacher, the result is a
# Gemma "model derivative" under Gemma's terms anyway; with gpt-oss or Qwen teachers it stays Apache 2.0.
base_model: Qwen/Qwen3-1.7B
output_dir: ml/out/qwen3-1.7b-sft
load_4bit: false
lora: {r: 32, alpha: 64, dropout: 0.05, targets: all-linear}
data: {train: ml/data/train/sft.jsonl, eval: ml/data/train/sft_dev.jsonl}
train: {epochs: 2, batch: 4, grad_accum: 4, lr: 2.0e-4, max_length: 5400}
dpo: {train: ml/data/train/dpo.jsonl, beta: 0.1, lr: 5.0e-6, epochs: 1, batch: 2, grad_accum: 8}
webllm: {base_id: Qwen3-1.7B-q4f16_1-MLC, conv_template: qwen2, quant: q4f16_1, context: 4096, lib: Qwen3-1.7B-q4f16_1-ctx4k_cs1k-webgpu.wasm}
