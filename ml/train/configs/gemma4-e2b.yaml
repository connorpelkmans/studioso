# The main model: Gemma 4 E2B, WebLLM's "big" download today (about 2.8 GB at 4-bit). LoRA; QLoRA (load_4bit) fits 12-16 GB.
base_model: google/gemma-4-E2B-it
output_dir: ml/out/gemma4-e2b-sft
load_4bit: true
lora: {r: 32, alpha: 64, dropout: 0.05, targets: all-linear}
data: {train: ml/data/train/sft.jsonl, eval: ml/data/train/sft_dev.jsonl}
train: {epochs: 2, batch: 2, grad_accum: 8, lr: 1.5e-4, max_length: 5400, eval_every: 200, save_every: 400}
dpo: {train: ml/data/train/dpo.jsonl, beta: 0.1, lr: 5.0e-6, epochs: 1, batch: 1, grad_accum: 16}
webllm: {base_id: gemma-4-E2B-it-q4f16_1-MLC, conv_template: gemma3_instruction, quant: q4f16_1, context: 4096, lib: gemma-4-E2B-it-q4f16_1_cs512-webgpu.wasm}
