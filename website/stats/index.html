<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Launch Stats - Studyboard</title>
<link rel="icon" type="image/png" href="../assets/icon-192.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="stats.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/website/" aria-label="Studyboard home"><img class="logo-l" src="../assets/logo-light.webp" alt="" width="136" height="30"><img class="logo-d" src="../assets/logo-dark.webp" alt="" width="136" height="30"></a>
    <nav class="main" aria-label="Main">
      <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </nav>
  </div>
</header>
<main id="main" class="st">
  <div class="wrap">
    <div class="st-head">
      <div><h1>Launch Stats</h1><p class="st-sub" id="st-sub">Totals only. No one is tracked.</p></div>
      <label class="st-range">Show <select id="st-days"><option value="14">2 weeks</option><option value="30" selected>30 days</option><option value="60">60 days</option><option value="90">90 days</option></select></label>
    </div>
    <div id="st-msg" class="panel" role="status">Loading…</div>
    <div id="st-body" hidden>
      <h2 class="st-h">Today So Far</h2>
      <div class="st-tiles" id="st-today"></div>
      <h2 class="st-h">Coming Back</h2>
      <p class="st-note">Of the accounts made in this period, how many opened Studyboard again 1, 7 and 30 days later. Only days that have fully passed count.</p>
      <div class="st-tiles st-tiles-3" id="st-ret"></div>
      <h2 class="st-h">Every Day</h2>
      <div class="st-charts" id="st-charts"></div>
      <h2 class="st-h">Each Day's New Accounts</h2>
      <div class="st-table-wrap"><table class="st-table" id="st-cohorts"></table></div>
      <h2 class="st-h">All Numbers</h2>
      <div class="st-table-wrap"><table class="st-table" id="st-days-table"></table></div>
      <p class="st-note" id="st-foot"></p>
    </div>
  </div>
</main>
<script src="../config.js"></script>
<script src="../assets/site.js"></script>
<script src="../vendor/supabase-js-2.117.2.umd.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
<script src="stats.js"></script>
</body>
</html>
