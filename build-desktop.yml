# TEMPLATE for the nested layout (desktop/ folder). It does NOT run from the repo root;
# the working copy for this repository is .github/workflows/build-desktop.yml.
name: Build Studyboard desktop app

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "unsigned (default builds), signed (Developer ID + notarized DMG) or mas (Mac App Store package)"
        type: choice
        options: [unsigned, signed, mas]
        default: unsigned
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.kind == 'unsigned'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: desktop/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: desktop/dist/*.dmg
          - os: macos-15-intel
            script: dist:mac-intel
            files: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Studyboard-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}

  # ---------------------------------------------------------------------------------------------------------------
  # Signed + notarized macOS DMG (Developer ID) and the Mac App Store package. Manual runs only (Actions > Run workflow),
  # because they need your Apple Developer account. See APP-STORE-CHECKLIST.md for how to create each secret.
  #   CSC_LINK / CSC_KEY_PASSWORD            Developer ID Application certificate (.p12, base64) + its password
  #   MAS_CSC_LINK / MAS_CSC_KEY_PASSWORD    "Apple Distribution" or "3rd Party Mac Developer Application" certificate (.p12, base64)
  #   MAS_INSTALLER_LINK                     "3rd Party Mac Developer Installer" certificate (.p12, base64, same password as MAS_CSC_KEY_PASSWORD)
  #   MAS_PROFILE_BASE64                     the Mac App Store provisioning profile, base64
  #   APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER   App Store Connect API key (notarization and upload)
  #   APPLE_TEAM_ID
  # ---------------------------------------------------------------------------------------------------------------
  mac-signed:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'signed'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Write the notarization key
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      - run: npm run dist:mac-signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REQUIRE_NOTARIZATION: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: Studyboard-mac-signed
          path: desktop/dist/*.dmg

  mac-store:
    if: github.event_name == 'workflow_dispatch' && inputs.kind == 'mas'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Provisioning profile
        run: echo "$MAS_PROFILE_BASE64" | base64 --decode > build-resources/Studyboard_MAS.provisionprofile
        env:
          MAS_PROFILE_BASE64: ${{ secrets.MAS_PROFILE_BASE64 }}
      - run: npm run check:store
      - run: npm run dist:mas
        env:
          CSC_LINK: ${{ secrets.MAS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Studyboard-mas
          path: desktop/dist/mas*/*.pkg
